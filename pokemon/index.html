<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon</title>
<meta name="description" content="Gestor do RPG de Pokémon: treinadores, criaturas, bolsa e combate.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokémon">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- login por PIN do site: tem que vir antes de tudo -->
<script src="../shared/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="dex-top">
  <div class="dex-lens" aria-hidden="true"><span class="lens-glass"></span></div>
  <div class="dex-leds" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
  <div class="dex-title"><b>Pokémon</b><small>Gestor da campanha</small></div>
  <div class="dex-right">
    <button class="who" id="who" type="button" hidden title="Sair">
      <span id="whoRole"></span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg>
    </button>
    <button class="power-btn" type="button" data-power-off title="Desligar — voltar pro Subrosa" aria-label="Desligar e voltar pro Subrosa">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.9a8 8 0 1 0 11.2 0"/></svg>
    </button>
  </div>
</header>

<nav class="dex-nav" aria-label="Seções">
  <a class="tab" data-tab="treinadores" href="#treinadores">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.6-6 7.5-6s6.7 2 7.5 6"/></svg>
    <span>Treinadores</span>
  </a>
  <a class="tab" data-tab="criaturas" href="#criaturas">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h5.5M15.5 12H21"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Criaturas</span>
  </a>
  <a class="tab" data-tab="bolsa" href="#bolsa">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1.2 12H4.8L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/><path d="M9.5 13h5"/></svg>
    <span>Bolsa</span>
  </a>
  <a class="tab" data-tab="combate" href="#combate">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 19 4l-1.5 4.5L9 17l-3-3 8.5-8.5z"/><path d="M5 19l2.2-2.2M3 21l2-2"/><path d="M9.5 5.5 5 4l1.5 4.5L9 11"/><path d="M19 19l-2.2-2.2M21 21l-2-2"/></svg>
    <span>Combate</span>
  </a>
</nav>

<main id="view" aria-live="polite"></main>

<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/cropper.js"></script>
<script src="js/trainers.js"></script>
<script src="js/creatures.js"></script>
<script src="js/app.js"></script>
<script>window.SUBROSA_PWA = { id:'pokemon', title:'o Pokémon', swPath:'../sw.js', icon:'icons/icon-192.png' };</script>
<script src="../shared/pwa.js"></script>
</body>
</html>

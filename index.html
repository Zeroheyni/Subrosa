function renderNetWorthChart(){
  const past = (state.history || []).map(h => ({
    day: h.day,
    total: (h.clean ? h.clean.balance : 0) + (h.dirty ? h.dirty.balance : 0)
  }));
  const points = [...past, { day: state.day, total: state.clean.balance + state.dirty.balance }];
  const last = points.slice(-60);
  if(last.length < 2){
    return '<div class="empty-state">Avance mais alguns dias pra ver a curva de patrimônio.</div>';
  }
  const values = last.map(p=>p.total);
  const minV = Math.min(...values, 0);
  const maxV = Math.max(...values, 1);
  const range = Math.max(1, maxV - minV);
  const W = 100, H = 100;
  const stepX = W / (last.length - 1);
  const coords = last.map((p,i)=>{
    const x = i * stepX;
    const y = H - ((p.total - minV) / range) * H;
    return [x, y];
  });
  const pathD = coords.map(([x,y],i)=> (i===0?'M':'L') + x.toFixed(2) + ',' + y.toFixed(2)).join(' ');
  const areaD = `${pathD} L${W},${H} L0,${H} Z`;
  const first = last[0].total, current = last[last.length-1].total;
  const growth = current - first;
  return `
    <div class="chart-wrap">
      <svg class="networth-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="nwGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent-1)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="var(--accent-1)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaD}" fill="url(#nwGrad)" stroke="none"></path>
        <path d="${pathD}" fill="none" stroke="var(--accent-1)" stroke-width="1.6" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div class="chart-legend">
        <div class="item">Início do período: <strong style="margin-left:4px;">${fmt(first)}</strong></div>
        <div class="item">Agora: <strong style="margin-left:4px;">${fmt(current)}</strong></div>
        <div class="item">Variação: <strong style="color:${growth>=0?'var(--clean-1)':'var(--danger)'};margin-left:4px;">${fmtSigned(growth)}</strong></div>
      </div>
    </div>
  `;
}

function renderOverviewChart(txns){
  if(!txns.length){
    return '<div class="empty-state">Sem movimentação suficiente pra montar o gráfico ainda.</div>';
  }
  // agrupa por dia (net = ganhos - perdas)
  const byDay = {};
  txns.forEach(t=>{ byDay[t.day] = (byDay[t.day]||0) + t.amount; });
  const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  const lastDays = days.slice(-14);
  const values = lastDays.map(d=>byDay[d]);
  const maxAbs = Math.max(1, ...values.map(v=>Math.abs(v)));

  const cols = lastDays.map((d,i)=>{
    const v = values[i];
    const h = Math.max(2, Math.round((Math.abs(v)/maxAbs)*42));
    const isPos = v >= 0;
    const color = isPos ? 'var(--clean-1)' : 'var(--danger)';
    const posStyle = isPos ? `bottom:50%;height:${h}px;` : `top:50%;height:${h}px;`;
    return `
      <div class="chart-col" title="Dia ${d}: ${fmtSigned(v)}">
        <div class="chart-zero"></div>
        <div class="chart-bar" style="position:absolute;left:10%;right:10%;${posStyle}background:${color};"></div>
      </div>`;
  }).join('');

  const totalNet = values.reduce((s,v)=>s+v,0);
  return `
    <div class="chart-wrap">
      <div class="chart-bars">${cols}</div>
      <div class="chart-legend">
        <div class="item"><span class="sw" style="background:var(--clean-1)"></span>Ganho no dia</div>
        <div class="item"><span class="sw" style="background:var(--danger)"></span>Perda no dia</div>
        <div class="item">Saldo do período: <strong style="color:${totalNet>=0?'var(--clean-1)':'var(--danger)'};margin-left:4px;">${fmtSigned(totalNet)}</strong></div>
      </div>
    </div>
  `;
}

function renderTxnList(txns){
  if(!txns.length) return '<div class="empty-state">Nenhuma transação ainda. Avance o dia para gerar movimentação.</div>';

}

// barrinha de progresso pra contagens regressivas (congelamento, evento
// ativo) — some sozinha se não tiver o total guardado (dado antigo)
function renderCountdownBar(daysLeft, daysTotal, color){
  if(!daysTotal || daysTotal <= 0) return '';
  const pct = Math.max(0, Math.min(100, Math.round(100 * (1 - daysLeft/daysTotal))));
  return `<div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div>`;
}

      ` : ''}
      ${b.frozenDaysLeft>0?`

function syncCharacterFormFromDom(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
  if($('#mName')) ui.modalData.name = $('#mName').value;
  if($('#mRole')) ui.modalData.role = $('#mRole').value;
  if($('#mDescription')) ui.modalData.description = $('#mDescription').value;
  if($('#mAssignedTo')) ui.modalData.assignedTo = $('#mAssignedTo').value;
  const stats = $$('[data-mod-stat]');
  const percents = $$('[data-mod-percent]');
  const modifiers = [];
  stats.forEach((el,i)=>{ modifiers.push({ stat: el.value, percent: parseFloat(percents[i].value) || 0 }); });
  ui.modalData.modifiers = modifiers;
}

// helper compartilhado — sobe um arquivo (do seletor ou colado da área de
// transferência) pro bucket game-images e devolve a URL pública
async function uploadGameImage(file){
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${(file.name||'colada.png').replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error } = await sb.storage.from('game-images').upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from('game-images').getPublicUrl(path);
  return data.publicUrl;
}

function handleCharacterPhotoUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    try{
      const url = await uploadGameImage(file);
      syncCharacterFormFromDom();
      ui.modalData.photo = url;
      render();
    } catch(e){
      console.error('Falha ao enviar foto', e);
      showToast('Não consegui enviar a foto. Tenta de novo.');
    }
  };
  input.click();
}

/* ---------------- CALENDÁRIO ---------------- */
function ensureCalView(){
  if(ui.calYear == null || ui.calMonth == null){
    const d = dayToDate(state.day);
    ui.calYear = d.year;
    ui.calMonth = d.month;
  }
}

function renderCalendario(){
  ensureCalView();
  const year = ui.calYear;
  const month = ui.calMonth;
  const monthLength = MONTH_LENGTHS[month];
  const firstDay = firstDayNumberOfMonth(year, month);
  const todayDate = dayToDate(state.day);
  const isCurrentMonth = todayDate.year===year && todayDate.month===month;

  const cells = [];
  for(let i=0;i<monthLength;i++){
    const dayNum = firstDay + i;
    const dayOfMonth = i + 1;
    const hasEvent = state.events.some(e=> e.day===dayNum || (e.recurring && dayNum>=e.day && (!e.recurEndDay||dayNum<=e.recurEndDay)));
    const isToday = dayNum === state.day;
    cells.push(`<div class="month-day-cell ${isToday?'today':''}" data-goto-day="${dayNum}">
      <div class="n">${dayOfMonth}</div>
      ${hasEvent?'<div class="dot"></div>':''}
    </div>`);
  }

  const monthEvents = [...state.events]
    .filter(e => {
      const evStart = dayToDate(e.day);
      if(e.recurring){
        const endDay = e.recurEndDay || (firstDay + monthLength - 1);
        return e.day <= (firstDay + monthLength - 1) && endDay >= firstDay;
      }
      return evStart.year===year && evStart.month===month;
    })
    .sort((a,b)=>a.day-b.day);

  const notifs = state.notifications.slice(0,10);

  return `
    <div class="cal-nav">
      <button class="icon-btn" id="calPrevYear" title="Ano anterior">«</button>
      <button class="icon-btn" id="calPrevMonth" title="Mês anterior">‹</button>
      <div class="cal-nav-label">
        <div class="cal-month">${MONTH_NAMES[month]}</div>
        <div class="cal-year">${year}</div>
      </div>
      <button class="icon-btn" id="calNextMonth" title="Próximo mês">›</button>
      <button class="icon-btn" id="calNextYear" title="Próximo ano">»</button>
    </div>
    ${!isCurrentMonth ? `<div class="cal-today-link" id="calGoToday">↺ voltar para ${formatDateShort(state.day)}</div>` : ''}

    <div class="card">
      <div class="month-grid">${cells.join('')}</div>
    </div>

    <div class="section-title">Eventos em ${MONTH_NAMES[month]} <span class="add-link" data-action="addEvent">+ novo</span></div>
    ${monthEvents.length ? monthEvents.map(e=>renderEventCard(e)).join('') : '<div class="empty-state">Nenhum evento marcado para este mês.</div>'}

    <div class="section-title">Registro de acontecimentos</div>
    <div class="card">
      ${notifs.length ? notifs.map(n=>`
        <div class="notif">
          <div class="notif-icon">${n.icon}</div>
          <div class="notif-body">
            <div class="notif-text">${n.text}</div>
            <div class="notif-day">${formatDateShort(n.day)}</div>
          </div>
        </div>`).join('') : '<div class="empty-state">Nada registrado ainda.</div>'}
    </div>
  `;
}

function renderEventCard(e){
  const targetName = e.targetType==='business' ? state.businesses.find(b=>b.id===e.targetId)?.name
    : e.targetType==='property' ? state.properties.find(p=>p.id===e.targetId)?.name : null;
  return `
    <div class="event-card" style="margin-bottom:10px;">
      <div class="event-head">
        <div class="event-title">${e.title}</div>
        <div class="event-day">${formatDateShort(e.day)}${e.recurring?` → ${e.recurEndDay?formatDateShort(e.recurEndDay):'∞'}`:''}</div>

      <div class="field"><label>Título</label><input id="mTitle" placeholder="Ex: Fornecedor atrasa entrega"></div>
      <div class="field"><label>Descrição (opcional)</label><textarea id="mDesc"></textarea></div>
      <div class="field"><label>Dia do evento (nº absoluto)</label><input id="mDay" type="number" value="${defaultDay}" oninput="document.getElementById('mDayHint').textContent = formatDate(parseInt(this.value)||1)"></div>

      ${isMaster ? `
      <div class="field"><label>Tipo</label>
        <div class="seg-group">
          <div class="seg-opt active" data-seg="etype" data-val="visual">Apenas visual</div>
          <div class="seg-opt" data-seg="etype" data-val="efeito">Com efeito</div>
        </div>

      <div id="effectFields" style="display:none;">
        <div class="field"><label>Afeta</label>
          <select id="mTargetType">
            <option value="none">Nenhum alvo específico (saldo geral)</option>
            <option value="business">Um negócio</option>
            <option value="property">Uma propriedade</option>
          </select>

        <div class="field" id="targetIdField" style="display:none;"><label>Selecionar</label>
          <select id="mTargetId">${bizOpts}${propOpts}</select>
        </div>
        <div class="field-row">
          <div class="field"><label>Tipo de valor</label>
            <select id="mValueType"><option value="fixed">Fixo (Ⓢ)</option><option value="percent">Percentual (%)</option></select>

          <div class="field"><label>Valor (use negativo p/ gasto)</label><input id="mValue" type="number" placeholder="0"></div>

        <div class="field"><label>Modo afetado</label>
          <div class="seg-group">
            <div class="seg-opt active" data-seg="emode" data-val="limpo">Limpo</div>
            <div class="seg-opt" data-seg="emode" data-val="sujo">Sujo</div>
          </div>
        </div>
        <div class="field"><label>Recorrência</label>
          <div class="seg-group">
            <div class="seg-opt active" data-seg="erecur" data-val="no">Único</div>
            <div class="seg-opt" data-seg="erecur" data-val="yes">Recorrente</div>
          </div>
        </div>
        <div class="field" id="recurEndField" style="display:none;"><label>Recorrente até o dia</label><input id="mRecurEnd" type="number"></div>
      </div>
      ` : `<div class="hint">Sua marcação será registrada como um evento visual (sem efeito automático no saldo).</div>`}
    `;
  }

  if(type === 'addResearch'){
    title = 'Nova pesquisa';
    body = `
      <div class="field"><label>Nome</label><input id="mName" placeholder="Ex: Soro da regeneração"></div>
      <div class="field"><label>Tipo</label>
        <div class="seg-group">
          <div class="seg-opt active" data-seg="rlegal" data-val="legal">Legal</div>
          <div class="seg-opt" data-seg="rlegal" data-val="ilegal">Ilegal</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Duração</label><input id="mDurationValue" type="number" value="20" placeholder="20"></div>
        <div class="field"><label>Unidade</label>
          <select id="mDurationUnit">
            <option value="dias">Dias</option>
            <option value="semanas">Semanas</option>
            <option value="meses">Meses</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Negócio associado (opcional)</label>
        <select id="mResearchBusiness">
          <option value="">Nenhum</option>
          ${state.businesses.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Notas (opcional)</label><textarea id="mNotes"></textarea></div>
      <div class="hint">Quando concluída, só dispara um aviso — você decide manualmente o que fazer a seguir.</div>
    `;
  }

  if(type === 'researchDetail'){
    const r = state.researches.find(x=>x.id===ui.modalData.id);
    title = r.name;
    const biz = r.businessId ? state.businesses.find(b=>b.id===r.businessId) : null;
    if(!isMaster){
      body = `
        <div class="hint">${r.legal?'Pesquisa legal':'Pesquisa ilegal'} · ${r.completed?'concluída':`${Math.round(r.daysElapsed)}/${r.durationDays} dias`}</div>
        ${biz?`<div class="hint">Ligada ao negócio: ${biz.name}</div>`:''}
        ${r.notes?`<div class="hint" style="margin-top:8px;">${r.notes}</div>`:''}
      `;
    } else {
      body = `
        <div class="field-row">
          <div class="field"><label>Dias decorridos</label><input id="mDaysElapsed" type="number" value="${Math.round(r.daysElapsed)}"></div>
          <div class="field"><label>Duração total (dias)</label><input id="mDurationDays" type="number" value="${r.durationDays}"></div>
        </div>
        <div class="field"><label>Notas</label><textarea id="mNotes">${r.notes||''}</textarea></div>
        <div class="modal-actions">
          <button class="btn btn-danger btn-sm" id="deleteResearch">Remover</button>
        </div>
      `;
    }
  }

  if(type === 'addCharacter'){
    title = 'Novo personagem';
    body = renderCharacterForm(null);
  }

  if(type === 'characterDetail'){
    const c = state.characters.find(x=>x.id===ui.modalData.id);
    title = c.name;
    if(!isMaster){
      body = `
        <div class="char-photo" style="width:100%;height:140px;margin-bottom:12px;${c.photo?`background-image:url('${c.photo}')`:''}">${c.photo?'':'👤'}</div>
        ${c.role ? `<div class="hint"><strong>${c.role}</strong></div>` : ''}
        ${c.description ? `<div class="hint" style="margin-top:6px;">${c.description}</div>` : ''}
        <div class="hint" style="margin-top:8px;">${assignedToLabel(c)}</div>
        ${(c.modifiers||[]).length ? `<div class="char-mods" style="margin-top:8px;">${c.modifiers.map(m=>`<span class="char-mod-badge ${m.percent>=0?'pos':'neg'}">${(STAT_LABELS[m.stat]||m.stat)} ${m.percent>0?'+':''}${m.percent}%</span>`).join('')}</div>` : ''}
      `;
    } else {
      body = renderCharacterForm(c) + `
        <div class="modal-actions">
          <button class="btn btn-danger btn-sm" id="deleteCharacter">Remover</button>
        </div>
      `;
    }
  }

  return `
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${title}</div>
        <div class="icon-btn" id="closeModal">✕</div>
      </div>
      ${body}
      ${(type === 'diceRoller' || (type === 'characterDetail' && !isMaster)) ? '' : `
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelModal">Cancelar</button>
        <button class="btn btn-accent" id="confirmModal">Salvar</button>
      </div>
      `}
    </div>
  </div>`;
}

/* ============================================================
   HANDLERS
   ============================================================ */
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  const modeCatBtn = $('#modeCatBtn');
  if(modeCatBtn) modeCatBtn.onclick = ()=> toggleMode(modeCatBtn);

  const homeModeBtn = $('#homeModeBtn');
  if(homeModeBtn) homeModeBtn.onclick = ()=> toggleMode(homeModeBtn);

  const homeExitMaster = $('#homeExitMaster');
  if(homeExitMaster) homeExitMaster.onclick = ()=>{
    if(isMaster && confirm('Sair do modo mestre? Você vai continuar vendo o jogo, só que como jogador.')){
      logoutMaster();
    }
  };

  $$('[data-open-app]').forEach(el=>{
    el.onclick = ()=>{
      const app = PHONE_APPS.find(a => a.id === el.dataset.openApp);
      if(app){
        rememberAppOrigin(app.id, el);
        app.open();
      }
    };
  });
  $$('[data-go-home]').forEach(el=>{ el.onclick = goHome; });

  const btnBack = $('#btnBack');
  if(btnBack) btnBack.onclick = ()=>{ if(!btnBack.disabled) goBackDay(); };

  const btnForward = $('#btnForward');
  if(btnForward) btnForward.onclick = ()=> advanceDay();

  $$('.tab-btn').forEach(el=>{
    el.onclick = ()=>{ ui.bankTab = el.dataset.tab; render(); };
  });
  $$('.subtab').forEach(el=>{
    el.onclick = ()=>{ state.investSubTab = el.dataset.subtab; saveState(); render(); };
  });

  $$('[data-action]').forEach(el=>{
    el.onclick = ()=>{
      const a = el.dataset.action;
      if(a==='editBalance') openModal('editBalance');
      if(a==='addExpense') openModal('addExpense');
      if(a==='addIncome') openModal('addIncome');
      if(a==='addBusiness') openModal('addBusiness');
      if(a==='addProperty') openModal('addProperty');
      if(a==='addEvent') openModal('addEvent');
      if(a==='addResearch') openModal('addResearch');
      if(a==='addCharacter') openModal('addCharacter', { modifiers: [] });
    };
  });

  $$('[data-edit-income]').forEach(el=>{
    el.onclick = ()=> openModal('fixedIncomeDetail', { id: el.dataset.editIncome });
  });
  $$('[data-edit-expense]').forEach(el=>{
    el.onclick = ()=> openModal('fixedExpenseDetail', { id: el.dataset.editExpense });
  });

  const calPrevMonth = $('#calPrevMonth');
  if(calPrevMonth) calPrevMonth.onclick = ()=>{
    ensureCalView();
    ui.calMonth -= 1;
    if(ui.calMonth < 0){ ui.calMonth = 11; ui.calYear -= 1; }
    render();
  };
  const calNextMonth = $('#calNextMonth');
  if(calNextMonth) calNextMonth.onclick = ()=>{
    ensureCalView();
    ui.calMonth += 1;
    if(ui.calMonth > 11){ ui.calMonth = 0; ui.calYear += 1; }
    render();
  };
  const calPrevYear = $('#calPrevYear');
  if(calPrevYear) calPrevYear.onclick = ()=>{ ensureCalView(); ui.calYear -= 1; render(); };
  const calNextYear = $('#calNextYear');
  if(calNextYear) calNextYear.onclick = ()=>{ ensureCalView(); ui.calYear += 1; render(); };
  const calGoToday = $('#calGoToday');
  if(calGoToday) calGoToday.onclick = ()=>{
    const d = dayToDate(state.day);
    ui.calYear = d.year; ui.calMonth = d.month;
    render();
  };
  $$('[data-goto-day]').forEach(el=>{
    el.onclick = ()=>{
      openModal('addEvent', { presetDay: parseInt(el.dataset.gotoDay) });
    };
  });


  $$('[data-open-business]').forEach(el=>{
    el.onclick = ()=> openModal('businessDetail', { id: el.dataset.openBusiness });
  });
  $$('[data-open-property]').forEach(el=>{
    el.onclick = ()=> openModal('propertyDetail', { id: el.dataset.openProperty });
  });
  $$('[data-open-research]').forEach(el=>{
    el.onclick = ()=> openModal('researchDetail', { id: el.dataset.openResearch });
  });
  $$('[data-open-character]').forEach(el=>{
    el.onclick = ()=> openModal('characterDetail', { id: el.dataset.openCharacter, modifiers: null });
  });

  // modal generic
  const overlay = $('#overlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
    $('#closeModal') && ($('#closeModal').onclick = closeModal);
    $('#cancelModal') && ($('#cancelModal').onclick = closeModal);

    if(ui.modal === 'diceRoller'){
      $$('[data-dice]').forEach(el=>{
        el.onclick = ()=> rollDice(el.dataset.dice, null);
      });
      const diceRollCustom = $('#diceRollCustom');
      const diceCustomSides = $('#diceCustomSides');
      if(diceRollCustom) diceRollCustom.onclick = ()=>{
        const sides = parseInt(diceCustomSides.value);
        if(!sides || sides < 2){ showToast('Digita um número de lados válido (2 ou mais).'); return; }
        rollDice('custom', sides);
      };
    }

    if((ui.modal === 'addCharacter' || ui.modal === 'characterDetail') && isMaster){
      const charPhotoBtn = $('#charPhotoBtn');
      if(charPhotoBtn) charPhotoBtn.onclick = handleCharacterPhotoUpload;
      const addModifierRow = $('#addModifierRow');
      if(addModifierRow) addModifierRow.onclick = ()=>{
        syncCharacterFormFromDom();
        ui.modalData.modifiers.push({ stat: 'income', percent: 0 });
        render();
      };
      $$('[data-remove-mod]').forEach(el=>{
        el.onclick = ()=>{
          syncCharacterFormFromDom();
          ui.modalData.modifiers.splice(parseInt(el.dataset.removeMod), 1);
          render();
        };
      });
    }

    $$('.seg-opt').forEach(el=>{
      el.onclick = ()=>{
        const group = el.dataset.seg;
        $$(`.seg-opt[data-seg="${group}"]`).forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        if(ui.modal==='addEvent') updateEventFieldsVisibility();
      };
    });

    if(ui.modal==='addEvent'){
      updateEventFieldsVisibility();
      const targetTypeSel = $('#mTargetType');
      if(targetTypeSel) targetTypeSel.onchange = updateEventFieldsVisibility;
    }

    $('#confirmModal') && ($('#confirmModal').onclick = handleConfirm);

    $('#forceHeat') && ($('#forceHeat').onclick = ()=>{
      const b = state.businesses.find(x=>x.id===ui.modalData.id);
      const tier = b.heat>80?'invasao':b.heat>50?'congelamento':'investigacao';
      triggerHeatEvent(b, tier, false);
      saveState(); closeModal();
    });
    $('#deleteBusiness') && ($('#deleteBusiness').onclick = ()=>{
      state.businesses = state.businesses.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#forceBuff') && ($('#forceBuff').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      triggerPropertyEvent(p, 'buff', false);
      saveState(); closeModal();
    });
    $('#forceDebuff') && ($('#forceDebuff').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      triggerPropertyEvent(p, 'debuff', false);
      saveState(); closeModal();
    });
    $('#forcePropertyHeat') && ($('#forcePropertyHeat').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      const tier = p.heat>80?'invasao':p.heat>50?'congelamento':'investigacao';
      triggerPropertyHeatEvent(p, tier);
      saveState(); closeModal();
    });
    $('#deleteProperty') && ($('#deleteProperty').onclick = ()=>{
      state.properties = state.properties.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteResearch') && ($('#deleteResearch').onclick = ()=>{
      state.researches = state.researches.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteIncome') && ($('#deleteIncome').onclick = ()=>{
      state.clean.fixedIncomes = state.clean.fixedIncomes.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteExpense') && ($('#deleteExpense').onclick = ()=>{
      state.clean.fixedExpenses = state.clean.fixedExpenses.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteCharacter') && ($('#deleteCharacter').onclick = ()=>{
      state.characters = state.characters.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
  }
}

async function handleConfirmAsync(){
  const $ = sel => document.querySelector(sel);
  const type = ui.modal;

  if(type === 'editBalance'){
    const newBalance = parseFloat($('#mBalance').value) || 0;
    if(state.mode === 'limpo'){
      state.clean.balance = newBalance;
      state.clean.credit = parseFloat($('#mCredit').value) || 0;
    } else {
      state.dirty.balance = newBalance;
    }
    saveState(); closeModal(); showToast('Saldo atualizado.'); return;
  }

  if(type === 'addExpense'){
    const label = $('#mLabel').value.trim() || 'Gasto sem nome';
    const amount = parseFloat($('#mAmount').value) || 0;
    state.clean.fixedExpenses.push({ id: uid('exp'), label, amount });
    saveState(); closeModal(); showToast('Gasto fixo adicionado.'); return;
  }

  if(type === 'addIncome'){
    const label = $('#mLabel').value.trim() || 'Ganho sem nome';
    const amount = parseFloat($('#mAmount').value) || 0;
    state.clean.fixedIncomes.push({ id: uid('inc'), label, amount });
    saveState(); closeModal(); showToast('Ganho fixo adicionado.'); return;
  }

  if(type === 'fixedIncomeDetail'){
    if(!isMaster){ closeModal(); return; }
    const inc = state.clean.fixedIncomes.find(x=>x.id===ui.modalData.id);
    inc.label = $('#mLabel').value.trim() || 'Ganho sem nome';
    inc.amount = parseFloat($('#mAmount').value) || 0;
    saveState(); closeModal(); showToast('Ganho fixo atualizado.'); return;
  }

  if(type === 'fixedExpenseDetail'){
    if(!isMaster){ closeModal(); return; }
    const exp = state.clean.fixedExpenses.find(x=>x.id===ui.modalData.id);
    exp.label = $('#mLabel').value.trim() || 'Gasto sem nome';
    exp.amount = parseFloat($('#mAmount').value) || 0;
    saveState(); closeModal(); showToast('Gasto fixo atualizado.'); return;
  }

  if(type === 'addBusiness'){
    const name = $('#mName').value.trim() || 'Negócio sem nome';
    const status = document.querySelector('.seg-opt[data-seg="status"].active').dataset.val;
    const investment = parseFloat($('#mInvestment').value) || 0;
    const days = parseFloat($('#mDays').value) || 10;
    const income = parseFloat($('#mIncome').value) || 0;
    const launderEl = $('#mLaunder');
    const launderPercent = launderEl ? (parseFloat(launderEl.value) || 0) : 0;
    state.businesses.push({
      id: uid('biz'), name, illegal: state.mode==='sujo',
      status, investment, daysToComplete: days, daysElapsed: 0,
      dailyIncome: income, launderPercent, heat: 0, frozenDaysLeft: 0
    });
    saveState(); closeModal(); showToast('Negócio criado.'); return;
  }

  if(type === 'addProperty'){
    const name = $('#mName').value.trim() || 'Propriedade sem nome';
    const income = parseFloat($('#mIncome').value) || 0;
    const maint = parseFloat($('#mMaint').value) || 0;
    const employees = parseInt($('#mEmployees').value) || 0;
    const launderEl = $('#mLaunder');
    const launderPercent = launderEl ? (parseFloat(launderEl.value) || 0) : 0;
    state.properties.push({
      id: uid('prop'), name, illegal: state.mode==='sujo',
      dailyIncome: income, maintenance: maint, employees,
      launderPercent, heat: 0, frozenDaysLeft: 0, activeEvent: null
    });
    saveState(); closeModal(); showToast('Propriedade criada.'); return;
  }

  if(type === 'businessDetail'){
    const b = state.businesses.find(x=>x.id===ui.modalData.id);
    const launderEl = $('#mLaunder');
    if(isMaster){
      if(launderEl) b.launderPercent = parseFloat(launderEl.value) || 0;
      const incomeEl = $('#mIncome');
      if(incomeEl) b.dailyIncome = parseFloat(incomeEl.value) || 0;
      saveState(); closeModal(); showToast('Negócio atualizado.'); return;
    } else {
      if(!launderEl){ closeModal(); return; }
      const percent = parseFloat(launderEl.value) || 0;
      try{
        const { error } = await sb.rpc('player_set_launder_percent', {
          entity_type: 'business', entity_id: b.id, percent
        });
        if(error) throw error;
        closeModal(); showToast('Hiperfaturamento ajustado.');
      } catch(e){
        showToast('Não consegui salvar. Tenta de novo.');
      }
      return;
    }
  }

  if(type === 'propertyDetail'){
    const p = state.properties.find(x=>x.id===ui.modalData.id);
    const launderEl = $('#mLaunder');
    if(isMaster){
      const incomeEl = $('#mIncome');
      const maintEl = $('#mMaint');
      const empEl = $('#mEmployees');
      if(incomeEl) p.dailyIncome = parseFloat(incomeEl.value) || 0;
      if(maintEl) p.maintenance = parseFloat(maintEl.value) || 0;
      if(empEl) p.employees = parseInt(empEl.value) || 0;
      if(launderEl) p.launderPercent = parseFloat(launderEl.value) || 0;
      saveState(); closeModal(); showToast('Propriedade atualizada.'); return;
    } else {
      if(!launderEl){ closeModal(); return; }
      const percent = parseFloat(launderEl.value) || 0;
      try{
        const { error } = await sb.rpc('player_set_launder_percent', {
          entity_type: 'property', entity_id: p.id, percent
        });
        if(error) throw error;
        closeModal(); showToast('Hiperfaturamento ajustado.');
      } catch(e){
        showToast('Não consegui salvar. Tenta de novo.');
      }
      return;
    }
  }

  if(type === 'addEvent'){
    const title = $('#mTitle').value.trim() || 'Evento sem título';
    const description = $('#mDesc').value.trim();
    const day = parseInt($('#mDay').value) || state.day;

    if(!isMaster){
      try{
        const { error } = await sb.rpc('player_add_calendar_event', {
          event_day: day, title, description
        });
        if(error) throw error;
        closeModal(); showToast('Evento adicionado ao calendário.');
      } catch(e){
        showToast('Não consegui adicionar o evento. Tenta de novo.');
      }
      return;
    }

    const etypeEl = document.querySelector('.seg-opt[data-seg="etype"].active');
    const etype = etypeEl ? etypeEl.dataset.val : 'visual';
    let targetType = null, targetId = null, valueType='fixed', value=0, mode='limpo', recurring=false, recurEndDay=null;
    if(etype === 'efeito'){
      const tt = $('#mTargetType').value;
      targetType = tt==='none' ? null : tt;
      targetId = targetType ? $('#mTargetId').value : null;
      valueType = $('#mValueType').value;
      value = parseFloat($('#mValue').value) || 0;
      mode = document.querySelector('.seg-opt[data-seg="emode"].active').dataset.val;
      recurring = document.querySelector('.seg-opt[data-seg="erecur"].active').dataset.val === 'yes';
      recurEndDay = recurring ? (parseInt($('#mRecurEnd').value) || null) : null;
    }
    state.events.push({
      id: uid('evt'), day, title, description, type: etype,
      targetType, targetId, valueType, value, recurring, recurEndDay, mode, applied:false
    });
    saveState(); closeModal(); showToast('Evento adicionado ao calendário.'); return;
  }

  if(type === 'addResearch'){
    const name = $('#mName').value.trim() || 'Pesquisa sem nome';
    const legal = document.querySelector('.seg-opt[data-seg="rlegal"].active').dataset.val === 'legal';
    const durationValue = parseFloat($('#mDurationValue').value) || 1;
    const unit = $('#mDurationUnit').value;
    const unitDays = unit === 'semanas' ? 7 : unit === 'meses' ? 30 : 1;
    const durationDays = Math.max(1, Math.round(durationValue * unitDays));
    const businessId = $('#mResearchBusiness').value || null;
    const notes = $('#mNotes').value.trim();
    state.researches.push({ id: uid('res'), name, legal, durationDays, daysElapsed: 0, businessId, notes, completed: false });
    saveState(); closeModal(); showToast('Pesquisa criada.'); return;
  }

  if(type === 'researchDetail'){
    if(!isMaster){ closeModal(); return; }
    const r = state.researches.find(x=>x.id===ui.modalData.id);
    r.daysElapsed = parseFloat($('#mDaysElapsed').value) || 0;
    r.durationDays = Math.max(1, parseFloat($('#mDurationDays').value) || 1);
    r.notes = $('#mNotes').value.trim();
    r.completed = r.daysElapsed >= r.durationDays;
    saveState(); closeModal(); showToast('Pesquisa atualizada.'); return;
  }

  if(type === 'addCharacter' || type === 'characterDetail'){
    if(!isMaster){ closeModal(); return; }
    syncCharacterFormFromDom();
    const name = ui.modalData.name.trim() || 'Sem nome';
    const role = ui.modalData.role.trim();
    const description = ui.modalData.description.trim();
    const photo = ui.modalData.photo !== undefined ? ui.modalData.photo : null;
    const modifiers = (ui.modalData.modifiers||[]).filter(m=>m.percent);
    const assignRaw = ui.modalData.assignedTo;
    const assignedTo = assignRaw ? { type: assignRaw.split(':')[0], id: assignRaw.split(':')[1] } : null;

    if(type === 'addCharacter'){
      state.characters.push({ id: uid('char'), name, role, description, photo, modifiers, assignedTo });
      saveState(); closeModal(); showToast('Personagem criado.'); return;
    } else {
      const c = state.characters.find(x=>x.id===ui.modalData.id);
      c.name = name; c.role = role; c.description = description; c.modifiers = modifiers; c.assignedTo = assignedTo;
      if(ui.modalData.photo !== undefined) c.photo = ui.modalData.photo;
      saveState(); closeModal(); showToast('Personagem atualizado.'); return;
    }
  }
}

/* ============================================================
   DIÁRIO (CAT = mestre, DOG = jogador)
   Vive fora do #root (num overlay próprio) de propósito: o
   render() principal nunca toca essa div, então updates em
   tempo real do game_state não derrubam o editor Quill no meio
   de uma digitação.
   ============================================================ */
let diaryOpen = false;
let diaryHistoryOpen = false;
let diaryDate = todayISODate();
let diaryEntries = {};
let diaryChannel = null;
let activeQuill = null;
let mountedEditorAuthor = null;
let mountedEditorDate = null;
let diarySaveTimer = null;
let quillAssetsLoaded = false;

function todayISODate(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftISODate(iso, delta){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatRealDate(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function myDiaryAuthor(){ return isMaster ? 'cat' : 'dog'; }

function loadQuillAssets(){
  return new Promise((resolve, reject)=>{
    if(quillAssetsLoaded){ resolve(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js';
    script.onload = ()=>{ quillAssetsLoaded = true; resolve(); };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function openDiary(){
  if(diaryOpen) return;
  lockBodyScroll();
  pushAppHistory();
  diaryOpen = true;
  diaryHistoryOpen = false;
  diaryDate = todayISODate(); // sempre abre no dia de hoje, nunca fica preso em onde a pessoa navegou da última vez
  syncDiaryTrigger();
  const overlay = document.getElementById('diaryOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando diário…</div>`;
  try{
    await loadQuillAssets();
    await loadDiaryEntries();
    overlay.innerHTML = renderDiaryShell();
    attachDiaryShellHandlers();
    renderDiaryPanels();
    subscribeDiaryRealtime();
  } catch(e){
    console.error('Falha ao abrir o diário', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o diário agora. Tenta de novo em instantes.</div>`;
  }
}

function closeDiary(){
  if(!diaryOpen) return;
  unlockBodyScroll();
  popAppHistory();
  diaryOpen = false;
  activeQuill = null;
  mountedEditorAuthor = null;
  mountedEditorDate = null;
  const overlay = document.getElementById('diaryOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  syncDiaryTrigger();
  if(diaryChannel){ sb.removeChannel(diaryChannel); diaryChannel = null; }
}

async function loadDiaryEntries(){
  const { data, error } = await sb.from('diary_entries').select('entry_date, author, content, updated_at');
  if(error) throw error;
  diaryEntries = {};
  (data||[]).forEach(row=>{ diaryEntries[row.entry_date+'|'+row.author] = row; });
}

function subscribeDiaryRealtime(){
  if(diaryChannel) return;
  diaryChannel = sb.channel('diary_entries_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'diary_entries' }, (payload)=>{
      const row = payload.new && payload.new.entry_date ? payload.new : payload.old;
      if(!row) return;
      const key = row.entry_date+'|'+row.author;
      if(payload.eventType === 'DELETE') delete diaryEntries[key];
      else diaryEntries[key] = payload.new;
      if(!diaryOpen) return;
      // não re-renderiza a coluna que EU estou editando agora (evita perder o cursor/conteúdo em digitação)
      if(row.author === myDiaryAuthor() && row.entry_date === diaryDate) return;
      renderDiaryPanels();
    })
    .subscribe();
}

function toggleDiaryHistory(){
  diaryHistoryOpen = !diaryHistoryOpen;
  document.getElementById('diaryDayView').style.display = diaryHistoryOpen ? 'none' : 'block';
  document.getElementById('diaryHistory').style.display = diaryHistoryOpen ? 'block' : 'none';

    renderDiaryHistoryList();
  } else {
    document.getElementById('diaryHistoryToggle').style.display = 'block';
  }
}

function stripHtmlPreview(html){
  if(!html) return '';
  // regex em vez de jogar o HTML numa <div> pra ler o textContent: fazer isso
  // com <img> no meio cria elementos de imagem de verdade e faz o navegador
  // tentar baixar cada imagem de novo, só pra pegar um texto de prévia — fica
  // cada vez mais lento conforme o diário acumula dias com imagem.
  const text = html
    .replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/\s+/g, ' ')
    .trim();
  if(!text) return '';
  return text.length > 100 ? text.slice(0,100)+'…' : text;
}

function formatRealDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function renderDiaryHistoryList(){
  const el = document.getElementById('diaryHistory');
  const byDate = {};
  Object.values(diaryEntries).forEach(row=>{
    if(!byDate[row.entry_date]) byDate[row.entry_date] = {};
    byDate[row.entry_date][row.author] = row;
  });
  const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));
  if(!dates.length){
    el.innerHTML = `<div class="diary-history-link" id="diaryHistoryBack">↺ voltar pro dia</div><div class="diary-empty" style="margin-top:14px;">Nenhum dia escrito ainda.</div>`;
    document.getElementById('diaryHistoryBack').onclick = toggleDiaryHistory;
    return;
  }
  const rows = dates.map(d=>{
    const dogEntry = byDate[d].dog;
    const catEntry = byDate[d].cat;
    const dogPreview = dogEntry ? stripHtmlPreview(dogEntry.content && dogEntry.content.html) : '';
    const catPreview = catEntry ? stripHtmlPreview(catEntry.content && catEntry.content.html) : '';
    return `
      <div class="diary-history-row" data-goto-diary-date="${d}">
        <div class="diary-history-date">${formatRealDateShort(d)}</div>
        <div class="diary-history-previews">
          <div class="diary-history-preview"><span class="diary-col-tag dog">DOG</span>${dogPreview ? dogPreview : '<em>nada escrito</em>'}</div>
          <div class="diary-history-preview"><span class="diary-col-tag cat">CAT</span>${catPreview ? catPreview : '<em>nada escrito</em>'}</div>
        </div>
      </div>`;
  }).join('');
  el.innerHTML = `<div class="diary-history-link" id="diaryHistoryBack">↺ voltar pro dia</div><div class="card" style="margin-top:14px;padding:4px 14px;">${rows}</div>`;
  document.getElementById('diaryHistoryBack').onclick = toggleDiaryHistory;
  el.querySelectorAll('[data-goto-diary-date]').forEach(row=>{
    row.onclick = ()=>{
      diaryDate = row.dataset.gotoDiaryDate;
      toggleDiaryHistory();
      renderDiaryPanels();
    };
  });
}

function goDiaryDay(delta){
  diaryDate = shiftISODate(diaryDate, delta);
  renderDiaryPanels();
}

function renderDiaryPanels(){
  document.getElementById('diaryDateLabel').textContent = formatRealDate(diaryDate);
  document.getElementById('diaryToday').style.display = (diaryDate === todayISODate()) ? 'none' : 'block';
  renderDiaryColumn('dog');
  renderDiaryColumn('cat');
}

function renderDiaryColumn(author){
  const mine = author === myDiaryAuthor();
  const bodyEl = document.getElementById(author+'ColBody');
  const entry = diaryEntries[diaryDate+'|'+author];

  if(mine){
    if(mountedEditorDate === diaryDate) return; // editor já montado pra essa data, não mexe
    if(!activeQuill){
      // Quill não tem um destroy() de verdade — em vez de recriar o editor do
      // zero a cada troca de dia (o que ia acumulando listeners internos dele
      // e deixando a sessão cada vez mais lenta), cria uma vez só e reaproveita.
      bodyEl.innerHTML = `<div class="diary-editor" id="${author}Editor"></div><div class="diary-save-hint" id="diarySaveHint">Sincronizado</div>`;
      const editorEl = document.getElementById(author+'Editor');
      activeQuill = new Quill(editorEl, {
        theme: 'snow',
        modules: { toolbar: [['bold','italic','underline'],[{list:'ordered'},{list:'bullet'}],['image'],['clean']] },
        placeholder: 'Escreva o que aconteceu hoje…'
      });
      activeQuill.getModule('toolbar').addHandler('image', ()=> handleDiaryImageUpload(activeQuill));
      activeQuill.on('text-change', (delta, old, source)=>{
        if(source !== 'user') return;
        const hint = document.getElementById('diarySaveHint');
        const targetDate = diaryDate, targetAuthor = author;
        // imagem colada (ctrl+v) vem como base64 embutido no HTML — se salvar
        // assim, a entrada do dia fica gigante e o diário todo fica lento pra
        // carregar. Sobe pro Storage igual ao botão de inserir imagem antes
        // de salvar.
        if(activeQuill.root.innerHTML.includes('data:image')){
          if(hint) hint.textContent = 'Enviando imagem…';
          clearTimeout(diarySaveTimer);
          migratePastedImages(activeQuill).then(()=>{
            persistDiaryEntry(targetAuthor, targetDate, activeQuill.root.innerHTML);
          });
          return;
        }
        if(hint) hint.textContent = 'Salvando…';
        clearTimeout(diarySaveTimer);
        diarySaveTimer = setTimeout(()=> persistDiaryEntry(targetAuthor, targetDate, activeQuill.root.innerHTML), 700);
      });
      mountedEditorAuthor = author;
    }
    if(entry && entry.content && entry.content.html){
      activeQuill.clipboard.dangerouslyPasteHTML(entry.content.html);
    } else {
      activeQuill.setText('');
    }
    mountedEditorDate = diaryDate;
  } else {
    bodyEl.innerHTML = (entry && entry.content && entry.content.html)
      ? `<div class="ql-editor diary-readonly">${entry.content.html}</div>`
      : `<div class="diary-empty">Nada escrito ${author==='cat'?'pelo mestre':'pelo jogador'} neste dia.</div>`;
  }
}

async function persistDiaryEntry(author, entryDate, html, attempt = 1){
  try{
    if(author === 'cat'){
      const { error } = await sb.rpc('master_upsert_diary_entry', { p_token: masterToken, p_entry_date: entryDate, p_content: { html } });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('player_upsert_diary_entry', { p_entry_date: entryDate, p_content: { html } });
      if(error) throw error;
    }
    diaryEntries[entryDate+'|'+author] = { entry_date: entryDate, author, content: { html }, updated_at: new Date().toISOString() };
    if(diaryDate === entryDate && mountedEditorAuthor === author){
      const hint = document.getElementById('diarySaveHint');
      if(hint) hint.textContent = 'Sincronizado';
    }
  } catch(e){
    console.error('Falha ao salvar diário', e);
    if(author === 'cat' && isMasterSessionExpiredError(e?.message)){
      closeDiary();
      handleExpiredMasterSession('O que você tava escrevendo no diário não foi salvo.');
      return;
    }
    if(diaryDate === entryDate && mountedEditorAuthor === author){
      const hint = document.getElementById('diarySaveHint');
      if(hint) hint.textContent = attempt < 3 ? 'Falha ao salvar — tentando de novo…' : 'Não consegui salvar. O texto continua aqui — tenta digitar algo de novo pra reenviar.';
    }
    if(attempt < 3){
      setTimeout(()=> persistDiaryEntry(author, entryDate, html, attempt+1), 3000 * attempt);
    }
  }
}

function flushDiarySaveNow(){
  if(!diaryOpen || !activeQuill || !mountedEditorAuthor) return;
  clearTimeout(diarySaveTimer);
  persistDiaryEntry(mountedEditorAuthor, mountedEditorDate, activeQuill.root.innerHTML);
}

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushDiarySaveNow(); });
window.addEventListener('pagehide', flushDiarySaveNow);

async function handleDiaryImageUpload(quillInstance){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    try{
      const { error: upErr } = await sb.storage.from('diary-images').upload(path, file);
      if(upErr) throw upErr;
      const { data } = sb.storage.from('diary-images').getPublicUrl(path);
      const range = quillInstance.getSelection(true);
      quillInstance.insertEmbed(range ? range.index : 0, 'image', data.publicUrl, 'user');
    } catch(e){
      console.error('Falha ao enviar imagem', e);
      showToast('Não consegui enviar a imagem. Tenta de novo.');
    }
  };
  input.click();
}

async function migratePastedImages(quillInstance){
  const html = quillInstance.root.innerHTML;
  const matches = html.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g);
  if(!matches) return;
  for(const dataUrl of matches){
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const ext = (dataUrl.match(/data:image\/([a-zA-Z0-9.+-]+);/) || [,'png'])[1].replace('jpeg','jpg');
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from('diary-images').upload(path, blob, { contentType: blob.type || ('image/'+ext) });
      if(error) throw error;
      const { data } = sb.storage.from('diary-images').getPublicUrl(path);
      quillInstance.root.querySelectorAll('img[src^="data:image"]').forEach(img=>{
        if(img.getAttribute('src') === dataUrl) img.setAttribute('src', data.publicUrl);
      });
    } catch(e){
      console.error('Falha ao migrar imagem colada', e);
    }
  }
}

  if(mins < 60) return `${mins}min`;

/* ============================================================
   Helper compartilhado: aplica um evento de realtime (insert/
   update/delete) num array local em cache, in-place.
   ============================================================ */
function applyRealtimeUpsert(arr, payload){
  if(payload.eventType === 'DELETE'){
    const idx = arr.findIndex(x=>x.id===payload.old.id);
    if(idx>=0) arr.splice(idx,1);
  } else {
    const idx = arr.findIndex(x=>x.id===payload.new.id);
    if(idx>=0) arr[idx] = payload.new; else arr.push(payload.new);
  }
}

/* ============================================================
   Helper compartilhado: arrastar-e-soltar por ponteiro (mouse e
   touch) — usado no inventário (mover item entre lugar/recipiente/
   solto) e no codex (mover/reordenar lembranças). Distingue toque
   simples (onTap) de arraste (onDrop) por um limiar de movimento.
   ============================================================ */
// Mouse: arrasta depois de mover ~6px. Toque: SEGURAR ~0,3s "pega" o item (como no
// celular de verdade); deslizar sem segurar é só rolar a lista. Enquanto arrasta:
// os destinos ficam destacados, a lista rola sozinha perto das bordas e uma dica
// aparece na tela. Re-renders alheios (realtime) esperam o arraste acabar, senão
// o item arrastado some do DOM no meio do gesto.
let dndActive = false;
let dragRenderPending = false;
function requestListRefresh(kind){
  if(dndActive){ dragRenderPending = true; return; }
  if(kind === 'inventory' && inventoryOpen && invView === 'list') renderInventoryOverlay();
  if(kind === 'codex' && codexOpen && codexView === 'grid') renderCodexOverlay();
}
function flushDragRender(){
  if(!dragRenderPending) return;
  dragRenderPending = false;
  if(inventoryOpen && invView === 'list') renderInventoryOverlay();
  if(codexOpen && codexView === 'grid') renderCodexOverlay();
}

function enableDragDrop(root, { dragSelector, dropSelector, onTap, onDrop, hint, dragClass }){
  const MOUSE_THRESHOLD = 6;
  const LONG_PRESS_MS = 320;
  const TOUCH_SLOP = 10;
  // a lista rolável varia (no Depósito/Codex é o .app-body): acha o ancestral que rola de verdade
  function findScroller(){
    for(let p = root; p && p !== document.body; p = p.parentElement){
      const oy = getComputedStyle(p).overflowY;
      if((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight + 1) return p;
    }
    return null;
  }
  let scroller = null, extraRootClass = null;
  let dragEl = null, ghost = null, hintEl = null, currentTarget = null;
  let startX = 0, startY = 0, lastX = 0, lastY = 0;
  let dragging = false, isTouch = false, pressTimer = null, scrollRaf = null;

  function positionGhost(){
    if(!ghost) return;
    const w = ghost.offsetWidth, h = ghost.offsetHeight;
    const left = Math.min(window.innerWidth - w - 6, Math.max(6, lastX - w/2));
    // no toque o item fica acima do dedo, senão a mão esconde o que está sendo arrastado
    const top = isTouch ? Math.max(6, lastY - h - 30) : lastY - 18;
    ghost.style.left = left + 'px';
    ghost.style.top = top + 'px';
  }

  function updateTarget(){
    const hit = document.elementFromPoint(lastX, lastY);
    const target = hit ? hit.closest(dropSelector) : null;
    const valid = (target && target !== dragEl && root.contains(target)) ? target : null;
    if(valid !== currentTarget){
      if(currentTarget) currentTarget.classList.remove('dnd-drop-hover');
      currentTarget = valid;
      if(currentTarget) currentTarget.classList.add('dnd-drop-hover');
    }
  }

  // rola a lista sozinha quando o dedo chega perto do topo/rodapé
  function autoScrollTick(){
    if(!dragging || !scroller) return;
    const rect = scroller.getBoundingClientRect();
    const edge = 90;
    let dy = 0;
    if(lastY < rect.top + edge) dy = -Math.min(18, Math.ceil((rect.top + edge - lastY) / 5));
    else if(lastY > rect.bottom - edge) dy = Math.min(18, Math.ceil((lastY - (rect.bottom - edge)) / 5));
    if(dy){ scroller.scrollTop += dy; updateTarget(); }
  }

  function startDrag(){
    dragging = true;
    dndActive = true;
    scroller = findScroller();
    dragEl.classList.add('dnd-dragging');
    root.classList.add('dnd-active');
    extraRootClass = dragClass ? dragClass(dragEl) : null;
    if(extraRootClass) root.classList.add(extraRootClass);
    const r = dragEl.getBoundingClientRect();
    ghost = dragEl.cloneNode(true);
    ghost.classList.add('dnd-ghost');
    ghost.classList.remove('stagger-in');
    ghost.style.animation = 'none';
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    const hintText = typeof hint === 'function' ? hint(dragEl) : hint;
    if(hintText){
      hintEl = document.createElement('div');
      hintEl.className = 'dnd-hint';
      hintEl.textContent = hintText;
      document.body.appendChild(hintEl);
    }
    if(isTouch && navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
    positionGhost();
    updateTarget();
    scrollRaf = setInterval(autoScrollTick, 16);
  }

  function cleanup(){
    clearTimeout(pressTimer); pressTimer = null;
    clearInterval(scrollRaf); scrollRaf = null;
    if(ghost){ ghost.remove(); ghost = null; }
    if(hintEl){ hintEl.remove(); hintEl = null; }
    if(dragEl) dragEl.classList.remove('dnd-dragging', 'dnd-pressing');
    root.classList.remove('dnd-active');
    if(extraRootClass){ root.classList.remove(extraRootClass); extraRootClass = null; }
    if(currentTarget){ currentTarget.classList.remove('dnd-drop-hover'); currentTarget = null; }
    dragEl = null; dragging = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    dndActive = false;
    flushDragRender();
  }

  function onMove(e){
    lastX = e.clientX; lastY = e.clientY;
    if(!dragging){
      const dist = Math.hypot(lastX - startX, lastY - startY);
      if(isTouch){
        // mexeu antes de segurar: é rolagem, não arraste
        if(dist > TOUCH_SLOP) cleanup();
        return;
      }
      if(dist > MOUSE_THRESHOLD) startDrag();
      else return;
    }
    e.preventDefault();
    positionGhost();
    updateTarget();
  }

  function onUp(e){
    const el = dragEl, target = currentTarget, wasDragging = dragging;
    cleanup();
    if(!el) return;
    if(wasDragging){
      if(target) onDrop(el, target, e);
    } else if(onTap){
      onTap(el);
    }
  }

  function onCancel(){ cleanup(); }

  // trava a rolagem enquanto arrasta (touch-action sozinho não vale pra um toque já em andamento)
  root.addEventListener('touchmove', (e)=>{ if(dragging && e.cancelable) e.preventDefault(); }, { passive: false });
  root.addEventListener('contextmenu', (e)=>{ if(e.target.closest && e.target.closest(dragSelector)) e.preventDefault(); });
  root.addEventListener('dragstart', (e)=>{ if(e.target.closest && e.target.closest(dragSelector)) e.preventDefault(); });
  root.addEventListener('selectstart', (e)=>{ if(dragEl) e.preventDefault(); });

  root.querySelectorAll(dragSelector).forEach(el=>{
    el.addEventListener('pointerdown', (e)=>{
      if(dragEl) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      dragEl = el;
      isTouch = e.pointerType === 'touch';
      startX = lastX = e.clientX; startY = lastY = e.clientY;
      dragging = false;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
      if(isTouch){
        el.classList.add('dnd-pressing');
        pressTimer = setTimeout(()=>{ pressTimer = null; if(dragEl && !dragging) startDrag(); }, LONG_PRESS_MS);
      }
    });
  });
}

/* ============================================================
   RELÓGIO — relógio analógico com ponteiros arrastáveis (só o mestre
   mexe) e o horário digital no meio. Passar da meia-noite avança o dia.
   Vive fora do #root, igual aos outros apps, então a tela principal
   re-renderizando não atrapalha o arrasto.
   ============================================================ */
let clockOpen = false;

const pad2 = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function clockToMin(hhmm){ const [h, m] = hhmm.split(':').map(Number); return h*60 + m; }
function clockFromMin(t){
  const n = ((Math.round(t) % 1440) + 1440) % 1440;
  return pad2(Math.floor(n/60)) + ':' + pad2(n%60);
}

                </radialGradient>
              </defs>
              <circle class="clock-ring" cx="160" cy="160" r="153"/>
              <circle class="clock-face" cx="160" cy="160" r="147" fill="url(#clkFace)"/>
              <ellipse cx="160" cy="84" rx="110" ry="62" fill="url(#clkGloss)"/>
              ${ticks}
              ${nums}
              <circle class="clock-core" cx="160" cy="160" r="57"/>
              <g class="clock-hand" id="clkHour">
                <line class="h-line" x1="160" y1="100" x2="160" y2="84" stroke-width="7"/>

              <div class="clock-day-seg p-manha" data-p="manha" style="width:25%"></div>
              <div class="clock-day-seg p-tarde" data-p="tarde" style="width:25%"></div>

            ? 'Arraste os ponteiros pra definir a hora. Passar da meia-noite avança o dia.'
            : '<span class="clock-live">Ao vivo</span><br>Só o mestre mexe no horário — você acompanha aqui.'}</div>

  `;
}

// gira o ponteiro pelo menor caminho (sem dar a volta inteira quando passa de 59 pra 00)
function setClockHand(el, target){
  if(el._a === undefined){ el._a = target; }
  else {
    const d = (((target - el._a) % 360) + 540) % 360 - 180;
    el._a += d;
  }
  el.style.transform = `rotate(${el._a}deg)`;
}

// viewMin: horário provisório (minutos, pode passar de 1440) enquanto arrasta;
// sem ele, mostra o horário salvo no estado.
function updateClockView(viewMin){
  const shell = document.querySelector('#clockOverlay .app-shell');
  if(!shell) return;
  const t = viewMin !== undefined ? viewMin : clockToMin(state.clock);
  const hhmm = clockFromMin(t);
  const p = clockPeriod(hhmm);

  refreshAppStatusBars(hhmm);
  document.getElementById('clkHH').textContent = hhmm.slice(0,2);
  document.getElementById('clkMM').textContent = hhmm.slice(3);
  document.getElementById('clkPeriod').textContent = CLOCK_LABELS[p];
  document.getElementById('clkIcon').innerHTML = CLOCK_ICONS[p];
  document.getElementById('clkDate').textContent = formatDate(state.day);
  shell.classList.remove('p-madrugada','p-manha','p-tarde','p-noite');
  shell.classList.add('p-' + p);

  setClockHand(document.getElementById('clkHour'), t * 0.5);
  setClockHand(document.getElementById('clkMinute'), t * 6);

  document.getElementById('clkMarker').style.left = (clockToMin(hhmm) / 1440 * 100) + '%';
  document.querySelectorAll('#clkDay .clock-day-seg').forEach(seg=> seg.classList.toggle('on', seg.dataset.p === p));
  document.getElementById('clkDay').classList.toggle('dragging', !!clockDrag);

  const dial = document.getElementById('clkDial');
  if(dial && dial.classList.contains('no-anim')){
    requestAnimationFrame(()=> requestAnimationFrame(()=> dial.classList.remove('no-anim')));
  }
}

function updateClockMidnightBanner(cur){
  const el = document.getElementById('clkMidnight');
  if(!el) return;
  const cross = Math.floor(cur / 1440);
  if(cross >= 1){
    el.innerHTML = `🌙 Passou da meia-noite — ao soltar, o dia avança${cross>1?` ${cross} dias`:''} pra <b>${formatDate(state.day + cross)}</b>.`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function attachClockHandlers(){
  document.getElementById('clockClose').onclick = closeClockApp;
  const dial = document.getElementById('clkDial');
  if(!isMaster) return;

  const angDist = (a, b)=>{ const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const pointer = (e)=>{
    const box = dial.getBoundingClientRect();
    const s = 320 / box.width;
    const x = (e.clientX - box.left - box.width/2) * s;
    const y = (e.clientY - box.top - box.height/2) * s;
    return { a: (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360, r: Math.hypot(x, y) };
  };

  // atualiza o horário provisório a partir da posição do dedo/mouse.
  // a conta é sempre "quanto andou desde o último ponto" (pelo menor caminho),
  // então dar a volta no relógio acumula horas de verdade — inclusive passar
  // da meia-noite (cur >= 1440).
  const follow = (a)=>{
    const d = clockDrag;
    if(d.hand === 'minute'){
      const m = Math.round(a / 6) % 60;
      let diff = m - d.prevMinute;
      if(diff > 30) diff -= 60;
      if(diff < -30) diff += 60;
      d.cur += diff;
      d.prevMinute = m;
    } else {
      const frac = (((d.cur % 60) + 60) % 60) / 60;
      const hp = ((Math.round(a / 30 - frac) % 12) + 12) % 12;
      let diff = hp - d.prevHourPos;
      if(diff > 6) diff -= 12;
      if(diff < -6) diff += 12;
      d.cur += diff * 60;
      d.prevHourPos = hp;
    }
    updateClockView(d.cur);
    updateClockMidnightBanner(d.cur);
  };

  dial.addEventListener('pointerdown', (e)=>{
    if(clockDrag || clockCommitting || dayActionInFlight) return;
    const p = pointer(e);
    if(p.r < 58) return; // miolo (horário digital)
    const t0 = clockToMin(state.clock);
    const dH = angDist(p.a, (t0 % 720) * 0.5);
    const dM = angDist(p.a, (t0 % 60) * 6);
    const hand = p.r > 94 ? 'minute' : (dH <= dM ? 'hour' : 'minute');
    clockDrag = { hand, start: t0, cur: t0, prevMinute: t0 % 60, prevHourPos: Math.floor(t0 / 60) % 12 };
    dial.setPointerCapture(e.pointerId);
    dial.classList.add('dragging');
    document.getElementById(hand === 'hour' ? 'clkHour' : 'clkMinute').classList.add('active');
    e.preventDefault();
    follow(p.a);
  });
  dial.addEventListener('pointermove', (e)=>{
    if(!clockDrag) return;
    follow(pointer(e).a);
  });
  const end = ()=>{
    if(!clockDrag) return;
    commitClockDrag();
  };
  dial.addEventListener('pointerup', end);
  dial.addEventListener('pointercancel', end);
}

async function saveStateNow(){
  clearTimeout(saveTimer);
  await flushSave();
  while(isSaving || pendingSave) await sleep(50);
}

async function waitForDay(target, ms){
  const limit = Date.now() + ms;
  while(state.day < target && Date.now() < limit) await sleep(100);
  return state.day >= target;
}

async function commitClockDrag(){
  const d = clockDrag;
  clockDrag = null;
  const dial = document.getElementById('clkDial');
  if(dial) dial.classList.remove('dragging');
  document.querySelectorAll('#clockOverlay .clock-hand.active').forEach(el=> el.classList.remove('active'));

  const cross = Math.floor(d.cur / 1440);
  const oldTime = clockFromMin(d.start);
  const newTime = clockFromMin(d.cur);
  const midnight = document.getElementById('clkMidnight');
  const hideBanner = ()=>{ if(midnight) midnight.classList.remove('show'); };

  if(cross <= 0){
    hideBanner();
    if(newTime !== oldTime){
      state.clock = newTime;
      saveState();
      render();
      if(cross < 0) showToast('Voltou além da meia-noite: o dia não muda. Use "Voltar dia" se precisar.');
    }
    updateClockView();
    return;
  }

  if(cross > 1 && !confirm(`Isso vai avançar ${cross} dias. Continuar?`)){
    hideBanner();
    updateClockView();
    return;
  }

  // atravessou a meia-noite: avança o dia (uma vez por meia-noite). O horário
  // de antes é gravado primeiro pra o histórico ("Voltar dia") guardar o dia
  // anterior com a hora em que ele estava, e o horário novo entra depois.
  clockCommitting = true;
  if(midnight) midnight.innerHTML = '🌙 Avançando o dia…';
  const dayBefore = state.day;
  state.clock = oldTime;
  await saveStateNow();
  for(let i = 0; i < cross; i++){
    const target = state.day + 1;
    await callDayFunction('advance-day');
    if(!(await waitForDay(target, 8000))) break;
  }
  const advanced = state.day > dayBefore;
  if(advanced){
    state.clock = newTime;
    saveState();
    showToast(`Meia-noite: agora é ${formatDate(state.day)}.`);
  } else {
    showToast('Não consegui avançar o dia. O horário não mudou.');
  }
  clockCommitting = false;
  hideBanner();
  render();
  updateClockView();
}

/* ============================================================
   INVENTÁRIO — mestre e jogador podem criar/remover livremente.
   Vive fora do #root, mesmo motivo do diário: o formulário de
   criar/editar não pode ser atropelado por um render() alheio.
   ============================================================ */
let inventoryOpen = false;
let inventoryContainers = [];
let inventoryItems = [];
let inventoryReceptacles = [];
let invChannel = null;
let invView = 'list'; // 'list' | 'containerForm' | 'itemForm' | 'receptacleForm' | 'capacityForm'
let invEditingId = null;
let invFormPlace = null; // pre-seleciona o "Lugar" do item: '' (com você), 'container:ID' ou 'receptacle:ID'
let invFormPhoto = undefined;
let invFormDraft = null; // {name, description, weight, quantity, place} — preserva o formulário quando um upload de foto força um re-render
let invRecFormPhoto = undefined;
let invRecFormDraft = null; // {name, description, baseWeight, capacity}
let invSearchQuery = ''; // busca por nome (depósitos, recipientes, itens)

function syncItemFormDraft(){
  const $ = sel => document.querySelector(sel);
  if(!$('#mItemName')) return;
  invFormDraft = {
    name: $('#mItemName').value,
    description: $('#mItemDescription').value,
    weight: $('#mItemWeight').value,
    quantity: $('#mItemQuantity').value,
    place: $('#mItemContainer').value
  };
}

function syncReceptacleFormDraft(){
  const $ = sel => document.querySelector(sel);
  if(!$('#mRecName')) return;
  invRecFormDraft = {
    name: $('#mRecName').value,
    description: $('#mRecDescription').value,
    baseWeight: $('#mRecBaseWeight').value,
    capacity: $('#mRecCapacity').value,
    containerId: $('#mRecContainer') ? $('#mRecContainer').value : undefined
  };
}

function computePlayerCapacityUsage(){
  const loose = inventoryItems.filter(it=>!it.container_id && !it.receptacle_id)
    .reduce((s,it)=>s + it.weight*it.quantity, 0);
  // recipiente guardado num depósito não pesa em você (pesa no depósito)
  const receptaclesUsed = inventoryReceptacles.filter(r=>!r.container_id).reduce((s,r)=> s + receptacleEffectiveWeight(r), 0);
  return loose + receptaclesUsed;
}

// peso efetivo de um recipiente = peso vazio + metade dos itens dentro
function receptacleEffectiveWeight(r){
  const itemsHalf = inventoryItems.filter(it=>it.receptacle_id===r.id)
    .reduce((s,it)=> s + (it.weight*it.quantity)/2, 0);
  return r.base_weight + itemsHalf;
}

let inventoryJustOpened = false;

async function openInventory(){
  if(inventoryOpen) return;
  lockBodyScroll();
  pushAppHistory();
  inventoryOpen = true;
  invView = 'list';
  invEditingId = null;
  invFormPlace = null;
  invFormPhoto = undefined;
  invFormDraft = null;
  invRecFormPhoto = undefined;
  invRecFormDraft = null;
  invSearchQuery = '';
  inventoryJustOpened = true;
  const overlay = document.getElementById('inventoryOverlay');
  overlay.classList.remove('app-overlay-closing');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando inventário…</div>`;
  render();
  try{
    await loadInventoryData();
    renderInventoryOverlay();
    subscribeInventoryRealtime();
  } catch(e){
    console.error('Falha ao abrir inventário', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o inventário agora.</div>`;
  }
}

function closeInventory(){
  if(!inventoryOpen) return;
  unlockBodyScroll();
  popAppHistory();
  inventoryOpen = false;
  invView = 'list';
  invEditingId = null;
  const overlay = document.getElementById('inventoryOverlay');
  const shell = overlay.querySelector('.app-shell');
  if(shell){
    animateExitToIcon(shell, 'inventory');
    overlay.classList.add('app-overlay-closing');
    setTimeout(()=>{
      if(inventoryOpen) return; // reabriu antes de acabar a animação
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      overlay.classList.remove('app-overlay-closing');
    }, APP_EXIT_MS);
  } else {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
  }
  render();
}

async function loadInventoryData(){
  const [{ data: containers, error: e1 }, { data: items, error: e2 }, { data: receptacles, error: e3 }] = await Promise.all([
    sb.from('inventory_containers').select('*').order('created_at'),
    sb.from('inventory_items').select('*').order('created_at'),
    sb.from('inventory_receptacles').select('*').order('created_at')
  ]);
  if(e1) throw e1;
  if(e2) throw e2;
  if(e3) throw e3;
  inventoryContainers = containers || [];
  inventoryItems = items || [];
  inventoryReceptacles = receptacles || [];
}

function subscribeInventoryRealtime(){
  if(invChannel) return;
  invChannel = sb.channel('inventory_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_containers' }, (payload)=>{
      applyRealtimeUpsert(inventoryContainers, payload);
      requestListRefresh('inventory');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_items' }, (payload)=>{
      applyRealtimeUpsert(inventoryItems, payload);
      requestListRefresh('inventory');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_receptacles' }, (payload)=>{
      applyRealtimeUpsert(inventoryReceptacles, payload);
      requestListRefresh('inventory');
    })
    .subscribe();
}

function renderInventoryOverlay(){
  const overlay = document.getElementById('inventoryOverlay');
  const enterClass = inventoryJustOpened ? ' app-shell-enter' : '';
  inventoryJustOpened = false;
  overlay.innerHTML = `
    <div class="app-shell app-theme-inventory${enterClass}">
      ${renderAppStatusBar()}
      <div class="app-chrome-head">
        <div class="app-chrome-title">Depósito</div>
        <div class="app-chrome-close" id="invClose">✕</div>
      </div>
      <div class="app-body"><div class="inv-wrap">${renderInventoryBody()}</div></div>
      <div class="app-home-indicator"></div>
    </div>
  `;
  if(enterClass) animateOpenFromIcon(overlay.querySelector('.app-shell'), 'inventory');
  attachInventoryHandlers();
}

function renderInventoryBody(){
  if(invView === 'containerForm') return renderContainerForm();
  if(invView === 'itemForm') return renderItemForm();
  if(invView === 'receptacleForm') return renderReceptacleForm();
  if(invView === 'capacityForm') return renderPlayerCapacityForm();
  if(invView === 'addChooser') return renderAddChooser();
  return renderInventoryList();
}

function renderInventoryList(){
  const itemsByContainer = {};
  const itemsByReceptacle = {};
  const loose = [];
  inventoryItems.forEach(it=>{
    if(it.container_id){ (itemsByContainer[it.container_id] = itemsByContainer[it.container_id]||[]).push(it); }
    else if(it.receptacle_id){ (itemsByReceptacle[it.receptacle_id] = itemsByReceptacle[it.receptacle_id]||[]).push(it); }
    else loose.push(it);
  });

  const query = invSearchQuery.trim().toLowerCase();
  const searching = query.length > 0;
  const matchName = n => (n||'').toLowerCase().includes(query);

  let visibleReceptacles = inventoryReceptacles;
  let visibleContainers = inventoryContainers;
  let visibleLoose = loose;
  let filteredItemsByContainer = itemsByContainer;
  let filteredItemsByReceptacle = itemsByReceptacle;

  if(searching){
    visibleLoose = loose.filter(it=>matchName(it.name));

    filteredItemsByReceptacle = {};
    visibleReceptacles = inventoryReceptacles.filter(r=>{
      const matchingItems = (itemsByReceptacle[r.id]||[]).filter(it=>matchName(it.name));
      const selfMatch = matchName(r.name);
      if(selfMatch || matchingItems.length){
        filteredItemsByReceptacle[r.id] = selfMatch ? (itemsByReceptacle[r.id]||[]) : matchingItems;
        return true;
      }
      return false;
    });

    // um depósito aparece também se guarda um recipiente que bate com a busca
    filteredItemsByContainer = {};
    visibleContainers = inventoryContainers.filter(c=>{
      const matchingItems = (itemsByContainer[c.id]||[]).filter(it=>matchName(it.name));
      const selfMatch = matchName(c.name);
      const hasMatchingReceptacle = visibleReceptacles.some(r=>r.container_id === c.id);
      if(selfMatch || matchingItems.length || hasMatchingReceptacle){
        filteredItemsByContainer[c.id] = selfMatch ? (itemsByContainer[c.id]||[]) : matchingItems;
        return true;
      }
      return false;
    });
  }

  const carriedReceptacles = visibleReceptacles.filter(r=>!r.container_id);
  const storedReceptacles = {};
  visibleReceptacles.filter(r=>r.container_id).forEach(r=>{ (storedReceptacles[r.container_id] = storedReceptacles[r.container_id]||[]).push(r); });

  const used = computePlayerCapacityUsage();
  const max = (state && state.playerCarryCapacity) || 50;
  const pct = max ? Math.min(100, Math.round((used/max)*100)) : 0;
  return `
    <div class="card inv-capacity-card">
      <div class="card-label-row">
        <div class="card-label">Sua carga</div>
        ${isMaster ? `<span class="edit-link" id="invEditCapacity">✎ editar</span>` : ''}
      </div>
      <div class="inv-capacity-value">${fmtCarga(used)} <span class="inv-capacity-max">/ ${fmtCarga(max)} de carga</span></div>
      <div class="progress-track inv-capacity-track"><div class="progress-fill" style="width:${pct}%;${capacityFillStyle(pct)}"></div></div>
    </div>

    <div class="search-input-wrap"><input type="text" class="search-input" id="invSearchInput" placeholder="Buscar por nome..." value="${invSearchQuery.replace(/"/g,'&quot;')}"></div>
    <div class="inv-add-wrap"><button class="btn btn-accent inv-add-btn" id="invOpenAdd">+ Adicionar</button></div>
    ${(inventoryItems.length || inventoryReceptacles.length) ? `<div class="dnd-hint-line">Toque pra editar · segure e arraste pra mover de lugar — itens e recipientes (um recipiente pode ser guardado num depósito).</div>` : ''}

    <div class="inv-section-head">
      <div class="inv-section-title section-title" style="margin:0;">🎒 Com você</div>
    </div>
    <div class="inv-loose-zone" data-drop="loose">
      ${carriedReceptacles.map((r,i)=>renderReceptacleCard(r, filteredItemsByReceptacle[r.id]||[], i)).join('')}
      ${visibleLoose.length ? `<div class="inv-items">${visibleLoose.map((it,i)=>renderItemRowHtml(it,i)).join('')}</div>` : ''}
      ${(!carriedReceptacles.length && !visibleLoose.length) ? `<div class="empty-state">${searching ? 'Nada encontrado.' : 'Nada com você ainda.'}</div>` : ''}
    </div>

    <div class="inv-section-head">
      <div class="inv-section-title section-title" style="margin:0;">📦 Depósitos</div>
    </div>
    ${visibleContainers.length ? visibleContainers.map((c,i)=>renderContainerCard(c, filteredItemsByContainer[c.id]||[], i, storedReceptacles[c.id]||[], filteredItemsByReceptacle)).join('') : `<div class="empty-state">${searching ? 'Nada encontrado.' : 'Nenhum depósito criado ainda.'}</div>`}
  `;
}

function renderContainerCard(c, items, i=0, stored=[], itemsByReceptacle={}){
  // carga do depósito = itens (peso cheio) + TODOS os recipientes guardados aqui (peso efetivo),
  // mesmo os que a busca escondeu
  const usedItems = inventoryItems.filter(it=>it.container_id===c.id).reduce((s,it)=>s + (it.weight*it.quantity), 0);
  const usedReceptacles = inventoryReceptacles.filter(r=>r.container_id===c.id).reduce((s,r)=>s + receptacleEffectiveWeight(r), 0);
  const used = usedItems + usedReceptacles;
  const pct = c.capacity ? Math.min(100, Math.round((used/c.capacity)*100)) : 0;
  const hasContent = items.length || stored.length;
  return `
    <div class="card inv-container-card stagger-in" style="${staggerDelay(i)}" data-drop="container:${c.id}">
      <div class="inv-card-head">
        <div class="inv-card-title" data-edit-container="${c.id}" style="cursor:pointer;">
          <div class="inv-card-icon">📦</div>
          <div class="entity-name">${c.name}</div>
        </div>
        <span class="inv-mini-add" data-add-item-to="${c.id}" title="Adicionar item">+</span>
      </div>
      ${c.capacity ? `
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;${capacityFillStyle(pct)}"></div></div>
        <div class="hint">${fmtCarga(used)} / ${fmtCarga(c.capacity)} de carga</div>
      ` : `<div class="hint">Sem limite de carga · ${fmtCarga(used)} em uso</div>`}
      ${stored.length ? `<div class="inv-stored-list">${stored.map((r,i2)=>renderReceptacleCard(r, itemsByReceptacle[r.id]||[], i2, true)).join('')}</div>` : ''}
      <div class="inv-items">
        ${items.length ? items.map((it,i2)=>renderItemRowHtml(it,i2)).join('') : (hasContent ? '' : '<div class="empty-state" style="padding:14px;">Vazio.</div>')}
      </div>
    </div>
  `;
}

function renderReceptacleCard(r, items, i=0, isStored=false){
  // "used" = carga interna (metade dos itens); com busca ativa `items` vem filtrado, então
  // a conta usa TODOS os itens do recipiente
  const allInside = inventoryItems.filter(it=>it.receptacle_id===r.id);
  const used = allInside.reduce((s,it)=>s + (it.weight*it.quantity)/2, 0);
  const pct = r.capacity ? Math.min(100, Math.round((used/r.capacity)*100)) : 0;
  const effective = r.base_weight + used;
  const weightNote = isStored
    ? `guardado aqui · pesa ${fmtCarga(effective)} no depósito (${fmtCarga(r.base_weight)} vazio)`
    : `carrega ${fmtCarga(effective)} de você (${fmtCarga(r.base_weight)} vazia)`;
  return `
    <div class="card inv-container-card ${isStored ? 'inv-receptacle-stored' : ''} stagger-in" style="${staggerDelay(i)}" data-drop="receptacle:${r.id}">
      <div class="inv-card-head">
        <div class="inv-card-title" data-edit-receptacle="${r.id}" style="cursor:pointer;">
          <div class="inv-card-icon">🎒</div>
          <div class="entity-name">${r.name}</div>
        </div>
        <span class="inv-mini-add" data-add-item-to-receptacle="${r.id}" title="Adicionar item">+</span>
      </div>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBROSA // Painel do Império</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='0' y='0' width='24' height='24' rx='6' fill='%23050912'/%3E%3Cg fill='none' stroke='%2300d4ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 9 L7 3 L9.3 8.2'/%3E%3Cpath d='M20 9 L17 3 L14.7 8.2'/%3E%3Cpath d='M4 9 C4 15.2 8 19 12 19 C16 19 20 15.2 20 9 C20 9 16.8 10.6 12 10.6 C7.2 10.6 4 9 4 9 Z'/%3E%3Ccircle cx='9.2' cy='13.2' r='0.9' fill='%2300d4ff' stroke='none'/%3E%3Ccircle cx='14.8' cy='13.2' r='0.9' fill='%2300d4ff' stroke='none'/%3E%3Cpath d='M10.4 15.4 Q12 16.5 13.6 15.4'/%3E%3C/g%3E%3C/svg%3E">
<!-- PWA: instalável como app no Android (manifest + service worker)
     e no iOS (meta tags apple-* + apple-touch-icon, já que o iOS
     ignora boa parte do manifest.json pra esse fim). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SUBROSA">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050912;
    --bg-panel:#0a1220;
    --bg-panel-2:#0e1a2e;
    --bg-panel-3:#122139;
    --border:#1c3350;
    --border-soft:#142538;
    --text:#e7eefc;
    --text-dim:#8996b3;
    --text-faint:#4c5a78;

    --clean-1:#00d4ff;
    --clean-2:#2f6bff;
    --clean-glow:rgba(0,212,255,0.35);

    --dirty-1:#ff1f4b;
    --dirty-2:#ff5233;
    --dirty-glow:rgba(255,31,75,0.4);

    --warn:#ffb020;
    --danger:#ff4d4d;

    --accent-1:var(--clean-1);
    --accent-2:var(--clean-2);
    --accent-glow:var(--clean-glow);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* app instalado: sem zoom por toque duplo e sem a página "andando" pro lado (no iOS, uma vez ampliado não tem como desfazer) */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{overflow-x:hidden;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(47,107,255,0.05) 0px, rgba(47,107,255,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(47,107,255,0.05) 0px, rgba(47,107,255,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,212,255,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(47,107,255,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    transition:background 0.6s ease;
  }
  body.mode-sujo{
    --bg:#020202;
    --bg-panel:#0a0505;
    --bg-panel-2:#120707;
    --bg-panel-3:#1a0909;
    --border:#3a1015;
    --border-soft:#260c0f;
    --accent-1:var(--dirty-1);
    --accent-2:var(--dirty-2);
    --accent-glow:var(--dirty-glow);
    background:
      repeating-linear-gradient(0deg, rgba(255,31,75,0.05) 0px, rgba(255,31,75,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,31,75,0.05) 0px, rgba(255,31,75,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,31,75,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,31,75,0.08), transparent 60%),
      var(--bg);
  }

  #root{max-width:452px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding:18px 16px 30px;}

  .login-screen{
    flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    width:100%;max-width:360px;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);border-radius:18px;padding:28px 24px;
  }
  .login-title{
    font-family:'Chakra Petch',sans-serif;font-size:17px;font-weight:700;
    text-align:center;margin-bottom:6px;
  }
  .login-error{
    color:var(--danger);font-size:12px;text-align:center;margin:-6px 0 12px;
  }

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ---------- MARCA ---------- */
  .brand{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:1px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-1);
    box-shadow:0 0 8px var(--accent-glow), 0 0 16px var(--accent-glow);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .presence-badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;
    padding:7px 10px;border-radius:10px;
    background:var(--bg-panel);border:1px solid var(--border-soft);color:var(--text-faint);
    display:flex;align-items:center;gap:6px;
    cursor:default;user-select:none;
  }
  .presence-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:var(--text-faint);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .presence-dot:not(.is-online) + .presence-state{opacity:.55;}
  .presence-dot.is-online{
    background:#3ddc84;
    box-shadow:0 0 6px #3ddc84, 0 0 12px #3ddc84;
    animation:pulse 2.2s ease-in-out infinite;
  }

  .mode-cat-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
    transition:border-color .3s ease, background .3s ease;
  }
  .mode-cat-btn:hover{border-color:var(--accent-1);background:var(--bg-panel-2);}
  .mode-cat-btn svg{
    width:19px;height:19px;color:var(--accent-1);
    filter:drop-shadow(0 0 3px var(--accent-glow));
    transition:color .4s ease, filter .4s ease;
  }
  .mode-cat-btn.glitching svg{animation:catGlitch .5s ease;}
  @keyframes catGlitch{
    0%{transform:scale(1) rotate(0);}
    20%{transform:scale(1.18) rotate(-5deg);filter:drop-shadow(0 0 9px var(--accent-glow));}
    45%{transform:scale(0.88) rotate(4deg);}
    65%{transform:scale(1.1) rotate(-2deg);}
    100%{transform:scale(1) rotate(0);}
  }

  .icon-btn{
    width:36px;height:36px;border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg-panel-2);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
    transition:all .2s ease;
  }
  .icon-btn:hover{border-color:var(--accent-1);color:var(--accent-1);}
  .icon-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .icon-btn.primary{
    width:auto;height:auto;
    padding:9px 14px;
    gap:7px;
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    color:#04140f;border:none;font-weight:700;font-size:12.5px;font-family:'JetBrains Mono',monospace;
    letter-spacing:0.3px;
    box-shadow:0 4px 14px var(--accent-glow);
  }
  .icon-btn.primary:hover{color:#04140f;filter:brightness(1.08);}

  /* ---------- NAV ---------- */
  .tabbar{
    display:flex;
    gap:6px;
    padding:0 16px 10px;
  }
  .tab-btn{
    flex:1;
    padding:10px 8px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg-panel);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    text-align:center;
    transition:all .2s ease;
  }
  .tab-btn.active{
    color:var(--bg);
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    border-color:transparent;
    box-shadow:0 4px 16px var(--accent-glow);
  }

  main{flex:1;padding:4px 16px 100px;display:flex;flex-direction:column;gap:14px;}

  /* ---------- CARDS ---------- */
  .card{
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
    opacity:0.5;
  }
  .card-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint);
    margin-bottom:6px;
  }
  .card-label-row{display:flex;align-items:center;justify-content:space-between;}
  .card-label-row .card-label{margin-bottom:0;}
  .edit-link{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent-1);cursor:pointer;font-weight:600;
  }

  .chart-wrap{padding-top:2px;}
  .chart-bars{display:flex;align-items:flex-end;gap:4px;height:90px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
  .chart-bar{width:100%;border-radius:3px;min-height:2px;}
  .chart-zero{position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border);}
  .chart-legend{display:flex;justify-content:space-between;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);flex-wrap:wrap;gap:6px 14px;}
  .networth-svg{width:100%;height:90px;display:block;}
  .chart-legend .item{display:flex;align-items:center;gap:5px;}
  .chart-legend .sw{width:8px;height:8px;border-radius:2px;}
  .balance-hero{font-family:'Chakra Petch',sans-serif;font-size:38px;font-weight:700;letter-spacing:0.5px;}
  .balance-hero small{font-size:16px;color:var(--text-dim);font-weight:500;}
  .balance-sub{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:3px;}
  .stat-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace;}
  .stat-value{font-size:15px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .stat-value.pos{color:var(--clean-1);}
  .stat-value.neg{color:var(--danger);}

  .section-title{
    font-family:'Chakra Petch',sans-serif;
    font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;
    margin:4px 2px 0;
  }
  .section-title .add-link{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);cursor:pointer;font-weight:600;
  }

  .list-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .l-name{color:var(--text);}
  .list-row .l-sub{color:var(--text-faint);font-size:11px;margin-top:2px;}
  .list-row .l-amount{font-family:'JetBrains Mono',monospace;font-weight:600;}

  .txn-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .txn-row:last-child{border-bottom:none;}
  .txn-day{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);
    background:var(--bg-panel-3);border-radius:6px;padding:2px 6px;margin-right:10px;flex-shrink:0;
  }
  .txn-label{flex:1;font-size:12.5px;color:var(--text-dim);}
  .txn-amount{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;white-space:nowrap;}

  .empty-state{
    text-align:center;padding:26px 10px;color:var(--text-faint);font-size:12.5px;
    border:1px dashed var(--border);border-radius:12px;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    border:1px solid var(--border);
    background:var(--bg-panel-3);
    color:var(--text);
    padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s ease;font-family:'Inter',sans-serif;
  }
  .btn:hover{border-color:var(--accent-1);}
  .btn-accent{
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    color:#04140f;border:none;
  }
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:11px;border-radius:8px;}

  /* ---------- SUBTABS ---------- */
  .subtabs{display:flex;gap:6px;margin-bottom:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:600;flex-shrink:0;white-space:nowrap;
    border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  .subtab.active{border-color:var(--accent-1);color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}

  /* ---------- BUSINESS / PROPERTY CARD ---------- */
  .entity-card{
    background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;
    transition:all .2s ease;
  }
  .entity-card:hover{border-color:var(--accent-1);}
  .entity-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entity-name{font-weight:700;font-size:14px;}
  .entity-tag{
    font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;
    padding:3px 7px;border-radius:6px;color:var(--text-faint);border:1px solid var(--border);white-space:nowrap;
  }
  .entity-tag.developing{color:var(--warn);border-color:var(--warn);}
  .entity-tag.mature{color:var(--clean-1);border-color:var(--clean-1);}
  .entity-income{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;margin-top:8px;}
  .progress-track{height:6px;background:var(--bg-panel-3);border-radius:99px;margin-top:8px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--clean-1),var(--clean-2));transition:width .4s ease;}
  .entity-meta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .entity-meta .m{font-size:10.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  .heat-track{height:8px;background:var(--bg-panel-3);border-radius:99px;margin-top:10px;overflow:hidden;position:relative;}
  .heat-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .heat-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);margin-top:4px;font-family:'JetBrains Mono',monospace;}

  .badge-event{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:600;
    padding:5px 9px;border-radius:8px;margin-top:10px;
  }
  .badge-event.buff{color:var(--clean-1);background:rgba(0,230,168,0.1);}
  .badge-event.debuff{color:var(--danger);background:rgba(255,77,77,0.1);}

  /* ---------- CALENDAR ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px;}
  .cal-nav-label{flex:1;text-align:center;}
  .cal-month{font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:700;}
  .cal-year{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);letter-spacing:1px;}
  .cal-today-link{
    text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);
    cursor:pointer;margin:-4px 0 4px;
  }
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-day-cell{
    aspect-ratio:1;border-radius:9px;background:var(--bg-panel-2);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    font-family:'JetBrains Mono',monospace;transition:all .15s ease;
  }
  .month-day-cell:hover{border-color:var(--accent-1);}
  .month-day-cell.today{border-color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 10%, var(--bg-panel-2));box-shadow:0 0 10px var(--accent-glow);}
  .month-day-cell .n{font-size:13px;font-weight:600;}
  .month-day-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--warn);margin-top:3px;}

  .event-card{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .event-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .event-title{font-weight:700;font-size:13.5px;}
  .event-day{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-1);}
  .event-desc{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
  .event-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .event-tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-faint);}

  /* ---------- NOTIFICATIONS ---------- */
  .notif{
    display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft);
  }
  .notif:last-child{border-bottom:none;}
  .notif-icon{font-size:15px;flex-shrink:0;}
  .notif-body{flex:1;}
  .notif-text{font-size:12px;color:var(--text-dim);line-height:1.4;}
  .notif-day{font-size:9.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,5,9,0.75);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:20px 18px 28px;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg-panel-3);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .seg-group{display:flex;gap:6px;}
  .seg-opt{
    flex:1;text-align:center;padding:9px 6px;border-radius:9px;border:1px solid var(--border);
    font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text-dim);font-family:'JetBrains Mono',monospace;
  }
  .seg-opt.active{border-color:var(--accent-1);color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--bg-panel-3);border:1px solid var(--accent-1);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:12.5px;z-index:200;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .hint{font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:2px;}

  /* ---------- BANNER DE INSTALAR COMO APP (PWA) ---------- */
  .install-banner{
    position:fixed;left:14px;right:14px;bottom:14px;z-index:150;
    max-width:420px;margin:0 auto;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--accent-1);border-radius:16px;
    padding:14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
    animation:installBannerIn .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes installBannerIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .install-banner-icon{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(160deg,var(--accent-1),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .install-banner-body{flex:1;min-width:0;}
  .install-banner-title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;}
  .install-banner-sub{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.4;}
  .install-banner-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .install-banner-btn{
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));color:#04140f;border:none;
    padding:8px 14px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .install-banner-close{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-panel-3);border:1px solid var(--border);color:var(--text-faint);
    cursor:pointer;font-size:12px;
  }

  /* ---------- TRANSIÇÃO DE MODO (glitch cyberpunk) ---------- */
  #modeFlash{
    position:fixed;inset:0;pointer-events:none;z-index:500;opacity:0;
    mix-blend-mode:screen;
  }
  #modeFlash::before, #modeFlash::after{
    content:'';position:absolute;inset:0;opacity:0;mix-blend-mode:screen;
  }
  #modeFlash::before{
    background:repeating-linear-gradient(0deg, var(--flash-color, var(--accent-1)) 0px, var(--flash-color, var(--accent-1)) 2px, transparent 2px, transparent 7px);
  }
  #modeFlash::after{
    background:repeating-linear-gradient(0deg, rgba(255,25,90,0.55) 0px, rgba(255,25,90,0.55) 2px, transparent 2px, transparent 8px);
  }
  #modeFlash.active{ background:rgba(255,255,255,0.02); animation:glitchBase .5s steps(1,end); }
  #modeFlash.active::before{ animation:glitchStripeA .5s steps(1,end); }
  #modeFlash.active::after{ animation:glitchStripeB .5s steps(1,end); }
  @keyframes glitchBase{
    0%{opacity:0;} 4%{opacity:.5;} 9%{opacity:.05;} 15%{opacity:.4;} 22%{opacity:0;}
    30%{opacity:.3;} 38%{opacity:.05;} 50%{opacity:.2;} 65%{opacity:.03;} 100%{opacity:0;}
  }
  @keyframes glitchStripeA{
    0%{opacity:0;transform:translateX(0);}
    6%{opacity:.6;transform:translateX(-16px);}
    13%{opacity:.15;transform:translateX(9px);}
    20%{opacity:.5;transform:translateX(-11px);}
    28%{opacity:.1;transform:translateX(5px);}
    38%{opacity:.4;transform:translateX(-4px);}
    50%{opacity:.1;transform:translateX(2px);}
    65%{opacity:.2;transform:translateX(0);}
    100%{opacity:0;transform:translateX(0);}
  }
  @keyframes glitchStripeB{
    0%{opacity:0;transform:translateX(0);}
    8%{opacity:.5;transform:translateX(13px);}
    16%{opacity:.1;transform:translateX(-10px);}
    24%{opacity:.45;transform:translateX(8px);}
    34%{opacity:.08;transform:translateX(-5px);}
    46%{opacity:.3;transform:translateX(3px);}
    60%{opacity:.08;transform:translateX(0);}
    100%{opacity:0;transform:translateX(0);}
  }

  #root.mode-glitch{animation:rootGlitch .5s steps(2,end);}
  @keyframes rootGlitch{
    0%{transform:translate(0,0) skewX(0);filter:none;}
    8%{transform:translate(-5px,1px) skewX(1.5deg);filter:hue-rotate(25deg) saturate(1.6);}
    16%{transform:translate(4px,-2px) skewX(-2deg);filter:none;}
    24%{transform:translate(-3px,0) skewX(1deg);filter:contrast(1.3) saturate(1.8);}
    33%{transform:translate(4px,2px) skewX(-1deg);filter:none;}
    42%{transform:translate(-4px,-1px);filter:hue-rotate(-20deg);}
    52%{transform:translate(2px,1px);filter:none;}
    63%{transform:translate(-2px,0);filter:none;}
    75%{transform:translate(1px,-1px);filter:none;}
    100%{transform:translate(0,0) skewX(0);filter:none;}
  }

  /* ---------- TRANSIÇÃO SUAVE ENTRE ABAS ---------- */
  main{animation:viewIn .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes viewIn{
    from{opacity:0;transform:translateY(8px);filter:blur(2px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
  }
  .tabbar, .subtabs{position:relative;}

  /* ---------- ANIMAÇÕES DOS "APPS" (abrir/fechar/navegar/listas) ---------- */
  @keyframes appShellIn{
    from{opacity:0;transform:translateY(30px) scale(.95);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes appShellOut{
    from{opacity:1;transform:scale(1);}
    to{opacity:0;transform:scale(.14);}
  }
  @keyframes appOpenFromIcon{
    from{opacity:0;transform:scale(.14);}
    60%{opacity:1;}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes overlayFadeOut{from{opacity:1;}to{opacity:0;}}
  .app-shell-enter{animation:appShellIn .32s cubic-bezier(.2,.8,.2,1);}
  .app-shell-enter.from-icon{animation:appOpenFromIcon .4s cubic-bezier(.2,.9,.25,1);}
  .app-shell-exit{animation:appShellOut .26s cubic-bezier(.45,0,.75,.4) forwards;transform-origin:50% 92%;}
  .app-overlay-closing{animation:overlayFadeOut .26s ease forwards;}
  .inv-wrap, .codex-wrap{animation:viewIn .26s cubic-bezier(.2,.8,.2,1);}
  .stagger-in{animation:viewIn .35s cubic-bezier(.2,.8,.2,1) both;}

  /* ---------- DIÁRIO (ponto escondido + visão CAT/DOG) ---------- */
  .diary-trigger{
    position:fixed;bottom:42px;right:max(30px, calc(50% - 196px));z-index:60;
    width:9px;height:9px;border-radius:50%;
    background:var(--text-faint);opacity:0.25;border:none;padding:0;cursor:pointer;
    transition:opacity .3s ease, transform .3s ease, background .3s ease, box-shadow .3s ease;
    display:none;
  }
  .diary-trigger::after{content:'';position:absolute;inset:-6px;}
  .diary-trigger:hover{opacity:1;background:var(--accent-1);box-shadow:0 0 10px var(--accent-glow);transform:scale(1.6);}

  .diary-overlay{
    position:fixed;inset:0;z-index:300;
    background:rgba(4,5,9,0.94);backdrop-filter:blur(6px);
    display:none;flex-direction:column;
    padding:18px 16px 30px;overflow-y:auto;overflow-x:hidden;
    animation:fadeIn .25s ease;
  }
  .diary-head{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto 16px;width:100%;}
  .diary-title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px;}
  .diary-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent-1);box-shadow:0 0 8px var(--accent-glow);}

  .diary-datenav{display:flex;align-items:center;justify-content:center;gap:16px;max-width:1100px;margin:0 auto;width:100%;}
  .diary-date-label{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent-1);text-transform:capitalize;letter-spacing:.3px;min-width:220px;text-align:center;}
  .diary-today-link{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);cursor:pointer;margin:8px auto 0;}
  .diary-history-link{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);cursor:pointer;margin:10px auto 0;max-width:1100px;}

  .diary-history{max-width:1100px;margin:18px auto 0;width:100%;}
  .diary-history-row{
    display:flex;flex-direction:column;gap:7px;padding:13px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;
    transition:background .15s ease;
  }
  .diary-history-row:hover{background:var(--bg-panel-2);}
  .diary-history-row:last-child{border-bottom:none;}
  .diary-history-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);text-transform:capitalize;}
  .diary-history-previews{display:flex;flex-direction:column;gap:5px;}
  .diary-history-preview{font-size:12px;color:var(--text-dim);display:flex;align-items:flex-start;gap:7px;line-height:1.4;}
  .diary-history-preview em{color:var(--text-faint);font-style:normal;}
  .diary-history-preview .diary-col-tag{font-size:9px;padding:2px 6px;flex-shrink:0;margin-top:1px;}

  .diary-cols{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
    max-width:1100px;margin:20px auto 0;width:100%;flex:1;
  }
  @media (max-width:760px){
    .diary-cols{grid-template-columns:1fr;}
  }
  .diary-col{
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);border-radius:16px;padding:14px;
    display:flex;flex-direction:column;min-height:320px;position:relative;overflow:hidden;
  }
  .diary-col::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);opacity:0.5;
  }
  .diary-col-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .diary-col-tag{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:1.5px;
    padding:4px 9px;border-radius:7px;border:1px solid var(--border);
  }
  .diary-col-tag.cat{color:var(--accent-1);border-color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}
  .diary-col-tag.dog{color:var(--warn);border-color:var(--warn);background:rgba(255,176,32,0.1);}
  .diary-col-sub{font-size:11px;color:var(--text-faint);}
  .diary-col-body{flex:1;display:flex;flex-direction:column;}

  .diary-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:34px 10px;border:1px dashed var(--border);border-radius:12px;margin:auto;}
  .diary-readonly img, .diary-editor img{max-width:100%;border-radius:8px;margin:6px 0;display:block;}
  .diary-save-hint{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;margin-top:6px;text-align:right;}

  .diary-editor{background:var(--bg-panel-3);border-radius:10px;flex:1;display:flex;flex-direction:column;}
  .diary-editor .ql-toolbar.ql-snow{background:var(--bg-panel-3);border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;}
  .diary-editor .ql-container.ql-snow{background:var(--bg-panel-3);border:1px solid var(--border);border-radius:0 0 10px 10px;flex:1;font-family:'Inter',sans-serif;font-size:13.5px;}
  .diary-editor .ql-editor{color:var(--text);min-height:220px;}
  .diary-editor .ql-editor.ql-blank::before{color:var(--text-faint);font-style:normal;}
  .diary-editor .ql-snow .ql-stroke{stroke:var(--text-dim);}
  .diary-editor .ql-snow .ql-fill{fill:var(--text-dim);}
  .diary-editor .ql-snow .ql-picker{color:var(--text-dim);}
  .diary-editor .ql-toolbar.ql-snow .ql-formats button:hover .ql-stroke,
  .diary-editor .ql-toolbar.ql-snow .ql-formats button.ql-active .ql-stroke{stroke:var(--accent-1);}
  .diary-editor .ql-toolbar.ql-snow .ql-formats button.ql-active{color:var(--accent-1);}
  .diary-readonly.ql-editor{color:var(--text);}

  /* ---------- ROLADOR DE DADOS ---------- */
  .dice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .dice-btn{
    padding:12px 4px;border-radius:12px;border:1px solid var(--border);background:var(--bg-panel-3);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
    cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .dice-btn:hover{border-color:var(--accent-1);color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 10%, var(--bg-panel-3));}
  .dice-custom-row{display:flex;gap:8px;margin-top:10px;}
  .dice-custom-row input{flex:1;}
  .dice-custom-row button{flex-shrink:0;}
  .dice-result{
    text-align:center;padding:18px 10px;margin-top:14px;border-radius:14px;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));border:1px solid var(--border);
  }
  .dice-result .n{font-family:'Chakra Petch',sans-serif;font-size:40px;font-weight:700;line-height:1;color:var(--accent-1);text-shadow:0 0 16px var(--accent-glow);}
  .dice-result .d{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
  .dice-log{margin-top:14px;max-height:220px;overflow-y:auto;}
  .dice-log-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .dice-log-row:last-child{border-bottom:none;}
  .dice-log-tag{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9.5px;letter-spacing:1px;
    padding:3px 7px;border-radius:6px;border:1px solid var(--border);flex-shrink:0;
  }
  .dice-log-tag.cat{color:var(--accent-1);border-color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}
  .dice-log-tag.dog{color:var(--warn);border-color:var(--warn);background:rgba(255,176,32,0.1);}
  .dice-log-die{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;flex-shrink:0;}
  .dice-log-result{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}

  /* ---------- ELENCO (personagens) ---------- */
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;}
  .char-card{
    background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;
    display:flex;flex-direction:column;gap:6px;transition:border-color .2s ease;
  }
  .char-card:hover{border-color:var(--accent-1);}
  .char-photo{
    width:100%;aspect-ratio:1;border-radius:10px;background:var(--bg-panel-3);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--text-faint);flex-shrink:0;
  }
  .char-name{font-weight:700;font-size:13px;}
  .char-role{font-size:11px;color:var(--text-faint);margin-top:-4px;}
  .char-assign{font-size:10px;color:var(--accent-1);font-family:'JetBrains Mono',monospace;}
  .char-mods{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
  .char-mod-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:6px;border:1px solid var(--border);max-width:100%;overflow-wrap:break-word;}
  .char-mod-badge.pos{color:var(--clean-1);border-color:var(--clean-1);}
  .char-mod-badge.neg{color:var(--danger);border-color:var(--danger);}
  .modifier-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .modifier-row select, .modifier-row input{margin:0;}
  .modifier-row input{max-width:80px;}

  /* ---------- INVENTÁRIO ---------- */
  .inv-wrap{max-width:1100px;margin:0 auto;width:100%;}
  .inv-section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;}
  .inv-container-card{margin-bottom:12px;}
  /* recipiente guardado dentro de um depósito */
  .inv-stored-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .inv-receptacle-stored{
    margin-bottom:0;border-style:dashed;
    background:color-mix(in srgb, var(--accent-1) 6%, var(--bg-panel));
  }
  /* "alça" do recipiente: o título dele é o que se arrasta */
  [data-edit-receptacle]::after{content:'⠿';margin-left:8px;color:var(--text-faint);font-size:15px;letter-spacing:0;opacity:.8;}
  /* arrastando um recipiente: cartão de outro recipiente não é destino "de encaixe" */
  .dnd-drag-receptacle [data-drop^="receptacle:"]{outline:none !important;}
  .inv-items{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
  .inv-item-photo{
    width:38px;height:38px;border-radius:9px;background:var(--bg-panel-3);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .inv-loose-zone{border-radius:16px;transition:background .15s ease;}
  .inv-photo-preview{
    width:60px;height:60px;flex-shrink:0;border-radius:10px;background:var(--bg-panel-3);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-faint);
  }
  .inv-capacity-card{margin-top:2px;}
  .inv-capacity-value{font-family:'Chakra Petch',sans-serif;font-size:27px;font-weight:700;margin-top:6px;}
  .inv-capacity-value .inv-capacity-max{font-size:14px;color:var(--text-dim);font-weight:500;}
  .inv-capacity-track{margin-top:12px;height:8px;}
  .inv-add-wrap{margin:12px 0 6px;display:flex;justify-content:flex-end;}
  .inv-add-btn{width:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 15px;font-size:12px;border-radius:999px;}
  .inv-section-head .inv-section-title{display:flex;align-items:center;gap:7px;}
  .inv-mini-add{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-panel-3);border:1px solid var(--border);color:var(--accent-1);
    font-weight:700;font-size:14px;line-height:1;cursor:pointer;transition:all .15s ease;
  }
  .inv-mini-add:hover{border-color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 15%, var(--bg-panel-3));}
  .inv-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .inv-card-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .inv-card-title .entity-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .inv-card-icon{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--bg-panel-3);
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .inv-item-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;transition:background .15s ease;}
  .inv-item-row:hover{background:var(--bg-panel-3);}
  .inv-item-info{flex:1;min-width:0;}
  .inv-item-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .inv-item-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .inv-item-qty{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-faint);background:var(--bg-panel-3);border-radius:6px;padding:2px 6px;}
  .inv-item-weight{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);white-space:nowrap;}
  .inv-chooser{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .inv-chooser-option{
    display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));border:1px solid var(--border);
    transition:border-color .2s ease, transform .15s ease;
  }
  .inv-chooser-option:hover{border-color:var(--accent-1);transform:translateY(-1px);}
  .inv-chooser-icon{
    width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:21px;background:var(--bg-panel-3);
  }
  .inv-chooser-title{font-weight:700;font-size:14px;}
  .inv-chooser-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}

  /* ---------- ARRASTAR-E-SOLTAR (inventário + codex) ---------- */
  .dnd-dragging{opacity:0.3;}
  .dnd-ghost{
    position:fixed;z-index:400;pointer-events:none;opacity:0.97;
    background:var(--bg-panel-3);border:1px solid var(--accent-1);border-radius:12px;
    box-shadow:0 18px 38px rgba(0,0,0,0.6), 0 0 0 1px var(--accent-1), 0 0 18px var(--accent-glow);
    transform:scale(1.05) rotate(-1.5deg);animation:dndLift .16s ease-out !important;
  }
  @keyframes dndLift{from{transform:scale(1) rotate(0);}to{transform:scale(1.05) rotate(-1.5deg);}}
  .dnd-drop-hover{outline:2px dashed var(--accent-1);outline-offset:2px;background:color-mix(in srgb, var(--accent-1) 16%, transparent);}
  /* enquanto arrasta, todo destino possível fica marcado (fica óbvio pra onde dá pra soltar) */
  .dnd-active [data-drop]{outline:1.5px dashed color-mix(in srgb, var(--accent-1) 50%, transparent);outline-offset:2px;}
  .dnd-active [data-drop].dnd-drop-hover{outline:2px solid var(--accent-1);}
  .dnd-hint{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:410;pointer-events:none;
    width:max-content;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:99px;text-align:center;
    background:rgba(0,0,0,0.82);border:1px solid rgba(255,255,255,0.14);color:#fff;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    animation:dndHintIn .2s ease both;
  }
  @keyframes dndHintIn{from{opacity:0;}to{opacity:1;}}
  /* toque: pan-y deixa a lista rolar normal; segurar ~0,3s pega o item. Sem isso o iOS
     seleciona texto / puxa a foto (arrasto nativo) e cancela o nosso arrasto. */
  [data-open-item], [data-open-entry], [data-open-folder]{
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  [data-open-item] img, [data-open-entry] img, [data-open-folder] img{
    -webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;pointer-events:none;
  }
  .dnd-pressing{scale:0.96;transition:scale .3s ease;}
  .dnd-hint-line{font-size:11.5px;color:var(--text-faint);line-height:1.45;margin:2px 2px 10px;}
  .search-input-wrap{margin:10px 0;}
  .search-input{
    width:100%;background:var(--bg-panel-3);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;
  }
  .search-input::placeholder{color:var(--text-faint);}

  /* ---------- CODEX ---------- */
  .codex-wrap{max-width:1100px;margin:0 auto;width:100%;}
  .codex-breadcrumb{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);cursor:pointer;margin-bottom:14px;}
  .codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
  .codex-folder-card{
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));border:1px solid var(--border);border-radius:16px;
    padding:14px;cursor:pointer;transition:border-color .2s ease, transform .15s ease;display:flex;flex-direction:column;gap:8px;
    aspect-ratio:1;justify-content:flex-end;position:relative;overflow:hidden;
  }
  .codex-folder-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--folder-accent, var(--accent-1));}
  .codex-folder-card:hover{border-color:var(--accent-1);transform:translateY(-2px);}
  .codex-folder-icon{
    width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:19px;flex-shrink:0;
  }
  .codex-folder-card .name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .codex-folder-card .count{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
  .codex-entry-card{
    border-radius:16px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1;
    background:var(--bg-panel-2);border:1px solid var(--border);transition:border-color .2s ease, transform .15s ease;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .codex-entry-card:hover{border-color:var(--accent-1);transform:translateY(-2px);}
  .codex-entry-card .photo{width:100%;height:100%;background-size:cover;background-position:center;}
  .codex-entry-card .no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text-faint);}
  .codex-entry-card .title{
    position:absolute;left:0;right:0;bottom:0;padding:20px 10px 9px;font-size:11.5px;font-weight:600;color:#fff;
    background:linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .color-swatch-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;}
  .color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s ease, border-color .15s ease;flex-shrink:0;}
  .color-swatch:hover{transform:scale(1.1);}
  .color-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--bg-panel-3);}
  .codex-detail-photo{width:100%;border-radius:16px;margin-bottom:14px;max-height:480px;object-fit:contain;background:var(--bg-panel-3);display:block;}
  .codex-detail-photo-empty{display:flex;align-items:center;justify-content:center;font-size:48px;height:260px;color:var(--text-faint);}
  .codex-detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .codex-detail-title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px;}
  .codex-detail-desc{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:10px;white-space:pre-wrap;}

  /* ---------- ÍCONES DE APP ---------- */
  .app-icon-tile{
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    background:none;border:none;padding:0;-webkit-tap-highlight-color:transparent;
  }
  .app-icon-glyph{
    position:relative;width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;
    box-shadow:0 8px 20px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.28);transition:transform .15s ease;
  }
  .app-icon-tile:hover .app-icon-glyph{transform:scale(1.06);}
  .app-icon-tile:active .app-icon-glyph{transform:scale(.9);}
  .app-icon-bank{background:linear-gradient(160deg, #00d4ff, #2f6bff);}
  .app-icon-inventory{background:linear-gradient(160deg, #ffc266, #ff8a00);}
  .app-icon-codex{background:linear-gradient(160deg, #ff8fc7, #c21f95);}
  .app-icon-clock{background:linear-gradient(160deg, #7fd0ff, #3a5bff);}
  .app-icon-dice{background:linear-gradient(160deg, #b58cff, #6a3df0);}
  .app-icon-calendar{background:linear-gradient(180deg, #ffffff, #e6eaf4);flex-direction:column;gap:1px;}
  .cal-icon-m{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;letter-spacing:1.5px;color:#ff3b5c;}
  .cal-icon-d{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:29px;line-height:1;color:#12131a;}
  .app-icon-label{font-size:11px;color:rgba(255,255,255,0.9);font-family:'Inter',sans-serif;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,0.6);}
  .app-badge{
    position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;
    background:#ff3b30;color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(255,59,48,0.55);
    border:2px solid rgba(8,12,26,0.9);box-sizing:content-box;
  }

  /* ---------- MOLDURA DE CELULAR (tela inicial, Banco, Calendário) ---------- */
  .phone{
    --app-fg:var(--text);
    width:100%;max-width:420px;margin:0 auto;flex:1;
    min-height:calc(100vh - 48px);
    display:flex;flex-direction:column;position:relative;
    border-radius:34px;border:1px solid rgba(255,255,255,0.07);
    box-shadow:0 24px 70px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  .phone-app{background:color-mix(in srgb, var(--bg) 92%, transparent);}
  .phone-sticky{
    position:sticky;top:0;z-index:20;border-radius:34px 34px 0 0;
    background:linear-gradient(180deg, var(--bg) 78%, transparent);backdrop-filter:blur(6px);
  }
  .phone-head{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;}
  .phone-home-btn{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;cursor:pointer;
    border:1px solid var(--border);background:var(--bg-panel-2);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;padding:0 0 3px;
    transition:border-color .2s ease, color .2s ease;
  }
  .phone-home-btn:hover{border-color:var(--accent-1);color:var(--accent-1);}
  .phone-head-title{flex:1;min-width:0;}
  .phone-head-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;color:var(--text-faint);margin-top:3px;}

  /* tela inicial */
  .phone-home{
    --app-fg:#eaf2ff;
    --wall-a:#5aa9ff;--wall-b:#2f6bff;--wall-base-1:#0a1226;--wall-base-2:#050912;
    overflow:hidden;padding-bottom:18px;
    background:
      radial-gradient(120% 55% at 50% -8%, color-mix(in srgb, var(--wall-a) 55%, transparent), transparent 70%),
      radial-gradient(90% 50% at 100% 105%, color-mix(in srgb, var(--wall-b) 45%, transparent), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 34px),
      linear-gradient(180deg, var(--wall-base-1), var(--wall-base-2));
  }
  .phone-home.p-madrugada{--wall-a:#8f8cff;--wall-b:#3a2f8f;}
  .phone-home.p-manha{--wall-a:#ffc46b;--wall-b:#ff7a59;}
  .phone-home.p-tarde{--wall-a:#ff9f43;--wall-b:#ff5f6d;}
  .phone-home.p-noite{--wall-a:#5aa9ff;--wall-b:#2f6bff;}
  body.mode-sujo .phone-home{--app-fg:#ffe3e8;--wall-a:#ff1f4b;--wall-b:#7a0d24;--wall-base-1:#12060a;--wall-base-2:#050203;}

  #ghostHome{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    width:min(420px, calc(100vw - 32px));height:calc(100vh - 48px);
    z-index:-1;pointer-events:none;display:flex;
  }
  #ghostHome .phone-home{height:100%;min-height:0;}

  /* orbe de luz que flutua devagar atrás dos ícones (dá vida ao papel de parede) */
  .phone-home::before{
    content:'';position:absolute;z-index:0;width:280px;height:280px;left:-80px;top:42%;border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--wall-b) 38%, transparent), transparent 70%);
    filter:blur(28px);pointer-events:none;animation:orbFloat 16s ease-in-out infinite alternate;
  }
  @keyframes orbFloat{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(150px,-90px) scale(1.2);}
  }
  @media (prefers-reduced-motion: reduce){ .phone-home::before{animation:none;} }
  .phone-home > *{position:relative;z-index:1;}

  .home-balance{
    margin:12px 18px 0;padding:14px 18px;border-radius:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:rgba(255,255,255,0.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.1);transition:transform .15s ease;
  }
  .home-balance:active{transform:scale(.98);}
  .hb-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--wall-a);}
  .hb-value{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:21px;color:#fff;letter-spacing:.5px;}

  .home-widget{
    margin:14px 18px 0;padding:22px 18px 18px;border-radius:26px;text-align:center;cursor:pointer;
    background:rgba(255,255,255,0.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12);box-shadow:0 10px 30px rgba(0,0,0,0.35);
    transition:transform .15s ease;
  }
  .home-widget:active{transform:scale(.98);}
  .hw-time{
    font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:60px;line-height:1;letter-spacing:2px;color:#fff;
    font-variant-numeric:tabular-nums;text-shadow:0 0 26px color-mix(in srgb, var(--wall-a) 65%, transparent);
  }
  .hw-date{margin-top:10px;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:16px;color:rgba(255,255,255,0.92);}
  .hw-period{
    margin-top:8px;display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--wall-a);
  }
  .hw-period svg{width:14px;height:14px;}

  .home-master{
    margin:12px 18px 0;padding:12px;border-radius:22px;
    background:rgba(0,0,0,0.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:10px;
  }
  .hm-head{display:flex;justify-content:space-between;align-items:center;padding:0 2px;}
  .hm-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--wall-a);}
  .hm-link{background:none;border:none;color:rgba(255,255,255,0.55);font-size:11px;cursor:pointer;text-decoration:underline;font-family:'Inter',sans-serif;padding:0;}
  .hm-actions{display:flex;gap:8px;}
  .hm-btn{
    flex:1;padding:11px 8px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.08);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s ease, transform .1s ease;
  }
  .hm-btn:hover{filter:brightness(1.15);}
  .hm-btn:active{transform:scale(.97);}
  .hm-btn:disabled{opacity:.35;cursor:not-allowed;}
  .hm-btn.primary{
    background:linear-gradient(120deg, var(--wall-a), var(--wall-b));border:none;color:#08101f;
    box-shadow:0 4px 16px color-mix(in srgb, var(--wall-a) 45%, transparent);
  }
  .hm-btn svg{width:16px;height:16px;}

  .home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px;padding:26px 14px 0;align-content:start;flex:1;}
  .home-dock{
    margin:22px 14px 0;padding:14px 8px;border-radius:30px;
    background:rgba(255,255,255,0.09);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.12);
    display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;
  }
  .home-dock .app-icon-label{display:none;}
  .phone-home .presence-badge{
    background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.16);color:rgba(255,255,255,0.8);
    padding:3px 9px;border-radius:99px;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
  }
  .home-enter .app-icon-tile{animation:appShellIn .34s cubic-bezier(.2,.8,.2,1) both;}
  .home-enter .home-widget, .home-enter .home-balance, .home-enter .home-master{animation:viewIn .35s cubic-bezier(.2,.8,.2,1) both;}

  /* ---------- "CHROME" DE APP DE CELULAR (inventário/codex) ---------- */
  .app-shell{
    max-width:420px;margin:0 auto;width:100%;
    background:linear-gradient(180deg, var(--app-bg-2), var(--app-bg));
    border-radius:34px;border:1px solid rgba(255,255,255,0.07);
    box-shadow:0 24px 70px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.02);
    display:flex;flex-direction:column;min-height:calc(100vh - 48px);overflow:hidden;
  }
  .app-statusbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px 2px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--app-fg);
    flex-shrink:0;
  }
  .app-statusbar .icons{display:flex;gap:6px;align-items:center;color:var(--app-fg);}
  .app-chrome-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 16px;flex-shrink:0;}
  .app-chrome-title{font-family:'Chakra Petch',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.3px;color:var(--app-fg);}
  .app-chrome-close{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.08);color:var(--app-fg);cursor:pointer;font-size:13px;flex-shrink:0;
  }
  .app-body{flex:1;padding:0 18px 20px;overflow-y:auto;}
  .app-home-indicator{
    position:relative;width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,0.25);margin:6px auto 12px;flex-shrink:0;
    cursor:pointer;touch-action:none;transition:background .2s ease;
  }
  .app-home-indicator::after{content:'';position:absolute;inset:-16px -30px;}
  .app-home-indicator:hover{background:rgba(255,255,255,0.5);}
  .phone-indicator-wrap{
    position:sticky;bottom:0;z-index:20;margin-top:auto;padding:10px 0 4px;border-radius:0 0 34px 34px;
    background:linear-gradient(0deg, var(--bg) 40%, transparent);
  }
  .phone-indicator-wrap .app-home-indicator{background:rgba(255,255,255,0.3);}

  .app-theme-inventory{
    --app-accent:#ff9500; --app-bg:#170f06; --app-bg-2:#241a0c; --app-bg-3:#2e2210; --app-border:#4a3016; --app-fg:#ffe6c2;
    --accent-1:var(--app-accent); --accent-2:#ffb347; --accent-glow:rgba(255,149,0,0.35);
    --bg-panel:var(--app-bg-2); --bg-panel-2:var(--app-bg-2); --bg-panel-3:var(--app-bg-3);
    --border:var(--app-border); --border-soft:var(--app-border); --text:var(--app-fg); --text-dim:#c9a878; --text-faint:#8a6d47;
  }
  /* ---------- APP RELÓGIO ---------- */
  @property --clock-c{syntax:'<color>';inherits:true;initial-value:#5aa9ff;}
  .app-theme-clock{
    --clock-c:#5aa9ff;
    --app-accent:var(--clock-c); --app-bg:#050a1a; --app-bg-2:#0a1330; --app-bg-3:#101c40; --app-border:#1c2f5e; --app-fg:#e2ecff;
    --accent-1:var(--clock-c); --accent-2:var(--clock-c); --accent-glow:color-mix(in srgb, var(--clock-c) 40%, transparent);
    --bg-panel:var(--app-bg-2); --bg-panel-2:var(--app-bg-2); --bg-panel-3:var(--app-bg-3);
    --border:var(--app-border); --border-soft:var(--app-border); --text:var(--app-fg); --text-dim:#9db4e6; --text-faint:#5f78b0;
    background:
      radial-gradient(90% 46% at 50% 0%, color-mix(in srgb, var(--clock-c) 26%, transparent), transparent 72%),
      linear-gradient(180deg, var(--app-bg-2), var(--app-bg));
    transition:--clock-c .9s ease;
  }
  .app-theme-clock.p-madrugada{--clock-c:#8f8cff;}
  .app-theme-clock.p-manha{--clock-c:#ffc46b;}
  .app-theme-clock.p-tarde{--clock-c:#ff9f43;}
  .app-theme-clock.p-noite{--clock-c:#5aa9ff;}

  .clock-app{display:flex;flex-direction:column;align-items:center;padding:0 2px 6px;}
  .clock-date{text-align:center;margin:0 0 14px;}
  .clock-date-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-faint);}
  .clock-date-value{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:21px;color:var(--app-fg);margin-top:4px;}

  .clock-dial{
    position:relative;width:100%;max-width:340px;aspect-ratio:1;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    container-type:inline-size;
  }
  .clock-dial::before{
    content:'';position:absolute;inset:-4%;border-radius:50%;z-index:0;
    background:radial-gradient(circle, color-mix(in srgb, var(--clock-c) 30%, transparent), transparent 66%);
    filter:blur(16px);opacity:.75;pointer-events:none;
  }
  .clock-dial > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;z-index:1;}
  .clock-dial.is-master{cursor:grab;}
  .clock-dial.dragging{cursor:grabbing;}
  .clock-ring{fill:none;stroke:var(--clock-c);stroke-width:2;opacity:.65;filter:drop-shadow(0 0 6px var(--clock-c));}
  .clock-face{stroke:rgba(255,255,255,0.07);stroke-width:1;}
  .clock-core{fill:rgba(0,0,0,0.28);stroke:color-mix(in srgb, var(--clock-c) 30%, transparent);stroke-width:1;}
  .clock-tick{stroke:color-mix(in srgb, var(--app-fg) 26%, transparent);stroke-width:1.4;stroke-linecap:round;}
  .clock-tick.major{stroke:var(--clock-c);stroke-width:2.8;opacity:.95;}
  .clock-num{fill:var(--text-dim);font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;text-anchor:middle;dominant-baseline:central;}
  .clock-num.q{fill:var(--app-fg);font-size:18px;font-weight:700;}

// indicador de presença: mostra se mestre/jogador estão com o app aberto
// agora (Supabase Realtime Presence, efêmero — some sozinho ao fechar a aba).
let presenceChannel = null;
let presenceOnline = { master: false, player: false };

function otherSideOnline(){ return isMaster ? presenceOnline.player : presenceOnline.master; }
function presenceBadgeTitle(){
  return `${isMaster?'Jogador':'Mestre'} ${otherSideOnline()?'online agora':'offline'}`;
}
function presenceBadgeInner(){
  return `<span class="presence-dot ${otherSideOnline()?'is-online':''}"></span><span class="presence-state">${isMaster?'Jogador':'Mestre'} ${otherSideOnline()?'online':'offline'}</span>`;

function subscribePresence(){
  if(presenceChannel){
    sb.removeChannel(presenceChannel);
    presenceChannel = null;
  }
  const role = isMaster ? 'master' : 'player';
  presenceChannel = sb.channel('subrosa_presence', { config: { presence: { key: role } } });
  presenceChannel.on('presence', { event: 'sync' }, ()=>{
    const st = presenceChannel.presenceState();
    presenceOnline = {
      master: !!(st.master && st.master.length),
      player: !!(st.player && st.player.length)
    };
    // atualiza só o badge (sem render() geral) pra não apagar o que a pessoa

      await presenceChannel.track({ online_at: new Date().toISOString() });
    }
  });
}

function isMasterSessionExpiredError(msg){

/* ============================================================
   CALENDÁRIO FICTÍCIO
   ============================================================ */
const START_YEAR = 3430;
const MONTH_NAMES = ['Nivar','Ferrai','Marcelle','Abrenn','Maelis','Junara','Solvinn','Augrist','Setrune','Octaven','Novembrys','Decarion'];
const MONTH_LENGTHS = [31,28,31,30,31,30,31,31,30,31,30,31];
const YEAR_LENGTH = MONTH_LENGTHS.reduce((s,n)=>s+n,0); // 365

// dia absoluto (state.day, começa em 1) -> {year, month(0-11), dayOfMonth(1-N)}
function dayToDate(dayNum){
  let remaining = dayNum - 1;
  let year = START_YEAR;
  while(remaining >= YEAR_LENGTH){ remaining -= YEAR_LENGTH; year++; }
  let month = 0;
  while(remaining >= MONTH_LENGTHS[month]){ remaining -= MONTH_LENGTHS[month]; month++; }
  return { year, month, dayOfMonth: remaining + 1 };
}

// primeiro dia absoluto de um determinado mês/ano
function firstDayNumberOfMonth(year, month){
  let total = (year - START_YEAR) * YEAR_LENGTH;
  for(let m=0; m<month; m++) total += MONTH_LENGTHS[m];
  return total + 1;
}

function formatDate(dayNum){
  const { year, month, dayOfMonth } = dayToDate(dayNum);
  return `${dayOfMonth} de ${MONTH_NAMES[month]} de ${year}`;
}

function formatDateShort(dayNum){
  const { year, month, dayOfMonth } = dayToDate(dayNum);
  return `${dayOfMonth} ${MONTH_NAMES[month].slice(0,3)} ${year}`;
}


function defaultState(){
  return {
    day: 1,
    mode: 'limpo',
    tab: 'saldo',
    investSubTab: 'negocios',
    clean: {
      balance: 0,
      credit: 0,
      fixedExpenses: [],
      fixedIncomes: [],
      transactions: []
    },
    dirty: {
      balance: 0,
      transactions: []
    },

    researches: [],
    characters: [],
    events: [],

    clock: '08:00',
    history: []
  };
}

let state = null;
let realtimeChannel = null;

// campanhas antigas foram salvas antes dessas listas existirem
function ensureStateDefaults(s){
  if(!s.researches) s.researches = [];
  if(!s.characters) s.characters = [];
  if(s.playerCarryCapacity == null) s.playerCarryCapacity = 50;
  if(!/^\d{2}:\d{2}$/.test(s.clock || '')) s.clock = '08:00';
  if(!s.clean.fixedIncomes) s.clean.fixedIncomes = [];
  return s;
}

async function loadState(){
  try{
    const { data, error } = await sb.from('game_state').select('data').eq('id', 1).single();
    if(error) throw error;
    state = ensureStateDefaults(data.data || defaultState());
  } catch(e){
    console.error('Falha ao carregar estado do Supabase', e);
    state = defaultState();
  }
  render();
  subscribeRealtime();
  subscribePresence();
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb
    .channel('game_state_changes')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' },
      (payload)=>{
        state = ensureStateDefaults(payload.new.data);
        render();
        if(clockOpen && !clockDrag && !clockCommitting) updateClockView();
        else refreshAppStatusBars();
      }
    )
    .subscribe();
}

let saveTimer = null;
let isSaving = false;
let pendingSave = false;
let saveErrorShown = false;

// Só o mestre grava o estado inteiro; o jogador nunca chama isso
// diretamente (as ações dele passam por funções próprias e restritas).
function saveState(){
  if(!isMaster) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> flushSave(), 350);
}

async function flushSave(attempt = 1){
  if(!isMaster) return;
  if(isSaving){
    pendingSave = true;
    return;
  }
  isSaving = true;
  try{
    const { error } = await sb.rpc('master_update_state', { token: masterToken, new_data: state });
    if(error) throw error;
    saveErrorShown = false;
  } catch(e){
    console.error('Falha ao salvar', e);
    if(isMasterSessionExpiredError(e?.message)){
      isSaving = false;
      handleExpiredMasterSession();
      return;
    }
    if(attempt < 3){
      setTimeout(()=> { isSaving = false; flushSave(attempt+1); }, 800 * attempt);
      return;
    }
    if(!saveErrorShown){
      saveErrorShown = true;
      showToast('Não consegui salvar agora. Tentando de novo em segundo plano.');
      setTimeout(()=> flushSave(1), 5000);
    }
  } finally {
    isSaving = false;
    if(pendingSave){
      pendingSave = false;
      flushSave();
    }
  }
}

const CURRENCY_SYMBOL = 'Ⓢ';
function fmt(n){
  const v = Math.round(n);
  return (v<0?'-':'') + CURRENCY_SYMBOL + ' ' + Math.abs(v).toLocaleString('pt-BR');
}
function fmtSigned(n){
  const v = Math.round(n);
  return (v>=0?'+':'-') + CURRENCY_SYMBOL + ' ' + Math.abs(v).toLocaleString('pt-BR');
}

/* ============================================================

/* ============================================================
   MOTOR DE SIMULAÇÃO — AVANÇAR / VOLTAR DIA
   Roda no servidor (Edge Functions). O resultado chega de volta
   automaticamente pelo canal em tempo real.

function pushNotification(icon, text){
  state.notifications.unshift({ id: uid('ntf'), day: state.day, icon, text });
  if(state.notifications.length > 60) state.notifications.pop();
}

let dayActionInFlight = false;

async function callDayFunction(fnName){
  if(!isMaster || dayActionInFlight) return;
  dayActionInFlight = true;
  render();
  try{
    const { data, error } = await sb.functions.invoke(fnName, { body: { token: masterToken } });
    if(error || (data && data.error)){
      throw new Error((data && data.error) || error.message || 'falha desconhecida');
    }
    // o estado atualizado chega pelo Realtime; não precisa fazer nada aqui
  } catch(e){
    console.error(`Falha ao chamar ${fnName}`, e);
    if(isMasterSessionExpiredError(e?.message)){
      handleExpiredMasterSession();
    } else {
      showToast('Não consegui avançar/voltar o dia agora. Tenta de novo em alguns segundos.');
    }
  } finally {
    dayActionInFlight = false;
    render();
  }
}

function showToast(msg){

// trava o scroll da página por trás dos overlays (diário/inventário/codex/apps).
// no iOS o touch "vaza" pro body mesmo com o overlay em position:fixed, então
// precisa fixar o body no lugar (não só overflow:hidden) — contador porque
// dá pra abrir um overlay de dentro de outro (ex: apps -> codex) por um instante.
let scrollLockCount = 0;
let scrollLockY = 0;
function lockBodyScroll(){
  if(scrollLockCount === 0){
    scrollLockY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = (-scrollLockY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  scrollLockCount++;
}
function unlockBodyScroll(){
  scrollLockCount = Math.max(0, scrollLockCount - 1);
  if(scrollLockCount === 0){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, scrollLockY);
  }
}

function toggleMode(btnEl){
  const newMode = state.mode === 'limpo' ? 'sujo' : 'limpo';
  const flash = document.getElementById('modeFlash');
  const root = document.getElementById('root');
  if(flash){
    flash.style.setProperty('--flash-color', newMode === 'sujo' ? 'var(--dirty-1)' : 'var(--clean-1)');
    flash.classList.remove('active');
    void flash.offsetWidth; // reinicia a animação
    flash.classList.add('active');
  }
  if(root){
    root.classList.remove('mode-glitch');
    void root.offsetWidth; // reinicia a animação
    root.classList.add('mode-glitch');
  }
  if(btnEl) btnEl.classList.add('glitching');
  setTimeout(()=>{
    state.mode = newMode;
    saveState();
    render();
  }, 190);
}

function render(){

  if(state === null){
    document.body.className = '';
    root.innerHTML = renderLoginScreen();
    attachLoginHandlers();
    syncDiaryTrigger();
    return;

  else if(ui.app === 'calendar') screen = renderCalendarApp(enter);
  else screen = renderHome(enter);
  root.innerHTML = `
    ${screen}
    ${ui.modal ? renderModal() : ''}
    ${ui.toast ? `<div class="toast">${ui.toast}</div>` : ''}
  `;
  attachHandlers();
  syncDiaryTrigger();
  if(enter === 'app' && ui.app){
    const frame = root.querySelector('.phone-app');
    if(frame) animateOpenFromIcon(frame, ui.app);
  }
}

      <button class="btn btn-accent btn-block" id="choosePlayer" style="margin-bottom:10px;">Entrar como jogador</button>

function attachLoginHandlers(){
  const $ = sel => document.querySelector(sel);

  const choosePlayer = $('#choosePlayer');
  if(choosePlayer) choosePlayer.onclick = ()=>{ enterAsPlayer(); loadState(); };

  const chooseMaster = $('#chooseMaster');
  if(chooseMaster) chooseMaster.onclick = ()=>{ loginMode = 'pin'; loginError=''; render(); };

  const pinBack = $('#pinBack');
  if(pinBack) pinBack.onclick = ()=>{ loginMode = 'choose'; loginError=''; render(); };

  const pinSubmit = $('#pinSubmit');
  const pinInput = $('#pinInput');
  if(pinInput) pinInput.focus();

  async function submitPin(){
    const pin = pinInput.value.trim();
    if(!pin) return;
    loginLoading = true; loginError=''; render();
    try{
      await loginAsMaster(pin);
      loadState();
    } catch(e){
      loginLoading = false;
      loginError = 'PIN incorreto. Tenta de novo.';
      render();
    }
  }

  if(pinSubmit) pinSubmit.onclick = submitPin;
  if(pinInput) pinInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitPin(); });
}

/* ---------- HORÁRIO ----------
   O mestre escolhe o horário na mão (app Relógio); ele não entra na simulação
   (os eventos continuam acontecendo na passagem do dia). O único efeito é que
   passar da meia-noite arrastando os ponteiros avança o dia. */
const CLOCK_SVG = (inner)=> `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const CLOCK_ICONS = {
  madrugada: CLOCK_SVG('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3v3M15.5 4.5h3"/>'),
  manha: CLOCK_SVG('<path d="M12 3v3M4.9 8.9l2 2M19.1 8.9l-2 2M2 17h20"/><path d="M6.5 17a5.5 5.5 0 0 1 11 0"/><path d="M8 21h8"/>'),
  tarde: CLOCK_SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  noite: CLOCK_SVG('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>')
};
const CLOCK_LABELS = { madrugada:'Madrugada', manha:'Manhã', tarde:'Tarde', noite:'Noite' };

function clockPeriod(hhmm){
  const h = parseInt((hhmm || '08:00').slice(0,2), 10);
  if(h < 6) return 'madrugada';
  if(h < 12) return 'manha';
  if(h < 18) return 'tarde';
  return 'noite';
}

// badge do Calendário: acontecimentos novos no "Registro" desde a última vez que abriu o app
const SEEN_NOTIF_KEY = 'subrosa_seen_notif';
function markNotificationsSeen(){
  const top = (state.notifications || [])[0];
  try{ if(top) localStorage.setItem(SEEN_NOTIF_KEY, top.id); } catch(e){}
}
function unseenNotifCount(){
  const list = state.notifications || [];
  if(!list.length) return 0;
  let seen = null;
  try{ seen = localStorage.getItem(SEEN_NOTIF_KEY); } catch(e){}
  if(!seen){ markNotificationsSeen(); return 0; }
  const idx = list.findIndex(n => n.id === seen);
  return idx === -1 ? 0 : idx;
}

// de onde o ícone do app estava na tela: o app abre crescendo dali e fecha encolhendo pra lá
const appOrigins = {};
function rememberAppOrigin(id, el){
  const box = (el.querySelector('.app-icon-glyph') || el).getBoundingClientRect();
  appOrigins[id] = { x: box.left + box.width / 2, y: box.top + box.height / 2 };
}
function setAnimOrigin(el, id){
  const o = appOrigins[id];
  if(!el || !o) return false;
  const r = el.getBoundingClientRect();
  el.style.transformOrigin = `${o.x - r.left}px ${o.y - r.top}px`;
  return true;
}
function animateOpenFromIcon(el, id){
  if(setAnimOrigin(el, id)) el.classList.add('from-icon');
}
function animateExitToIcon(el, id){
  setAnimOrigin(el, id);
  el.classList.add('app-shell-exit');
}
const APP_EXIT_MS = 260;
const APP_OPEN_MS = 400;

// Banco/Calendário substituem a home no #root; durante a transição uma cópia
// estática da home fica atrás (fixa, atrás de tudo) pra o app crescer/encolher
// sobre a tela inicial em vez de sobre o vazio.
let ghostHomeTimer = null;
function showGhostHome(ms){
  hideGhostHome();
  const g = document.createElement('div');
  g.id = 'ghostHome';
  g.innerHTML = renderHome(null);
  document.body.appendChild(g);
  ghostHomeTimer = setTimeout(hideGhostHome, ms);
}
function hideGhostHome(){
  clearTimeout(ghostHomeTimer);
  const g = document.getElementById('ghostHome');
  if(g) g.remove();
}

// abre Banco/Calendário em tela cheia por cima da home
function openScreenApp(id){
  showGhostHome(APP_OPEN_MS + 80);
  ui.app = id;
  ui.enter = 'app';
  if(id === 'calendar') markNotificationsSeen();
  pushAppHistory();
  window.scrollTo(0, 0);
  render();
}

let leavingApp = false;
function goHome(){
  if(!ui.app || leavingApp) return;
  leavingApp = true;
  popAppHistory();
  const appId = ui.app;
  const finish = ()=>{
    if(ui.app === 'calendar') markNotificationsSeen();
    ui.app = null;
    ui.enter = 'home';
    leavingApp = false;
    window.scrollTo(0, 0);
    render();
  };
  const frame = document.querySelector('#root .phone');
  if(frame){
    showGhostHome(APP_EXIT_MS + 120);
    animateExitToIcon(frame, appId);
    setTimeout(finish, APP_EXIT_MS);
  } else {
    finish();
  }
}

// deslizar pra cima (ou tocar) na barra de baixo de qualquer app volta pra home
let indicatorGesture = null;
document.addEventListener('pointerdown', (e)=>{
  if(e.target.closest && e.target.closest('.app-home-indicator')) indicatorGesture = { y: e.clientY };
});
document.addEventListener('pointerup', (e)=>{
  if(!indicatorGesture) return;
  const dy = indicatorGesture.y - e.clientY;
  indicatorGesture = null;
  if(dy > 24 || Math.abs(dy) < 6) closeAllApps();
});
document.addEventListener('pointercancel', ()=>{ indicatorGesture = null; });

// botão "voltar" do celular (Android/PWA) fecha o app aberto em vez de sair do site.
// Cada app aberto empurra 1 entrada no histórico; fechar pela UI desfaz essa entrada.
let closingFromPop = false;
function pushAppHistory(){
  try{ if(!(history.state && history.state.subrosaApp)) history.pushState({ subrosaApp: true }, ''); } catch(e){}
}
function popAppHistory(){
  try{ if(!closingFromPop && history.state && history.state.subrosaApp) history.back(); } catch(e){}
}
function closeAllApps(){
  if(ui.modal === 'diceRoller') closeModal();
  if(inventoryOpen) closeInventory();
  if(codexOpen) closeCodex();
  if(clockOpen) closeClockApp();
  if(diaryOpen) closeDiary();
  if(ui.app) goHome();
}
window.addEventListener('popstate', ()=>{
  closingFromPop = true;
  try{
    // dentro de um app com telas internas (pasta do Codex, formulário do Depósito),
    // o "voltar" sobe um nível antes de fechar o app; a entrada do histórico
    // consumida pelo voltar é reposta pra ele continuar valendo
    if(codexOpen && !codexIsAtRoot()){ codexGoBack(); pushAppHistory(); }
    else if(inventoryOpen && invView !== 'list'){ invView = 'list'; renderInventoryOverlay(); pushAppHistory(); }
    else closeAllApps();
  } finally { closingFromPop = false; }
});
try{ if(history.state && history.state.subrosaApp) history.replaceState(null, ''); } catch(e){}

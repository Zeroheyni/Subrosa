/* ============================================================
   INVENTÁRIO — mestre e jogador podem criar/remover livremente.
   Vive fora do #root, mesmo motivo do diário: o formulário de
   criar/editar não pode ser atropelado por um render() alheio.
   ============================================================ */
let inventoryOpen = false;
let inventoryContainers = [];
let inventoryItems = [];
let inventoryReceptacles = [];
let invChannel = null;
let invView = 'list'; // 'list' | 'containerForm' | 'itemForm' | 'receptacleForm' | 'capacityForm'
let invEditingId = null;
let invFormPlace = null; // pre-seleciona o "Lugar" do item: '' (com você), 'container:ID' ou 'receptacle:ID'
let invFormPhoto = undefined;
let invFormDraft = null; // {name, description, weight, quantity, place} — preserva o formulário quando um upload de foto força um re-render
let invRecFormPhoto = undefined;
let invRecFormDraft = null; // {name, description, baseWeight, capacity}

function syncItemFormDraft(){
  const $ = sel => document.querySelector(sel);
  if(!$('#mItemName')) return;
  invFormDraft = {
    name: $('#mItemName').value,
    description: $('#mItemDescription').value,
    weight: $('#mItemWeight').value,
    quantity: $('#mItemQuantity').value,
    place: $('#mItemContainer').value
  };
}

function syncReceptacleFormDraft(){
  const $ = sel => document.querySelector(sel);
  if(!$('#mRecName')) return;
  invRecFormDraft = {
    name: $('#mRecName').value,
    description: $('#mRecDescription').value,
    baseWeight: $('#mRecBaseWeight').value,
    capacity: $('#mRecCapacity').value
  };
}

function computePlayerCapacityUsage(){
  const loose = inventoryItems.filter(it=>!it.container_id && !it.receptacle_id)
    .reduce((s,it)=>s + it.weight*it.quantity, 0);
  const receptaclesUsed = inventoryReceptacles.reduce((s,r)=>{
    const itemsHalf = inventoryItems.filter(it=>it.receptacle_id===r.id)
      .reduce((s2,it)=>s2 + (it.weight*it.quantity)/2, 0);
    return s + r.base_weight + itemsHalf;
  }, 0);
  return loose + receptaclesUsed;
}

async function openInventory(){
  inventoryOpen = true;
  invView = 'list';
  invEditingId = null;
  invFormPlace = null;
  invFormPhoto = undefined;
  invFormDraft = null;
  invRecFormPhoto = undefined;
  invRecFormDraft = null;
  const overlay = document.getElementById('inventoryOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando inventário…</div>`;
  render();
  try{
    await loadInventoryData();
    renderInventoryOverlay();
    subscribeInventoryRealtime();
  } catch(e){
    console.error('Falha ao abrir inventário', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o inventário agora.</div>`;
  }
}

function closeInventory(){
  inventoryOpen = false;
  invView = 'list';
  invEditingId = null;
  const overlay = document.getElementById('inventoryOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  render();
}

async function loadInventoryData(){
  const [{ data: containers, error: e1 }, { data: items, error: e2 }, { data: receptacles, error: e3 }] = await Promise.all([
    sb.from('inventory_containers').select('*').order('created_at'),
    sb.from('inventory_items').select('*').order('created_at'),
    sb.from('inventory_receptacles').select('*').order('created_at')
  ]);
  if(e1) throw e1;
  if(e2) throw e2;
  if(e3) throw e3;
  inventoryContainers = containers || [];
  inventoryItems = items || [];
  inventoryReceptacles = receptacles || [];
}

function subscribeInventoryRealtime(){
  if(invChannel) return;
  invChannel = sb.channel('inventory_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_containers' }, (payload)=>{
      applyRealtimeUpsert(inventoryContainers, payload);
      if(inventoryOpen && invView==='list') renderInventoryOverlay();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_items' }, (payload)=>{
      applyRealtimeUpsert(inventoryItems, payload);
      if(inventoryOpen && invView==='list') renderInventoryOverlay();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'inventory_receptacles' }, (payload)=>{
      applyRealtimeUpsert(inventoryReceptacles, payload);
      if(inventoryOpen && invView==='list') renderInventoryOverlay();
    })
    .subscribe();
}

function renderInventoryOverlay(){
  const overlay = document.getElementById('inventoryOverlay');
  overlay.innerHTML = `
    <div class="app-shell app-theme-inventory">
      ${renderAppStatusBar()}
      <div class="app-chrome-head">
        <div class="app-chrome-title">Depósito</div>

      </div>
      <div class="app-body"><div class="inv-wrap">${renderInventoryBody()}</div></div>

  attachInventoryHandlers();
}

function renderInventoryBody(){
  if(invView === 'containerForm') return renderContainerForm();
  if(invView === 'itemForm') return renderItemForm();
  if(invView === 'receptacleForm') return renderReceptacleForm();
  if(invView === 'capacityForm') return renderPlayerCapacityForm();
  return renderInventoryList();
}

function renderInventoryList(){
  const itemsByContainer = {};
  const itemsByReceptacle = {};
  const loose = [];
  inventoryItems.forEach(it=>{
    if(it.container_id){ (itemsByContainer[it.container_id] = itemsByContainer[it.container_id]||[]).push(it); }
    else if(it.receptacle_id){ (itemsByReceptacle[it.receptacle_id] = itemsByReceptacle[it.receptacle_id]||[]).push(it); }
    else loose.push(it);
  });
  const used = computePlayerCapacityUsage();
  const max = (state && state.playerCarryCapacity) || 50;
  const pct = max ? Math.min(100, Math.round((used/max)*100)) : 0;
  return `
    <div class="card inv-container-card">
      <div class="card-label-row">
        <div class="entity-name">Sua carga</div>
        ${isMaster ? `<span class="edit-link" id="invEditCapacity">✎ editar</span>` : ''}
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;${pct>=100?'background:var(--danger);':''}"></div></div>
      <div class="hint">${fmtWeight(used)} / ${fmtWeight(max)} de carga</div>
    </div>

    <div class="inv-section-head">
      <div class="section-title" style="margin:0;">Lugares</div>
      <span class="add-link" id="invAddContainer">+ novo lugar</span>
    </div>
    ${inventoryContainers.length ? inventoryContainers.map(c=>renderContainerCard(c, itemsByContainer[c.id]||[])).join('') : '<div class="empty-state">Nenhum lugar criado ainda.</div>'}

    <div class="inv-section-head">
      <div class="section-title" style="margin:0;">Recipientes</div>
      <span class="add-link" id="invAddReceptacle">+ novo recipiente</span>
    </div>
    ${inventoryReceptacles.length ? inventoryReceptacles.map(r=>renderReceptacleCard(r, itemsByReceptacle[r.id]||[])).join('') : '<div class="empty-state">Nenhum recipiente criado ainda.</div>'}

    <div class="inv-section-head">
      <div class="section-title" style="margin:0;">Direto com você</div>
      <span class="add-link" data-add-item-to="">+ item</span>
    </div>
    ${loose.length ? `<div class="inv-items">${loose.map(it=>renderItemRowHtml(it)).join('')}</div>` : '<div class="empty-state">Nada solto por aqui.</div>'}
  `;
}

function renderContainerCard(c, items){
  const used = items.reduce((s,it)=>s + (it.weight*it.quantity), 0);
  const pct = c.capacity ? Math.min(100, Math.round((used/c.capacity)*100)) : 0;
  return `
    <div class="card inv-container-card">
      <div class="card-label-row">
        <div class="entity-name" data-edit-container="${c.id}" style="cursor:pointer;">${c.name}</div>
        <span class="add-link" data-add-item-to="${c.id}">+ item</span>
      </div>
      ${c.capacity ? `
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;${pct>=100?'background:var(--danger);':''}"></div></div>
        <div class="hint">${fmtWeight(used)} / ${fmtWeight(c.capacity)} de carga</div>
      ` : `<div class="hint">Sem limite de carga · ${fmtWeight(used)} carregado</div>`}
      <div class="inv-items">
        ${items.length ? items.map(it=>renderItemRowHtml(it)).join('') : '<div class="empty-state" style="padding:14px;">Vazio.</div>'}
      </div>
    </div>
  `;
}

function renderReceptacleCard(r, items){
  const used = items.reduce((s,it)=>s + (it.weight*it.quantity)/2, 0);
  const pct = r.capacity ? Math.min(100, Math.round((used/r.capacity)*100)) : 0;
  const effective = r.base_weight + used;
  return `
    <div class="card inv-container-card">
      <div class="card-label-row">
        <div class="entity-name" data-edit-receptacle="${r.id}" style="cursor:pointer;">${r.name}</div>

      <div class="hint">${fmtWeight(used)} / ${fmtWeight(r.capacity)} de carga interna · carrega ${fmtWeight(effective)} de você (${fmtWeight(r.base_weight)} vazio)</div>
      <div class="inv-items">
        ${items.length ? items.map(it=>renderItemRowHtml(it)).join('') : '<div class="empty-state" style="padding:14px;">Vazio.</div>'}

}

function attachInventoryHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  $('#invClose').onclick = closeInventory;

  if(invView === 'list'){
    const editCap = $('#invEditCapacity');
    if(editCap) editCap.onclick = ()=>{ invView='capacityForm'; renderInventoryOverlay(); };
    $('#invAddContainer').onclick = ()=>{ invView='containerForm'; invEditingId=null; renderInventoryOverlay(); };
    $('#invAddReceptacle').onclick = ()=>{ invView='receptacleForm'; invEditingId=null; invRecFormPhoto=undefined; invRecFormDraft=null; renderInventoryOverlay(); };
    $$('[data-edit-container]').forEach(el=>{
      el.onclick = ()=>{ invView='containerForm'; invEditingId=el.dataset.editContainer; renderInventoryOverlay(); };
    });
    $$('[data-edit-receptacle]').forEach(el=>{
      el.onclick = ()=>{ invView='receptacleForm'; invEditingId=el.dataset.editReceptacle; invRecFormPhoto=undefined; invRecFormDraft=null; renderInventoryOverlay(); };
    });
    $$('[data-add-item-to]').forEach(el=>{
      el.onclick = ()=>{ invView='itemForm'; invEditingId=null; invFormPlace=el.dataset.addItemTo ? ('container:'+el.dataset.addItemTo) : ''; invFormPhoto=undefined; invFormDraft=null; renderInventoryOverlay(); };
    });
    $$('[data-add-item-to-receptacle]').forEach(el=>{
      el.onclick = ()=>{ invView='itemForm'; invEditingId=null; invFormPlace='receptacle:'+el.dataset.addItemToReceptacle; invFormPhoto=undefined; invFormDraft=null; renderInventoryOverlay(); };
    });
    $$('[data-open-item]').forEach(el=>{
      el.onclick = ()=>{ invView='itemForm'; invEditingId=el.dataset.openItem; invFormPhoto=undefined; invFormDraft=null; renderInventoryOverlay(); };
    });
  }

  if(invView === 'containerForm'){
    $('#invBackToList').onclick = ()=>{ invView='list'; renderInventoryOverlay(); };
    $('#saveContainerBtn').onclick = saveContainer;
    const del = $('#deleteContainerBtn');
    if(del) del.onclick = ()=> deleteContainer(invEditingId);
  }

  if(invView === 'receptacleForm'){
    $('#invBackToList').onclick = ()=>{ invView='list'; renderInventoryOverlay(); };
    $('#receptaclePhotoBtn').onclick = handleReceptaclePhotoUpload;
    $('#saveReceptacleBtn').onclick = saveReceptacle;
    const del = $('#deleteReceptacleBtn');
    if(del) del.onclick = ()=> deleteReceptacle(invEditingId);
  }

  if(invView === 'itemForm'){
    $('#invBackToList').onclick = ()=>{ invView='list'; renderInventoryOverlay(); };
    $('#itemPhotoBtn').onclick = handleInventoryItemPhotoUpload;
    $('#saveItemBtn').onclick = saveItem;
    const del = $('#deleteItemBtn');
    if(del) del.onclick = ()=> deleteItem(invEditingId);
  }

  if(invView === 'capacityForm'){
    $('#invBackToList').onclick = ()=>{ invView='list'; renderInventoryOverlay(); };
    $('#saveCapacityBtn').onclick = savePlayerCapacity;
  }
}

function savePlayerCapacity(){
  const value = parseFloat(document.getElementById('mPlayerCapacity').value);
  if(isNaN(value) || value <= 0){ showToast('Digita um valor válido.'); return; }
  state.playerCarryCapacity = value;
  saveState();
  invView = 'list';
  renderInventoryOverlay();
  showToast('Carga máxima atualizada.');
}

async function saveContainer(){

  const capacityRaw = document.getElementById('mContainerCapacity').value;
  const capacity = capacityRaw === '' ? null : parseFloat(capacityRaw);
  try{
    if(invEditingId){
      const { error } = await sb.rpc('inventory_update_container', { p_id: invEditingId, p_name: name, p_capacity: capacity });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('inventory_create_container', { p_name: name, p_capacity: capacity, p_created_by: myRole() });

async function saveItem(){
  const name = document.getElementById('mItemName').value.trim();
  if(!name){ showToast('Digita um nome pro item.'); return; }
  const description = document.getElementById('mItemDescription').value.trim();
  const weight = parseFloat(document.getElementById('mItemWeight').value) || 0;
  const quantity = parseInt(document.getElementById('mItemQuantity').value) || 1;
  const placeRaw = document.getElementById('mItemContainer').value;
  const containerId = placeRaw.startsWith('container:') ? placeRaw.slice('container:'.length) : null;
  const receptacleId = placeRaw.startsWith('receptacle:') ? placeRaw.slice('receptacle:'.length) : null;
  const existing = invEditingId ? inventoryItems.find(i=>i.id===invEditingId) : null;
  const imageUrl = invFormPhoto !== undefined ? invFormPhoto : (existing ? existing.image_url : null);
  try{
    if(invEditingId){
      const { error } = await sb.rpc('inventory_update_item', { p_id: invEditingId, p_name: name, p_description: description, p_image_url: imageUrl, p_weight: weight, p_quantity: quantity, p_container_id: containerId, p_receptacle_id: receptacleId });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('inventory_create_item', { p_name: name, p_description: description, p_image_url: imageUrl, p_weight: weight, p_quantity: quantity, p_container_id: containerId, p_receptacle_id: receptacleId, p_created_by: myRole() });

    invView = 'list';

    console.error('Falha ao salvar item', e);
    showToast((e.message && e.message.includes('capacidade')) ? e.message : 'Não consegui salvar. Tenta de novo.');
  }
}

/* ============================================================
   CODEX — espaço do jogador pra organizar memórias/personagens/
   anotações em pastas. Mestre só lê (mesmo padrão "soft" do
   diário: a UI dele simplesmente não mostra controle de editar).
   ============================================================ */
let codexOpen = false;
let codexFolders = [];
let codexEntries = [];
let codexChannel = null;
let codexView = 'grid'; // 'grid' | 'folderForm' | 'entryForm'
let codexCurrentFolder = null;
let codexEditingId = null;
let codexFormPhoto = undefined;
let codexFormDraft = null; // {title, description} — preserva o formulário quando um upload de foto força um re-render

function syncEntryFormDraft(){
  const $ = sel => document.querySelector(sel);
  if(!$('#mEntryTitle')) return;
  codexFormDraft = { title: $('#mEntryTitle').value, description: $('#mEntryDescription').value };
}

async function openCodex(){
  codexOpen = true;
  codexView = 'grid';
  codexCurrentFolder = null;
  codexEditingId = null;
  const overlay = document.getElementById('codexOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando codex…</div>`;
  render();
  try{
    await loadCodexData();
    renderCodexOverlay();
    subscribeCodexRealtime();
  } catch(e){
    console.error('Falha ao abrir o codex', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o codex agora.</div>`;
  }
}

function closeCodex(){
  codexOpen = false;
  codexView = 'grid';
  codexEditingId = null;
  const overlay = document.getElementById('codexOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  render();
}

async function loadCodexData(){
  const [{ data: folders, error: e1 }, { data: entries, error: e2 }] = await Promise.all([
    sb.from('codex_folders').select('*').order('created_at'),
    sb.from('codex_entries').select('*').order('created_at', { ascending: false })
  ]);
  if(e1) throw e1;
  if(e2) throw e2;
  codexFolders = folders || [];
  codexEntries = entries || [];
}

function subscribeCodexRealtime(){
  if(codexChannel) return;
  codexChannel = sb.channel('codex_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'codex_folders' }, (payload)=>{
      applyRealtimeUpsert(codexFolders, payload);
      if(codexOpen && codexView==='grid') renderCodexOverlay();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'codex_entries' }, (payload)=>{
      applyRealtimeUpsert(codexEntries, payload);
      if(codexOpen && codexView==='grid') renderCodexOverlay();
    })
    .subscribe();
}

function renderCodexOverlay(){
  const overlay = document.getElementById('codexOverlay');
  overlay.innerHTML = `
    <div class="app-shell app-theme-codex">
      ${renderAppStatusBar()}
      <div class="app-chrome-head">
        <div class="app-chrome-title">Memórias</div>
        <div class="app-chrome-close" id="codexClose">✕</div>
      </div>
      <div class="app-body"><div class="codex-wrap">${renderCodexBody()}</div></div>
      <div class="app-home-indicator"></div>
    </div>
  `;
  attachCodexHandlers();
}

function renderCodexBody(){
  if(codexView === 'folderForm') return renderFolderForm();
  if(codexView === 'entryForm') return renderEntryForm();
  return renderCodexGrid();
}

function renderCodexGrid(){
  const folder = codexCurrentFolder ? codexFolders.find(f=>f.id===codexCurrentFolder) : null;
  const subfolders = codexFolders.filter(f=> (f.parent_folder_id||null) === (codexCurrentFolder||null));
  const entriesHere = codexEntries.filter(e=> (e.folder_id||null) === (codexCurrentFolder||null));
  const canEdit = true;
  return `
    ${codexCurrentFolder ? `<div class="codex-breadcrumb" id="codexBack">← voltar</div>` : ''}
    <div class="inv-section-head">
      <div class="section-title" style="margin:0;">${folder ? folder.name : 'Início'} ${folder && canEdit ? `<span class="edit-link" id="codexEditFolder" style="margin-left:8px;">✎ editar</span>` : ''}</div>
      ${canEdit ? `
        <div style="display:flex;gap:12px;">
          <span class="add-link" id="codexAddFolder">+ pasta</span>
          <span class="add-link" id="codexAddEntry">+ lembrança</span>
        </div>
      ` : ''}
    </div>
    <div class="codex-grid">
      ${subfolders.map(f=>renderFolderTile(f)).join('')}
      ${entriesHere.map(e=>renderEntryTile(e)).join('')}
    </div>
    ${(!subfolders.length && !entriesHere.length) ? '<div class="empty-state">Nada por aqui ainda.</div>' : ''}
  `;
}

function renderFolderTile(f){
  const count = codexFolders.filter(x=>x.parent_folder_id===f.id).length + codexEntries.filter(e=>e.folder_id===f.id).length;
  return `
    <div class="codex-folder-card" data-open-folder="${f.id}">
      <div class="icon">📁</div>
      <div class="name">${f.name}</div>
      <div class="count">${count} ${count===1?'item':'itens'}</div>
    </div>
  `;
}

function renderEntryTile(e){
  return `
    <div class="codex-entry-card" data-open-entry="${e.id}">
      ${e.image_url ? `<div class="photo" style="background-image:url('${e.image_url}')"></div>` : `<div class="no-photo">🗂️</div>`}
      <div class="title">${e.title}</div>
    </div>
  `;
}

function renderFolderForm(){
  const existing = codexEditingId ? codexFolders.find(f=>f.id===codexEditingId) : null;
  return `
    <div class="diary-history-link" id="codexBackToGrid">↺ voltar</div>
    <div class="card" style="margin-top:14px;">
      <div class="field"><label>Nome da pasta</label><input id="mFolderName" value="${existing?existing.name:''}" placeholder="Ex: Aliados"></div>
      <div class="modal-actions">
        ${existing ? `<button class="btn btn-danger btn-sm" id="deleteFolderBtn">Remover</button>` : ''}
        <button class="btn btn-accent" id="saveFolderBtn">Salvar</button>
      </div>
    </div>
  `;
}

function renderEntryForm(){
  const existing = codexEditingId ? codexEntries.find(e=>e.id===codexEditingId) : null;
  const photo = codexFormPhoto !== undefined ? codexFormPhoto : (existing ? existing.image_url : null);
  const d = codexFormDraft;
  const title = d ? d.title : (existing ? existing.title : '');
  const description = d ? d.description : (existing ? existing.description||'' : '');
  return `
    <div class="diary-history-link" id="codexBackToGrid">↺ voltar</div>
    <div class="card" style="margin-top:14px;">
      <div class="field"><label>Foto (opcional)</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="inv-photo-preview" style="${photo?`background-image:url('${photo}')`:''}">${photo?'':'🗂️'}</div>
          <button class="btn btn-ghost btn-sm" type="button" id="entryPhotoBtn">${photo?'Trocar foto':'Enviar foto'}</button>
        </div>
      </div>
      <div class="field"><label>Título</label><input id="mEntryTitle" value="${title}" placeholder="Ex: Zeroh, o contato do porto"></div>
      <div class="field"><label>Descrição</label><textarea id="mEntryDescription">${description}</textarea></div>
      <div class="modal-actions">
        ${existing ? `<button class="btn btn-danger btn-sm" id="deleteEntryBtn">Remover</button>` : ''}
        <button class="btn btn-accent" id="saveEntryBtn">Salvar</button>
      </div>
    </div>
  `;
}

function attachCodexHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  $('#codexClose').onclick = closeCodex;

  if(codexView === 'grid'){
    const back = $('#codexBack');
    if(back) back.onclick = ()=>{
      const folder = codexFolders.find(f=>f.id===codexCurrentFolder);
      codexCurrentFolder = folder ? (folder.parent_folder_id || null) : null;
      renderCodexOverlay();
    };
    const addFolder = $('#codexAddFolder');
    if(addFolder) addFolder.onclick = ()=>{ codexView='folderForm'; codexEditingId=null; renderCodexOverlay(); };
    const addEntry = $('#codexAddEntry');
    if(addEntry) addEntry.onclick = ()=>{ codexView='entryForm'; codexEditingId=null; codexFormPhoto=undefined; codexFormDraft=null; renderCodexOverlay(); };
    const editFolder = $('#codexEditFolder');
    if(editFolder) editFolder.onclick = ()=>{ codexView='folderForm'; codexEditingId=codexCurrentFolder; renderCodexOverlay(); };
    $$('[data-open-folder]').forEach(el=>{
      el.onclick = ()=>{ codexCurrentFolder = el.dataset.openFolder; renderCodexOverlay(); };
    });
    $$('[data-open-entry]').forEach(el=>{
      el.onclick = ()=>{ codexView='entryForm'; codexEditingId=el.dataset.openEntry; codexFormPhoto=undefined; codexFormDraft=null; renderCodexOverlay(); };
    });
  }

  if(codexView === 'folderForm'){
    $('#codexBackToGrid').onclick = ()=>{ codexView='grid'; renderCodexOverlay(); };
    $('#saveFolderBtn').onclick = saveFolder;
    const del = $('#deleteFolderBtn');
    if(del) del.onclick = ()=> deleteFolder(codexEditingId);
  }

  if(codexView === 'entryForm'){
    $('#codexBackToGrid').onclick = ()=>{ codexView='grid'; renderCodexOverlay(); };
    $('#entryPhotoBtn').onclick = handleCodexPhotoUpload;
    $('#saveEntryBtn').onclick = saveEntry;
    const del = $('#deleteEntryBtn');
    if(del) del.onclick = ()=> deleteEntry(codexEditingId);
  }
}

async function saveFolder(){
  const name = document.getElementById('mFolderName').value.trim();
  if(!name){ showToast('Digita um nome pra pasta.'); return; }
  try{
    if(codexEditingId){
      const { error } = await sb.rpc('codex_rename_folder', { p_id: codexEditingId, p_name: name });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('codex_create_folder', { p_name: name, p_parent_folder_id: codexCurrentFolder });
      if(error) throw error;
    }
    await loadCodexData();
    codexView = 'grid';
    renderCodexOverlay();
    showToast('Pasta salva.');
  } catch(e){
    console.error('Falha ao salvar pasta', e);
    showToast('Não consegui salvar. Tenta de novo.');
  }
}

async function deleteFolder(id){
  try{
    const { error } = await sb.rpc('codex_delete_folder', { p_id: id });
    if(error) throw error;
    await loadCodexData();
    codexView = 'grid';
    codexCurrentFolder = null;
    renderCodexOverlay();
    showToast('Pasta removida.');
  } catch(e){
    console.error('Falha ao remover pasta', e);
    showToast('Não consegui remover. Tenta de novo.');
  }
}

async function saveEntry(){
  const title = document.getElementById('mEntryTitle').value.trim();
  if(!title){ showToast('Digita um título.'); return; }
  const description = document.getElementById('mEntryDescription').value.trim();
  const existing = codexEditingId ? codexEntries.find(e=>e.id===codexEditingId) : null;
  const imageUrl = codexFormPhoto !== undefined ? codexFormPhoto : (existing ? existing.image_url : null);
  try{
    if(codexEditingId){
      const { error } = await sb.rpc('codex_update_entry', { p_id: codexEditingId, p_folder_id: codexCurrentFolder, p_title: title, p_description: description, p_image_url: imageUrl });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('codex_create_entry', { p_folder_id: codexCurrentFolder, p_title: title, p_description: description, p_image_url: imageUrl });
      if(error) throw error;
    }
    await loadCodexData();
    codexView = 'grid';
    renderCodexOverlay();
    showToast('Salvo no codex.');
  } catch(e){
    console.error('Falha ao salvar no codex', e);
    showToast('Não consegui salvar. Tenta de novo.');
  }
}

async function deleteEntry(id){
  try{
    const { error } = await sb.rpc('codex_delete_entry', { p_id: id });
    if(error) throw error;
    await loadCodexData();
    codexView = 'grid';
    renderCodexOverlay();
    showToast('Removido do codex.');
  } catch(e){
    console.error('Falha ao remover', e);
    showToast('Não consegui remover. Tenta de novo.');
  }
}

function handleCodexPhotoUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    try{
      const { error } = await sb.storage.from('game-images').upload(path, file);
      if(error) throw error;
      const { data } = sb.storage.from('game-images').getPublicUrl(path);
      syncEntryFormDraft();
      codexFormPhoto = data.publicUrl;
      renderCodexOverlay();
    } catch(e){
      console.error('Falha ao enviar foto', e);
      showToast('Não consegui enviar a foto. Tenta de novo.');
    }
  };
  input.click();
}

   INIT

/* ============================================================
   ZOOM (Ctrl + scroll) — só ativo no app desktop
   ============================================================ */
if(window.electronAPI){
  let zoomLevel = 1;
  window.addEventListener('wheel', (e)=>{
    if(!e.ctrlKey) return;
    e.preventDefault();
    zoomLevel += (e.deltaY < 0 ? 0.07 : -0.07);
    zoomLevel = Math.min(2.2, Math.max(0.6, zoomLevel));
    document.body.style.zoom = zoomLevel;
  }, { passive:false });
}

document.getElementById('diaryTrigger').onclick = openDiary;

if(masterToken){
  // já tem um token salvo de uma sessão de mestre anterior — tenta usar direto
  isMaster = true;
  loadState();
} else {
  render(); // mostra a tela de escolha mestre/jogador
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SUBROSA // Hub</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07050f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subrosa">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07050f;
    --panel:#120c1a;
    --panel-2:#1a1126;
    --border:#2a1a38;
    --border-soft:#1d1229;
    --text:#f3e9f7;
    --dim:#a590b3;
    --faint:#5d4a6e;
    --rose:#ff5c9a;
    --violet:#9b6bff;
    --ease-out:cubic-bezier(.2,.8,.2,1);
    --ease-spring:cubic-bezier(.34,1.45,.5,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);}
  body{
    min-height:100vh;min-height:100dvh;
    background:
      repeating-linear-gradient(0deg, rgba(155,107,255,0.045) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, rgba(155,107,255,0.045) 0 1px, transparent 1px 42px),
      radial-gradient(ellipse 900px 520px at 15% -10%, rgba(255,92,154,0.15), transparent 60%),
      radial-gradient(ellipse 700px 520px at 100% 0%, rgba(155,107,255,0.13), transparent 60%),
      var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  /* brilho que respira atrás do logo */
  .halo{
    position:fixed;left:50%;top:-120px;width:560px;height:560px;margin-left:-280px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,92,154,0.22), rgba(155,107,255,0.08) 45%, transparent 70%);
    animation:halo 9s ease-in-out infinite alternate;
  }
  @keyframes halo{from{transform:translateY(0) scale(1);opacity:.75;}to{transform:translateY(28px) scale(1.12);opacity:1;}}

  .hub{
    position:relative;max-width:560px;margin:0 auto;
    padding:calc(34px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
    transform-origin:50% 50%;
  }

  /* ---------- CABEÇALHO ---------- */
  .hub-head{text-align:center;margin-bottom:34px;}
  .logo{
    width:86px;height:86px;margin:0 auto 14px;border-radius:26px;position:relative;
    background:radial-gradient(circle at 50% 42%, #2a0f2e, #0c0813 75%);
    border:1px solid rgba(255,92,154,0.28);
    box-shadow:0 0 34px rgba(255,92,154,0.25), inset 0 0 22px rgba(155,107,255,0.12);
    display:flex;align-items:center;justify-content:center;
    animation:logoIn .7s var(--ease-spring) both;
  }
  .logo svg{width:62px;height:62px;filter:drop-shadow(0 0 7px rgba(255,92,154,0.55));}
  @keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-14deg);}to{opacity:1;transform:none;}}
  .hub-head h1{
    margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:30px;letter-spacing:9px;padding-left:9px;
    background:linear-gradient(100deg,var(--rose),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rise .6s .08s var(--ease-out) both;
  }
  .hub-head p{
    margin:8px 0 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--dim);
    animation:rise .6s .16s var(--ease-out) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* ---------- SEÇÕES ---------- */
  .sec{margin-bottom:30px;}
  .sec-head{
    display:flex;align-items:center;gap:10px;margin:0 4px 12px;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim);
    animation:rise .5s var(--ease-out) both;
  }
  .sec-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
  .sec-count{color:var(--faint);}

  /* ---------- CARTÃO DE PROJETO ---------- */
  .proj{
    --accent:var(--rose);
    position:relative;display:flex;align-items:center;gap:15px;padding:16px;margin-bottom:12px;
    text-decoration:none;color:inherit;border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid color-mix(in srgb, var(--accent) 32%, var(--border));
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    animation:rise .55s var(--ease-out) both;
    transition:transform .25s var(--ease-out), border-color .25s ease, box-shadow .25s ease, opacity .25s ease, filter .25s ease;
  }
  .proj::before{ /* brilho da cor do projeto no canto */
    content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%);
    transition:opacity .3s ease, transform .4s var(--ease-out);opacity:.7;
  }
  @media (hover:hover){
    .proj:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 16px 38px rgba(0,0,0,0.45),0 0 26px color-mix(in srgb, var(--accent) 28%, transparent);}
    .proj:hover::before{opacity:1;transform:scale(1.25);}
    .proj:hover .proj-go{transform:translateX(4px);color:var(--accent);}
  }
  .proj:active{transform:scale(.975);}
  .proj-icon{
    position:relative;width:68px;height:68px;border-radius:18px;flex-shrink:0;object-fit:cover;
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 6px 20px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .proj-body{position:relative;flex:1;min-width:0;}
  .proj-name{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:21px;letter-spacing:.6px;}
  .proj-tag{margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--dim);}
  .proj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .proj-chips span{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;color:var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .proj-go{position:relative;flex-shrink:0;color:var(--faint);transition:transform .25s var(--ease-out), color .25s ease;}
  .proj-go svg{width:20px;height:20px;display:block;}

  /* abrindo um projeto: o cartão cresce e o resto apaga */
  body.leaving .proj:not(.opening){opacity:.25;filter:blur(2px);transform:scale(.97);}
  .proj.opening{transform:scale(1.04);border-color:var(--accent);box-shadow:0 0 50px color-mix(in srgb, var(--accent) 55%, transparent);}
  body.leaving .hub{animation:leave .3s ease-in forwards;animation-delay:.05s;}
  @keyframes leave{to{opacity:0;transform:scale(1.03);}}

  /* ---------- VAZIO ---------- */
  .empty{
    display:flex;align-items:center;gap:13px;padding:16px;border-radius:20px;
    border:1.5px dashed var(--border);color:var(--faint);
    animation:rise .55s var(--ease-out) both;
  }
  .empty-plus{
    width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border:1.5px dashed var(--border);font-size:22px;font-weight:300;
  }
  .empty-title{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;color:var(--dim);}
  .empty-sub{font-size:12px;margin-top:2px;}

  .foot{
    text-align:center;margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.6px;color:var(--faint);
    animation:rise .6s .4s var(--ease-out) both;
  }
  .foot em{font-style:normal;color:var(--dim);}

  /* ---------- LIGANDO (volta do Levina pelo botão de desligar) ---------- */
  .hub.power-on{animation:crtOn .7s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes crtOn{
    0%{transform:scale(0,.012);filter:brightness(5);opacity:0;}
    18%{transform:scale(.04,.012);filter:brightness(5);opacity:1;}
    46%{transform:scale(1,.014);filter:brightness(3);opacity:1;}
    100%{transform:scale(1,1);filter:brightness(1);opacity:1;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="halo"></div>
<main class="hub" id="hub">
  <header class="hub-head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="url(#roseGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c9a"/><stop offset="1" stop-color="#9b6bff"/></linearGradient></defs>
        <path d="M50 50 C 34 45, 27 20, 50 7 C 73 20, 66 45, 50 50 Z"/>
        <path d="M50 50 C 34 45, 27 20, 50 7 C 73 20, 66 45, 50 50 Z" transform="rotate(72 50 50)"/>
        <path d="M50 50 C 34 45, 27 20, 50 7 C 73 20, 66 45, 50 50 Z" transform="rotate(144 50 50)"/>
        <path d="M50 50 C 34 45, 27 20, 50 7 C 73 20, 66 45, 50 50 Z" transform="rotate(216 50 50)"/>
        <path d="M50 50 C 34 45, 27 20, 50 7 C 73 20, 66 45, 50 50 Z" transform="rotate(288 50 50)"/>
        <path stroke="#ffd1e3" stroke-width="3.6" d="M50.7 50.3 L51.0 50.6 L51.1 51.0 L51.1 51.4 L51.0 51.9 L50.8 52.4 L50.4 52.8 L49.9 53.2 L49.3 53.5 L48.6 53.6 L47.9 53.6 L47.1 53.5 L46.3 53.1 L45.5 52.6 L44.8 52.0 L44.2 51.1 L43.8 50.1 L43.5 49.0 L43.4 47.8 L43.6 46.6 L44.0 45.3 L44.6 44.1 L45.5 43.0 L46.6 42.1 L47.9 41.3 L49.4 40.7 L51.0 40.4 L52.7 40.4 L54.5 40.7 L56.2 41.3 L57.8 42.2 L59.3 43.5 L60.6 45.0 L61.6 46.8 L62.3 48.7 L62.7 50.8 L62.7 53.1 L62.3 55.3 L61.5 57.5 L60.3 59.6 L58.8 61.4 L56.9 63.0 L54.7 64.3 L52.2 65.3 L49.6 65.8 L46.9 65.8 L44.1 65.4 L41.4 64.4 L38.9 63.0 L36.6 61.2 L34.6 58.9 L33.0 56.3 L31.8 53.4 L31.2 50.3 L31.1 47.0 L31.5 43.8 L32.5 40.6 L34.1 37.5 L36.2 34.8 L38.8 32.4 L41.8 30.4 L45.2 29.0 L48.8 28.2 L52.5 27.9 L56.3 28.3 L60.1 29.4 L63.6 31.1 L66.8 33.5 L69.7 36.4 L72.0 39.7 L73.7 43.5"/>
      </svg>
    </div>
    <h1>SUBROSA</h1>
    <p>RPGs · apps · ferramentas</p>
  </header>

  <div id="sections"></div>

  <div class="foot"><em>sub rosa</em> — sob a rosa</div>
</main>

<script src="projects.js"></script>
<script>
(function(){
  const SECTIONS = [
    { kind:'rpg', title:'RPGs',        empty:'Nenhum RPG aqui ainda' },
    { kind:'app', title:'Aplicativos', empty:'Nenhum aplicativo ainda' }
  ];
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg>';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const projects = window.SUBROSA_PROJECTS || [];
  let n = 0; // atraso escalonado da animação de entrada
  const delay = () => `animation-delay:${(0.22 + (n++) * 0.07).toFixed(2)}s`;

  document.getElementById('sections').innerHTML = SECTIONS.map(sec => {
    const list = projects.filter(p => p.kind === sec.kind);
    const cards = list.map(p => `
      <a class="proj" href="${esc(p.path)}" data-name="${esc(p.name)}" style="--accent:${esc(p.accent || '#ff5c9a')};${delay()}">
        <img class="proj-icon" src="${esc(p.icon)}" alt="" draggable="false">
        <div class="proj-body">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-tag">${esc(p.tagline)}</div>
          ${p.tags && p.tags.length ? `<div class="proj-chips">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="proj-go">${ARROW}</div>
      </a>`).join('');
    const empty = list.length ? '' : `
      <div class="empty" style="${delay()}">
        <div class="empty-plus">+</div>
        <div><div class="empty-title">${esc(sec.empty)}</div><div class="empty-sub">Em breve</div></div>
      </div>`;
    return `
      <section class="sec">
        <div class="sec-head" style="${delay()}">${esc(sec.title)}<span class="sec-count">${String(list.length).padStart(2,'0')}</span></div>
        ${cards}${empty}
      </section>`;
  }).join('');

  // abrir um projeto: o cartão cresce, o resto apaga, e então navega
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('sections').addEventListener('click', (e)=>{
    const a = e.target.closest('a.proj');
    if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    if(reduce) return;
    e.preventDefault();
    a.classList.add('opening');
    document.body.classList.add('leaving');
    setTimeout(()=>{ location.href = a.getAttribute('href'); }, 280);
  });
  // voltar pelo navegador (cache de página) não pode deixar o hub apagado
  window.addEventListener('pageshow', (e)=>{
    if(e.persisted){
      document.body.classList.remove('leaving');
      document.querySelectorAll('.proj.opening').forEach(el => el.classList.remove('opening'));
    }
  });

  // veio do botão de desligar de um projeto: toca a animação de "ligar"
  try{
    if(sessionStorage.getItem('subrosa-hub-poweron') === '1'){
      sessionStorage.removeItem('subrosa-hub-poweron');
      if(!reduce) document.getElementById('hub').classList.add('power-on');
    }
  } catch(err){}
})();
</script>
<script>window.SUBROSA_PWA = { id:'hub', title:'o Subrosa', swPath:'sw.js', icon:'icons/icon-192.png' };</script>
<script src="shared/pwa.js"></script>
</body>
</html>

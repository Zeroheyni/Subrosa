<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBROSA // Painel do Império</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='0' y='0' width='24' height='24' rx='6' fill='%23050912'/%3E%3Cg fill='none' stroke='%2300d4ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 9 L7 3 L9.3 8.2'/%3E%3Cpath d='M20 9 L17 3 L14.7 8.2'/%3E%3Cpath d='M4 9 C4 15.2 8 19 12 19 C16 19 20 15.2 20 9 C20 9 16.8 10.6 12 10.6 C7.2 10.6 4 9 4 9 Z'/%3E%3Ccircle cx='9.2' cy='13.2' r='0.9' fill='%2300d4ff' stroke='none'/%3E%3Ccircle cx='14.8' cy='13.2' r='0.9' fill='%2300d4ff' stroke='none'/%3E%3Cpath d='M10.4 15.4 Q12 16.5 13.6 15.4'/%3E%3C/g%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050912;
    --bg-panel:#0a1220;
    --bg-panel-2:#0e1a2e;
    --bg-panel-3:#122139;
    --border:#1c3350;
    --border-soft:#142538;
    --text:#e7eefc;
    --text-dim:#8996b3;
    --text-faint:#4c5a78;

    --clean-1:#00d4ff;
    --clean-2:#2f6bff;
    --clean-glow:rgba(0,212,255,0.35);

    --dirty-1:#ff1f4b;
    --dirty-2:#ff5233;
    --dirty-glow:rgba(255,31,75,0.4);

    --warn:#ffb020;
    --danger:#ff4d4d;

    --accent-1:var(--clean-1);
    --accent-2:var(--clean-2);
    --accent-glow:var(--clean-glow);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(47,107,255,0.05) 0px, rgba(47,107,255,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(47,107,255,0.05) 0px, rgba(47,107,255,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,212,255,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(47,107,255,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    transition:background 0.6s ease;
  }
  body.mode-sujo{
    --bg:#020202;
    --bg-panel:#0a0505;
    --bg-panel-2:#120707;
    --bg-panel-3:#1a0909;
    --border:#3a1015;
    --border-soft:#260c0f;
    --accent-1:var(--dirty-1);
    --accent-2:var(--dirty-2);
    --accent-glow:var(--dirty-glow);
    background:
      repeating-linear-gradient(0deg, rgba(255,31,75,0.05) 0px, rgba(255,31,75,0.05) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(255,31,75,0.05) 0px, rgba(255,31,75,0.05) 1px, transparent 1px, transparent 42px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,31,75,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,31,75,0.08), transparent 60%),
      var(--bg);
  }

  #root{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .login-screen{
    flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    width:100%;max-width:360px;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);border-radius:18px;padding:28px 24px;
  }
  .login-title{
    font-family:'Chakra Petch',sans-serif;font-size:17px;font-weight:700;
    text-align:center;margin-bottom:6px;
  }
  .login-error{
    color:var(--danger);font-size:12px;text-align:center;margin:-6px 0 12px;
  }

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ---------- HEADER ---------- */
  .topbar{
    padding:18px 16px 12px;
    display:flex;flex-direction:column;gap:14px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;}
  .brand{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:1px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-1);
    box-shadow:0 0 8px var(--accent-glow), 0 0 16px var(--accent-glow);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .brand-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

  .role-badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;
    padding:7px 11px;border-radius:10px;
    background:var(--bg-panel);border:1px solid var(--border-soft);color:var(--text-faint);
    cursor:default;user-select:none;
  }
  .role-badge.is-master{
    color:var(--accent-1);border-color:var(--accent-1);
    background:color-mix(in srgb, var(--accent-1) 12%, var(--bg-panel));
    box-shadow:0 0 10px var(--accent-glow);
    cursor:pointer;
  }

  .mode-cat-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
    transition:border-color .3s ease, background .3s ease;
  }
  .mode-cat-btn:hover{border-color:var(--accent-1);background:var(--bg-panel-2);}
  .mode-cat-btn svg{
    width:19px;height:19px;color:var(--accent-1);
    filter:drop-shadow(0 0 3px var(--accent-glow));
    transition:color .4s ease, filter .4s ease;
  }
  .mode-cat-btn.glitching svg{animation:catGlitch .5s ease;}
  @keyframes catGlitch{
    0%{transform:scale(1) rotate(0);}
    20%{transform:scale(1.18) rotate(-5deg);filter:drop-shadow(0 0 9px var(--accent-glow));}
    45%{transform:scale(0.88) rotate(4deg);}
    65%{transform:scale(1.1) rotate(-2deg);}
    100%{transform:scale(1) rotate(0);}
  }

  .day-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 14px;
  }
  .day-info{display:flex;flex-direction:column;gap:2px;}
  .day-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
  .day-value{font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:700;}
  .day-actions{display:flex;gap:8px;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg-panel-2);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;
    transition:all .2s ease;
  }
  .icon-btn:hover{border-color:var(--accent-1);color:var(--accent-1);}
  .icon-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .icon-btn.primary{
    width:auto;height:auto;
    padding:9px 14px;
    gap:7px;
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    color:#04140f;border:none;font-weight:700;font-size:12.5px;font-family:'JetBrains Mono',monospace;
    letter-spacing:0.3px;
    box-shadow:0 4px 14px var(--accent-glow);
  }
  .icon-btn.primary:hover{color:#04140f;filter:brightness(1.08);}

  /* ---------- NAV ---------- */
  .tabbar{
    display:flex;
    gap:6px;
    padding:0 16px 10px;
  }
  .tab-btn{
    flex:1;
    padding:10px 8px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg-panel);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    text-align:center;
    transition:all .2s ease;
  }
  .tab-btn.active{
    color:var(--bg);
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    border-color:transparent;
    box-shadow:0 4px 16px var(--accent-glow);
  }

  main{flex:1;padding:4px 16px 100px;display:flex;flex-direction:column;gap:14px;}

  /* ---------- CARDS ---------- */
  .card{
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
    opacity:0.5;
  }
  .card-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint);
    margin-bottom:6px;
  }
  .card-label-row{display:flex;align-items:center;justify-content:space-between;}
  .card-label-row .card-label{margin-bottom:0;}
  .edit-link{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent-1);cursor:pointer;font-weight:600;
  }

  .chart-wrap{padding-top:2px;}
  .chart-bars{display:flex;align-items:flex-end;gap:4px;height:90px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
  .chart-bar{width:100%;border-radius:3px;min-height:2px;}
  .chart-zero{position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border);}
  .chart-legend{display:flex;justify-content:space-between;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);flex-wrap:wrap;gap:6px 14px;}
  .networth-svg{width:100%;height:90px;display:block;}
  .chart-legend .item{display:flex;align-items:center;gap:5px;}
  .chart-legend .sw{width:8px;height:8px;border-radius:2px;}
  .balance-hero{font-family:'Chakra Petch',sans-serif;font-size:38px;font-weight:700;letter-spacing:0.5px;}
  .balance-hero small{font-size:16px;color:var(--text-dim);font-weight:500;}
  .balance-sub{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:3px;}
  .stat-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace;}
  .stat-value{font-size:15px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .stat-value.pos{color:var(--clean-1);}
  .stat-value.neg{color:var(--danger);}

  .section-title{
    font-family:'Chakra Petch',sans-serif;
    font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;
    margin:4px 2px 0;
  }
  .section-title .add-link{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);cursor:pointer;font-weight:600;
  }

  .list-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .l-name{color:var(--text);}
  .list-row .l-sub{color:var(--text-faint);font-size:11px;margin-top:2px;}
  .list-row .l-amount{font-family:'JetBrains Mono',monospace;font-weight:600;}

  .txn-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .txn-row:last-child{border-bottom:none;}
  .txn-day{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);
    background:var(--bg-panel-3);border-radius:6px;padding:2px 6px;margin-right:10px;flex-shrink:0;
  }
  .txn-label{flex:1;font-size:12.5px;color:var(--text-dim);}
  .txn-amount{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;white-space:nowrap;}

  .empty-state{
    text-align:center;padding:26px 10px;color:var(--text-faint);font-size:12.5px;
    border:1px dashed var(--border);border-radius:12px;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    border:1px solid var(--border);
    background:var(--bg-panel-3);
    color:var(--text);
    padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s ease;font-family:'Inter',sans-serif;
  }
  .btn:hover{border-color:var(--accent-1);}
  .btn-accent{
    background:linear-gradient(120deg,var(--accent-1),var(--accent-2));
    color:#04140f;border:none;
  }
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px;font-size:11px;border-radius:8px;}

  /* ---------- SUBTABS ---------- */
  .subtabs{display:flex;gap:6px;margin-bottom:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtab{
    padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:600;flex-shrink:0;white-space:nowrap;
    border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  .subtab.active{border-color:var(--accent-1);color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}

  /* ---------- BUSINESS / PROPERTY CARD ---------- */
  .entity-card{
    background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;
    transition:all .2s ease;
  }
  .entity-card:hover{border-color:var(--accent-1);}
  .entity-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entity-name{font-weight:700;font-size:14px;}
  .entity-tag{
    font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;
    padding:3px 7px;border-radius:6px;color:var(--text-faint);border:1px solid var(--border);white-space:nowrap;
  }
  .entity-tag.developing{color:var(--warn);border-color:var(--warn);}
  .entity-tag.mature{color:var(--clean-1);border-color:var(--clean-1);}
  .entity-income{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;margin-top:8px;}
  .progress-track{height:6px;background:var(--bg-panel-3);border-radius:99px;margin-top:8px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--clean-1),var(--clean-2));transition:width .4s ease;}
  .entity-meta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .entity-meta .m{font-size:10.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  .heat-track{height:8px;background:var(--bg-panel-3);border-radius:99px;margin-top:10px;overflow:hidden;position:relative;}
  .heat-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .heat-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);margin-top:4px;font-family:'JetBrains Mono',monospace;}

  .badge-event{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:600;
    padding:5px 9px;border-radius:8px;margin-top:10px;
  }
  .badge-event.buff{color:var(--clean-1);background:rgba(0,230,168,0.1);}
  .badge-event.debuff{color:var(--danger);background:rgba(255,77,77,0.1);}

  /* ---------- CALENDAR ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px;}
  .cal-nav-label{flex:1;text-align:center;}
  .cal-month{font-family:'Chakra Petch',sans-serif;font-size:16px;font-weight:700;}
  .cal-year{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);letter-spacing:1px;}
  .cal-today-link{
    text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-1);
    cursor:pointer;margin:-4px 0 4px;
  }
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-day-cell{
    aspect-ratio:1;border-radius:9px;background:var(--bg-panel-2);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    font-family:'JetBrains Mono',monospace;transition:all .15s ease;
  }
  .month-day-cell:hover{border-color:var(--accent-1);}
  .month-day-cell.today{border-color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 10%, var(--bg-panel-2));box-shadow:0 0 10px var(--accent-glow);}
  .month-day-cell .n{font-size:13px;font-weight:600;}
  .month-day-cell .dot{width:4px;height:4px;border-radius:50%;background:var(--warn);margin-top:3px;}

  .event-card{background:var(--bg-panel-2);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .event-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .event-title{font-weight:700;font-size:13.5px;}
  .event-day{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-1);}
  .event-desc{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
  .event-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .event-tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-faint);}

  /* ---------- NOTIFICATIONS ---------- */
  .notif{
    display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft);
  }
  .notif:last-child{border-bottom:none;}
  .notif-icon{font-size:15px;flex-shrink:0;}
  .notif-body{flex:1;}
  .notif-text{font-size:12px;color:var(--text-dim);line-height:1.4;}
  .notif-day{font-size:9.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,5,9,0.75);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:20px 18px 28px;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg-panel-3);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .seg-group{display:flex;gap:6px;}
  .seg-opt{
    flex:1;text-align:center;padding:9px 6px;border-radius:9px;border:1px solid var(--border);
    font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text-dim);font-family:'JetBrains Mono',monospace;
  }
  .seg-opt.active{border-color:var(--accent-1);color:var(--accent-1);background:color-mix(in srgb, var(--accent-1) 12%, transparent);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--bg-panel-3);border:1px solid var(--accent-1);color:var(--text);
    padding:11px 18px;border-radius:12px;font-size:12.5px;z-index:200;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .hint{font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:2px;}

  /* ---------- TRANSIÇÃO DE MODO (glitch cyberpunk) ---------- */
  #modeFlash{
    position:fixed;inset:0;pointer-events:none;z-index:500;opacity:0;
    mix-blend-mode:screen;
  }
  #modeFlash::before, #modeFlash::after{
    content:'';position:absolute;inset:0;opacity:0;mix-blend-mode:screen;
  }
  #modeFlash::before{
    background:repeating-linear-gradient(0deg, var(--flash-color, var(--accent-1)) 0px, var(--flash-color, var(--accent-1)) 2px, transparent 2px, transparent 7px);
  }
  #modeFlash::after{
    background:repeating-linear-gradient(0deg, rgba(255,25,90,0.55) 0px, rgba(255,25,90,0.55) 2px, transparent 2px, transparent 8px);
  }
  #modeFlash.active{ background:rgba(255,255,255,0.02); animation:glitchBase .5s steps(1,end); }
  #modeFlash.active::before{ animation:glitchStripeA .5s steps(1,end); }
  #modeFlash.active::after{ animation:glitchStripeB .5s steps(1,end); }
  @keyframes glitchBase{
    0%{opacity:0;} 4%{opacity:.5;} 9%{opacity:.05;} 15%{opacity:.4;} 22%{opacity:0;}
    30%{opacity:.3;} 38%{opacity:.05;} 50%{opacity:.2;} 65%{opacity:.03;} 100%{opacity:0;}
  }
  @keyframes glitchStripeA{
    0%{opacity:0;transform:translateX(0);}
    6%{opacity:.6;transform:translateX(-16px);}
    13%{opacity:.15;transform:translateX(9px);}
    20%{opacity:.5;transform:translateX(-11px);}
    28%{opacity:.1;transform:translateX(5px);}
    38%{opacity:.4;transform:translateX(-4px);}
    50%{opacity:.1;transform:translateX(2px);}
    65%{opacity:.2;transform:translateX(0);}
    100%{opacity:0;transform:translateX(0);}
  }
  @keyframes glitchStripeB{
    0%{opacity:0;transform:translateX(0);}
    8%{opacity:.5;transform:translateX(13px);}
    16%{opacity:.1;transform:translateX(-10px);}
    24%{opacity:.45;transform:translateX(8px);}
    34%{opacity:.08;transform:translateX(-5px);}
    46%{opacity:.3;transform:translateX(3px);}
    60%{opacity:.08;transform:translateX(0);}
    100%{opacity:0;transform:translateX(0);}
  }

  #root.mode-glitch{animation:rootGlitch .5s steps(2,end);}
  @keyframes rootGlitch{
    0%{transform:translate(0,0) skewX(0);filter:none;}
    8%{transform:translate(-5px,1px) skewX(1.5deg);filter:hue-rotate(25deg) saturate(1.6);}
    16%{transform:translate(4px,-2px) skewX(-2deg);filter:none;}
    24%{transform:translate(-3px,0) skewX(1deg);filter:contrast(1.3) saturate(1.8);}
    33%{transform:translate(4px,2px) skewX(-1deg);filter:none;}
    42%{transform:translate(-4px,-1px);filter:hue-rotate(-20deg);}
    52%{transform:translate(2px,1px);filter:none;}
    63%{transform:translate(-2px,0);filter:none;}
    75%{transform:translate(1px,-1px);filter:none;}
    100%{transform:translate(0,0) skewX(0);filter:none;}
  }

  /* ---------- TRANSIÇÃO SUAVE ENTRE ABAS ---------- */
  main{animation:viewIn .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes viewIn{

const MASTER_TOKEN_KEY = 'subrosa-master-token';

   CALENDÁRIO FICTÍCIO
   ============================================================ */
const START_YEAR = 3430;
const MONTH_NAMES = ['Nivar','Ferrai','Marcelle','Abrenn','Maelis','Junara','Solvinn','Augrist','Setrune','Octaven','Novembrys','Decarion'];
const MONTH_LENGTHS = [31,28,31,30,31,30,31,31,30,31,30,31];
const YEAR_LENGTH = MONTH_LENGTHS.reduce((s,n)=>s+n,0); // 365

// dia absoluto (state.day, começa em 1) -> {year, month(0-11), dayOfMonth(1-N)}
function dayToDate(dayNum){
  let remaining = dayNum - 1;
  let year = START_YEAR;
  while(remaining >= YEAR_LENGTH){ remaining -= YEAR_LENGTH; year++; }
  let month = 0;
  while(remaining >= MONTH_LENGTHS[month]){ remaining -= MONTH_LENGTHS[month]; month++; }
  return { year, month, dayOfMonth: remaining + 1 };
}

// primeiro dia absoluto de um determinado mês/ano
function firstDayNumberOfMonth(year, month){
  let total = (year - START_YEAR) * YEAR_LENGTH;
  for(let m=0; m<month; m++) total += MONTH_LENGTHS[m];
  return total + 1;
}

function formatDate(dayNum){
  const { year, month, dayOfMonth } = dayToDate(dayNum);
  return `${dayOfMonth} de ${MONTH_NAMES[month]} de ${year}`;
}

function formatDateShort(dayNum){
  const { year, month, dayOfMonth } = dayToDate(dayNum);
  return `${dayOfMonth} ${MONTH_NAMES[month].slice(0,3)} ${year}`;
}

function ensureStateDefaults(s){
  if(!s.researches) s.researches = [];
  if(!s.characters) s.characters = [];
  if(s.playerCarryCapacity == null) s.playerCarryCapacity = 50;
  return s;

async function loadState(){
  try{
    const { data, error } = await sb.from('game_state').select('data').eq('id', 1).single();
    if(error) throw error;
    state = ensureStateDefaults(data.data || defaultState());
  } catch(e){
    console.error('Falha ao carregar estado do Supabase', e);
    state = defaultState();
  }
  render();
  subscribeRealtime();
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb
    .channel('game_state_changes')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' },
      (payload)=>{
        state = ensureStateDefaults(payload.new.data);
        render();
      }
    )
    .subscribe();
}

let saveTimer = null;
let isSaving = false;
let pendingSave = false;
let saveErrorShown = false;

// Só o mestre grava o estado inteiro; o jogador nunca chama isso
// diretamente (as ações dele passam por funções próprias e restritas).
function saveState(){
  if(!isMaster) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> flushSave(), 350);
}

async function flushSave(attempt = 1){
  if(!isMaster) return;
  if(isSaving){
    pendingSave = true;
    return;
  }
  isSaving = true;
  try{
    const { error } = await sb.rpc('master_update_state', { token: masterToken, new_data: state });
    if(error) throw error;
    saveErrorShown = false;
  } catch(e){
    console.error('Falha ao salvar', e);
    if(isMasterSessionExpiredError(e?.message)){
      isSaving = false;
      handleExpiredMasterSession();
      return;
    }
    if(attempt < 3){
      setTimeout(()=> { isSaving = false; flushSave(attempt+1); }, 800 * attempt);
      return;
    }
    if(!saveErrorShown){
      saveErrorShown = true;
      showToast('Não consegui salvar agora. Tentando de novo em segundo plano.');
      setTimeout(()=> flushSave(1), 5000);
    }
  } finally {
    isSaving = false;
    if(pendingSave){
      pendingSave = false;
      flushSave();
    }
  }
}

const CURRENCY_SYMBOL = 'Ⓢ';
function fmt(n){
  const v = Math.round(n);
  return (v<0?'-':'') + CURRENCY_SYMBOL + ' ' + Math.abs(v).toLocaleString('pt-BR');
}
function fmtSigned(n){
  const v = Math.round(n);
  return (v>=0?'+':'-') + CURRENCY_SYMBOL + ' ' + Math.abs(v).toLocaleString('pt-BR');
}

/* ============================================================
   MOTOR DE SIMULAÇÃO — AVANÇAR / VOLTAR DIA
   Roda no servidor (Edge Functions). O resultado chega de volta
   automaticamente pelo canal em tempo real.
   ============================================================ */
function pushNotification(icon, text){
  state.notifications.unshift({ id: uid('ntf'), day: state.day, icon, text });
  if(state.notifications.length > 60) state.notifications.pop();
}

let dayActionInFlight = false;

async function callDayFunction(fnName){
  if(!isMaster || dayActionInFlight) return;
  dayActionInFlight = true;
  render();
  try{
    const { data, error } = await sb.functions.invoke(fnName, { body: { token: masterToken } });
    if(error || (data && data.error)){
      throw new Error((data && data.error) || error.message || 'falha desconhecida');
    }
    // o estado atualizado chega pelo Realtime; não precisa fazer nada aqui
  } catch(e){
    console.error(`Falha ao chamar ${fnName}`, e);
    if(isMasterSessionExpiredError(e?.message)){
      handleExpiredMasterSession();
    } else {
      showToast('Não consegui avançar/voltar o dia agora. Tenta de novo em alguns segundos.');
    }
  } finally {
    dayActionInFlight = false;
    render();
  }
}

function advanceDay(){
  callDayFunction('advance-day');
}

function goBackDay(){
  callDayFunction('go-back-day');
}

function triggerHeatEvent(biz, tier, automatic){
  if(tier === 'investigacao'){
    pushNotification('🔎', `Investigação preliminar aberta sobre "${biz.name}" (calor ${Math.round(biz.heat)}%).`);
  } else if(tier === 'congelamento'){
    biz.frozenDaysLeft = 3 + Math.floor(Math.random()*3);
    pushNotification('🧊', `"${biz.name}" foi congelado por ${biz.frozenDaysLeft} dias após alerta financeiro.`);
  } else if(tier === 'invasao'){
    const loss = biz.illegal ? 0 : state.clean.balance * 0.15;
    biz.frozenDaysLeft = 6 + Math.floor(Math.random()*4);
    if(loss > 0){

      state.clean.transactions.push({ day: state.day, label: `Perda por invasão — ${biz.name}`, amount: -loss });
    }
    pushNotification('🚨', `Invasão em "${biz.name}"! Operação parada e perdas registradas.`);
  }
}

function toggleMode(btnEl){
  const newMode = state.mode === 'limpo' ? 'sujo' : 'limpo';
  const flash = document.getElementById('modeFlash');
  const root = document.getElementById('root');
  if(flash){
    flash.style.setProperty('--flash-color', newMode === 'sujo' ? 'var(--dirty-1)' : 'var(--clean-1)');
    flash.classList.remove('active');
    void flash.offsetWidth; // reinicia a animação
    flash.classList.add('active');
  }
  if(root){
    root.classList.remove('mode-glitch');
    void root.offsetWidth; // reinicia a animação
    root.classList.add('mode-glitch');
  }

  setTimeout(()=>{
    state.mode = newMode;
    saveState();
    render();
  }, 190);

function renderNetWorthChart(){
  const past = (state.history || []).map(h => ({
    day: h.day,
    total: (h.clean ? h.clean.balance : 0) + (h.dirty ? h.dirty.balance : 0)
  }));
  const points = [...past, { day: state.day, total: state.clean.balance + state.dirty.balance }];
  const last = points.slice(-60);
  if(last.length < 2){
    return '<div class="empty-state">Avance mais alguns dias pra ver a curva de patrimônio.</div>';
  }
  const values = last.map(p=>p.total);
  const minV = Math.min(...values, 0);
  const maxV = Math.max(...values, 1);
  const range = Math.max(1, maxV - minV);
  const W = 100, H = 100;
  const stepX = W / (last.length - 1);
  const coords = last.map((p,i)=>{
    const x = i * stepX;
    const y = H - ((p.total - minV) / range) * H;
    return [x, y];
  });
  const pathD = coords.map(([x,y],i)=> (i===0?'M':'L') + x.toFixed(2) + ',' + y.toFixed(2)).join(' ');
  const areaD = `${pathD} L${W},${H} L0,${H} Z`;
  const first = last[0].total, current = last[last.length-1].total;
  const growth = current - first;
  return `
    <div class="chart-wrap">
      <svg class="networth-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="nwGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent-1)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="var(--accent-1)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaD}" fill="url(#nwGrad)" stroke="none"></path>
        <path d="${pathD}" fill="none" stroke="var(--accent-1)" stroke-width="1.6" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div class="chart-legend">
        <div class="item">Início do período: <strong style="margin-left:4px;">${fmt(first)}</strong></div>
        <div class="item">Agora: <strong style="margin-left:4px;">${fmt(current)}</strong></div>
        <div class="item">Variação: <strong style="color:${growth>=0?'var(--clean-1)':'var(--danger)'};margin-left:4px;">${fmtSigned(growth)}</strong></div>
      </div>
    </div>
  `;
}

function renderOverviewChart(txns){
  if(!txns.length){
    return '<div class="empty-state">Sem movimentação suficiente pra montar o gráfico ainda.</div>';
  }
  // agrupa por dia (net = ganhos - perdas)
  const byDay = {};
  txns.forEach(t=>{ byDay[t.day] = (byDay[t.day]||0) + t.amount; });
  const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  const lastDays = days.slice(-14);
  const values = lastDays.map(d=>byDay[d]);
  const maxAbs = Math.max(1, ...values.map(v=>Math.abs(v)));

  const cols = lastDays.map((d,i)=>{
    const v = values[i];
    const h = Math.max(2, Math.round((Math.abs(v)/maxAbs)*42));
    const isPos = v >= 0;
    const color = isPos ? 'var(--clean-1)' : 'var(--danger)';
    const posStyle = isPos ? `bottom:50%;height:${h}px;` : `top:50%;height:${h}px;`;
    return `
      <div class="chart-col" title="Dia ${d}: ${fmtSigned(v)}">
        <div class="chart-zero"></div>
        <div class="chart-bar" style="position:absolute;left:10%;right:10%;${posStyle}background:${color};"></div>
      </div>`;
  }).join('');

  const totalNet = values.reduce((s,v)=>s+v,0);
  return `
    <div class="chart-wrap">
      <div class="chart-bars">${cols}</div>
      <div class="chart-legend">
        <div class="item"><span class="sw" style="background:var(--clean-1)"></span>Ganho no dia</div>
        <div class="item"><span class="sw" style="background:var(--danger)"></span>Perda no dia</div>
        <div class="item">Saldo do período: <strong style="color:${totalNet>=0?'var(--clean-1)':'var(--danger)'};margin-left:4px;">${fmtSigned(totalNet)}</strong></div>
      </div>
    </div>
  `;
}

function renderTxnList(txns){
  if(!txns.length) return '<div class="empty-state">Nenhuma transação ainda. Avance o dia para gerar movimentação.</div>';
  const recent = [...txns].slice(-12).reverse();

}

function syncCharacterFormFromDom(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
  if($('#mName')) ui.modalData.name = $('#mName').value;
  if($('#mRole')) ui.modalData.role = $('#mRole').value;
  if($('#mDescription')) ui.modalData.description = $('#mDescription').value;
  if($('#mAssignedTo')) ui.modalData.assignedTo = $('#mAssignedTo').value;
  const stats = $$('[data-mod-stat]');
  const percents = $$('[data-mod-percent]');
  const modifiers = [];
  stats.forEach((el,i)=>{ modifiers.push({ stat: el.value, percent: parseFloat(percents[i].value) || 0 }); });
  ui.modalData.modifiers = modifiers;
}

function handleCharacterPhotoUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    try{
      const { error } = await sb.storage.from('game-images').upload(path, file);
      if(error) throw error;
      const { data } = sb.storage.from('game-images').getPublicUrl(path);
      syncCharacterFormFromDom();
      ui.modalData.photo = data.publicUrl;
      render();
    } catch(e){
      console.error('Falha ao enviar foto', e);
      showToast('Não consegui enviar a foto. Tenta de novo.');
    }
  };
  input.click();
}

/* ---------------- CALENDÁRIO ---------------- */
function ensureCalView(){
  if(ui.calYear == null || ui.calMonth == null){
    const d = dayToDate(state.day);
    ui.calYear = d.year;
    ui.calMonth = d.month;
  }
}

function renderCalendario(){
  ensureCalView();
  const year = ui.calYear;
  const month = ui.calMonth;
  const monthLength = MONTH_LENGTHS[month];
  const firstDay = firstDayNumberOfMonth(year, month);
  const todayDate = dayToDate(state.day);
  const isCurrentMonth = todayDate.year===year && todayDate.month===month;

  const cells = [];
  for(let i=0;i<monthLength;i++){
    const dayNum = firstDay + i;
    const dayOfMonth = i + 1;
    const hasEvent = state.events.some(e=> e.day===dayNum || (e.recurring && dayNum>=e.day && (!e.recurEndDay||dayNum<=e.recurEndDay)));
    const isToday = dayNum === state.day;
    cells.push(`<div class="month-day-cell ${isToday?'today':''}" data-goto-day="${dayNum}">
      <div class="n">${dayOfMonth}</div>
      ${hasEvent?'<div class="dot"></div>':''}
    </div>`);
  }

  const monthEvents = [...state.events]
    .filter(e => {
      const evStart = dayToDate(e.day);
      if(e.recurring){
        const endDay = e.recurEndDay || (firstDay + monthLength - 1);
        return e.day <= (firstDay + monthLength - 1) && endDay >= firstDay;
      }
      return evStart.year===year && evStart.month===month;
    })
    .sort((a,b)=>a.day-b.day);

  const notifs = state.notifications.slice(0,10);

  return `
    <div class="cal-nav">
      <button class="icon-btn" id="calPrevYear" title="Ano anterior">«</button>
      <button class="icon-btn" id="calPrevMonth" title="Mês anterior">‹</button>
      <div class="cal-nav-label">
        <div class="cal-month">${MONTH_NAMES[month]}</div>
        <div class="cal-year">${year}</div>
      </div>
      <button class="icon-btn" id="calNextMonth" title="Próximo mês">›</button>
      <button class="icon-btn" id="calNextYear" title="Próximo ano">»</button>
    </div>
    ${!isCurrentMonth ? `<div class="cal-today-link" id="calGoToday">↺ voltar para ${formatDateShort(state.day)}</div>` : ''}

    <div class="card">
      <div class="month-grid">${cells.join('')}</div>
    </div>

    <div class="section-title">Eventos em ${MONTH_NAMES[month]} <span class="add-link" data-action="addEvent">+ novo</span></div>
    ${monthEvents.length ? monthEvents.map(e=>renderEventCard(e)).join('') : '<div class="empty-state">Nenhum evento marcado para este mês.</div>'}

    <div class="section-title">Registro de acontecimentos</div>
    <div class="card">
      ${notifs.length ? notifs.map(n=>`
        <div class="notif">
          <div class="notif-icon">${n.icon}</div>
          <div class="notif-body">
            <div class="notif-text">${n.text}</div>
            <div class="notif-day">${formatDateShort(n.day)}</div>
          </div>
        </div>`).join('') : '<div class="empty-state">Nada registrado ainda.</div>'}
    </div>
  `;
}

function renderEventCard(e){
  const targetName = e.targetType==='business' ? state.businesses.find(b=>b.id===e.targetId)?.name
    : e.targetType==='property' ? state.properties.find(p=>p.id===e.targetId)?.name : null;
  return `

      <div class="field"><label>Notas (opcional)</label><textarea id="mNotes"></textarea></div>
      <div class="hint">Quando concluída, só dispara um aviso — você decide manualmente o que fazer a seguir.</div>

  if(type === 'researchDetail'){
    const r = state.researches.find(x=>x.id===ui.modalData.id);

    if(!isMaster){
      body = `
        <div class="hint">${r.legal?'Pesquisa legal':'Pesquisa ilegal'} · ${r.completed?'concluída':`${Math.round(r.daysElapsed)}/${r.durationDays} dias`}</div>

        ${r.notes?`<div class="hint" style="margin-top:8px;">${r.notes}</div>`:''}

          <div class="field"><label>Dias decorridos</label><input id="mDaysElapsed" type="number" value="${Math.round(r.daysElapsed)}"></div>

        <div class="field"><label>Notas</label><textarea id="mNotes">${r.notes||''}</textarea></div>
        <div class="modal-actions">
          <button class="btn btn-danger btn-sm" id="deleteResearch">Remover</button>
        </div>

    }

  if(type === 'addCharacter'){
    title = 'Novo personagem';
    body = renderCharacterForm(null);
  }

  if(type === 'characterDetail'){
    const c = state.characters.find(x=>x.id===ui.modalData.id);
    title = c.name;
    if(!isMaster){
      body = `
        <div class="char-photo" style="width:100%;height:140px;margin-bottom:12px;${c.photo?`background-image:url('${c.photo}')`:''}">${c.photo?'':'👤'}</div>
        ${c.role ? `<div class="hint"><strong>${c.role}</strong></div>` : ''}
        ${c.description ? `<div class="hint" style="margin-top:6px;">${c.description}</div>` : ''}
        <div class="hint" style="margin-top:8px;">${assignedToLabel(c)}</div>
        ${(c.modifiers||[]).length ? `<div class="char-mods" style="margin-top:8px;">${c.modifiers.map(m=>`<span class="char-mod-badge ${m.percent>=0?'pos':'neg'}">${(STAT_LABELS[m.stat]||m.stat)} ${m.percent>0?'+':''}${m.percent}%</span>`).join('')}</div>` : ''}
      `;
    } else {

        <div class="modal-actions">

  return `

      </div>

/* ============================================================
   HANDLERS
   ============================================================ */
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  const modeCatBtn = $('#modeCatBtn');
  if(modeCatBtn) modeCatBtn.onclick = ()=> toggleMode(modeCatBtn);

  const diceRollerBtn = $('#diceRollerBtn');
  if(diceRollerBtn) diceRollerBtn.onclick = openDiceRoller;

  const appsBtn = $('#appsBtn');
  if(appsBtn) appsBtn.onclick = openAppsLauncher;

  const roleBadge = $('#roleBadge');
  if(roleBadge) roleBadge.onclick = ()=>{
    if(isMaster && confirm('Sair do modo mestre? Você vai continuar vendo o jogo, só que como jogador.')){
      logoutMaster();
    }
  };

  const btnBack = $('#btnBack');
  if(btnBack) btnBack.onclick = ()=>{ if(!btnBack.disabled) goBackDay(); };

  const btnForward = $('#btnForward');
  if(btnForward) btnForward.onclick = ()=> advanceDay();

  $$('.tab-btn').forEach(el=>{
    el.onclick = ()=>{ state.tab = el.dataset.tab; saveState(); render(); };
  });
  $$('.subtab').forEach(el=>{
    el.onclick = ()=>{ state.investSubTab = el.dataset.subtab; saveState(); render(); };
  });

  $$('[data-action]').forEach(el=>{
    el.onclick = ()=>{
      const a = el.dataset.action;
      if(a==='editBalance') openModal('editBalance');
      if(a==='addExpense') openModal('addExpense');
      if(a==='addBusiness') openModal('addBusiness');
      if(a==='addProperty') openModal('addProperty');
      if(a==='addEvent') openModal('addEvent');
      if(a==='addResearch') openModal('addResearch');
      if(a==='addCharacter') openModal('addCharacter', { modifiers: [] });
    };
  });

  const calPrevMonth = $('#calPrevMonth');
  if(calPrevMonth) calPrevMonth.onclick = ()=>{
    ensureCalView();
    ui.calMonth -= 1;
    if(ui.calMonth < 0){ ui.calMonth = 11; ui.calYear -= 1; }
    render();
  };
  const calNextMonth = $('#calNextMonth');
  if(calNextMonth) calNextMonth.onclick = ()=>{
    ensureCalView();
    ui.calMonth += 1;
    if(ui.calMonth > 11){ ui.calMonth = 0; ui.calYear += 1; }
    render();
  };
  const calPrevYear = $('#calPrevYear');
  if(calPrevYear) calPrevYear.onclick = ()=>{ ensureCalView(); ui.calYear -= 1; render(); };
  const calNextYear = $('#calNextYear');
  if(calNextYear) calNextYear.onclick = ()=>{ ensureCalView(); ui.calYear += 1; render(); };
  const calGoToday = $('#calGoToday');
  if(calGoToday) calGoToday.onclick = ()=>{
    const d = dayToDate(state.day);
    ui.calYear = d.year; ui.calMonth = d.month;
    render();
  };
  $$('[data-goto-day]').forEach(el=>{
    el.onclick = ()=>{
      openModal('addEvent', { presetDay: parseInt(el.dataset.gotoDay) });
    };
  });


  $$('[data-open-business]').forEach(el=>{
    el.onclick = ()=> openModal('businessDetail', { id: el.dataset.openBusiness });
  });
  $$('[data-open-property]').forEach(el=>{
    el.onclick = ()=> openModal('propertyDetail', { id: el.dataset.openProperty });
  });
  $$('[data-open-research]').forEach(el=>{
    el.onclick = ()=> openModal('researchDetail', { id: el.dataset.openResearch });
  });
  $$('[data-open-character]').forEach(el=>{
    el.onclick = ()=> openModal('characterDetail', { id: el.dataset.openCharacter, modifiers: null });
  });

  // modal generic
  const overlay = $('#overlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
    $('#closeModal') && ($('#closeModal').onclick = closeModal);
    $('#cancelModal') && ($('#cancelModal').onclick = closeModal);

    if(ui.modal === 'diceRoller'){
      $$('[data-dice]').forEach(el=>{
        el.onclick = ()=> rollDice(el.dataset.dice, null);
      });
      const diceRollCustom = $('#diceRollCustom');
      const diceCustomSides = $('#diceCustomSides');
      if(diceRollCustom) diceRollCustom.onclick = ()=>{
        const sides = parseInt(diceCustomSides.value);
        if(!sides || sides < 2){ showToast('Digita um número de lados válido (2 ou mais).'); return; }
        rollDice('custom', sides);
      };
    }

    if((ui.modal === 'addCharacter' || ui.modal === 'characterDetail') && isMaster){
      const charPhotoBtn = $('#charPhotoBtn');
      if(charPhotoBtn) charPhotoBtn.onclick = handleCharacterPhotoUpload;
      const addModifierRow = $('#addModifierRow');
      if(addModifierRow) addModifierRow.onclick = ()=>{
        syncCharacterFormFromDom();
        ui.modalData.modifiers.push({ stat: 'income', percent: 0 });
        render();
      };
      $$('[data-remove-mod]').forEach(el=>{
        el.onclick = ()=>{
          syncCharacterFormFromDom();
          ui.modalData.modifiers.splice(parseInt(el.dataset.removeMod), 1);
          render();
        };
      });
    }

    $$('.seg-opt').forEach(el=>{
      el.onclick = ()=>{
        const group = el.dataset.seg;
        $$(`.seg-opt[data-seg="${group}"]`).forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        if(ui.modal==='addEvent') updateEventFieldsVisibility();
      };
    });

    if(ui.modal==='addEvent'){
      updateEventFieldsVisibility();
      const targetTypeSel = $('#mTargetType');
      if(targetTypeSel) targetTypeSel.onchange = updateEventFieldsVisibility;
    }

    $('#confirmModal') && ($('#confirmModal').onclick = handleConfirm);

    $('#forceHeat') && ($('#forceHeat').onclick = ()=>{
      const b = state.businesses.find(x=>x.id===ui.modalData.id);
      const tier = b.heat>80?'invasao':b.heat>50?'congelamento':'investigacao';
      triggerHeatEvent(b, tier, false);
      saveState(); closeModal();
    });
    $('#deleteBusiness') && ($('#deleteBusiness').onclick = ()=>{
      state.businesses = state.businesses.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#forceBuff') && ($('#forceBuff').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      triggerPropertyEvent(p, 'buff', false);
      saveState(); closeModal();
    });
    $('#forceDebuff') && ($('#forceDebuff').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      triggerPropertyEvent(p, 'debuff', false);
      saveState(); closeModal();
    });
    $('#forcePropertyHeat') && ($('#forcePropertyHeat').onclick = ()=>{
      const p = state.properties.find(x=>x.id===ui.modalData.id);
      const tier = p.heat>80?'invasao':p.heat>50?'congelamento':'investigacao';
      triggerPropertyHeatEvent(p, tier);
      saveState(); closeModal();
    });
    $('#deleteProperty') && ($('#deleteProperty').onclick = ()=>{
      state.properties = state.properties.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteResearch') && ($('#deleteResearch').onclick = ()=>{
      state.researches = state.researches.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
    $('#deleteCharacter') && ($('#deleteCharacter').onclick = ()=>{
      state.characters = state.characters.filter(x=>x.id!==ui.modalData.id);
      saveState(); closeModal();
    });
  }
}

function updateEventFieldsVisibility(){
  const typeVal = document.querySelector('.seg-opt[data-seg="etype"].active')?.dataset.val;
  const effectFields = document.getElementById('effectFields');
  if(effectFields) effectFields.style.display = typeVal==='efeito' ? 'block' : 'none';

  const targetType = document.getElementById('mTargetType')?.value;
  const targetIdField = document.getElementById('targetIdField');
  if(targetIdField) targetIdField.style.display = (targetType==='business'||targetType==='property') ? 'block' : 'none';

  const recurVal = document.querySelector('.seg-opt[data-seg="erecur"].active')?.dataset.val;
  const recurEndField = document.getElementById('recurEndField');
  if(recurEndField) recurEndField.style.display = recurVal==='yes' ? 'block' : 'none';
}

function handleConfirm(){
  handleConfirmAsync();
}

async function handleConfirmAsync(){
  const $ = sel => document.querySelector(sel);
  const type = ui.modal;

  if(type === 'editBalance'){
    const newBalance = parseFloat($('#mBalance').value) || 0;
    if(state.mode === 'limpo'){
      state.clean.balance = newBalance;
      state.clean.credit = parseFloat($('#mCredit').value) || 0;
    } else {
      state.dirty.balance = newBalance;
    }
    saveState(); closeModal(); showToast('Saldo atualizado.'); return;
  }

  if(type === 'addExpense'){
    const label = $('#mLabel').value.trim() || 'Gasto sem nome';
    const amount = parseFloat($('#mAmount').value) || 0;
    state.clean.fixedExpenses.push({ id: uid('exp'), label, amount });
    saveState(); closeModal(); showToast('Gasto fixo adicionado.'); return;
  }

  if(type === 'addBusiness'){
    const name = $('#mName').value.trim() || 'Negócio sem nome';
    const status = document.querySelector('.seg-opt[data-seg="status"].active').dataset.val;
    const investment = parseFloat($('#mInvestment').value) || 0;
    const days = parseFloat($('#mDays').value) || 10;
    const income = parseFloat($('#mIncome').value) || 0;
    const launderEl = $('#mLaunder');
    const launderPercent = launderEl ? (parseFloat(launderEl.value) || 0) : 0;
    state.businesses.push({
      id: uid('biz'), name, illegal: state.mode==='sujo',
      status, investment, daysToComplete: days, daysElapsed: 0,
      dailyIncome: income, launderPercent, heat: 0, frozenDaysLeft: 0
    });
    saveState(); closeModal(); showToast('Negócio criado.'); return;
  }

  if(type === 'addProperty'){
    const name = $('#mName').value.trim() || 'Propriedade sem nome';
    const income = parseFloat($('#mIncome').value) || 0;
    const maint = parseFloat($('#mMaint').value) || 0;
    const employees = parseInt($('#mEmployees').value) || 0;
    const launderEl = $('#mLaunder');
    const launderPercent = launderEl ? (parseFloat(launderEl.value) || 0) : 0;
    state.properties.push({
      id: uid('prop'), name, illegal: state.mode==='sujo',
      dailyIncome: income, maintenance: maint, employees,
      launderPercent, heat: 0, frozenDaysLeft: 0, activeEvent: null
    });
    saveState(); closeModal(); showToast('Propriedade criada.'); return;
  }

  if(type === 'businessDetail'){
    const b = state.businesses.find(x=>x.id===ui.modalData.id);
    const launderEl = $('#mLaunder');
    if(isMaster){
      if(launderEl) b.launderPercent = parseFloat(launderEl.value) || 0;
      const incomeEl = $('#mIncome');
      if(incomeEl) b.dailyIncome = parseFloat(incomeEl.value) || 0;
      saveState(); closeModal(); showToast('Negócio atualizado.'); return;
    } else {
      if(!launderEl){ closeModal(); return; }
      const percent = parseFloat(launderEl.value) || 0;
      try{
        const { error } = await sb.rpc('player_set_launder_percent', {
          entity_type: 'business', entity_id: b.id, percent
        });
        if(error) throw error;
        closeModal(); showToast('Hiperfaturamento ajustado.');
      } catch(e){
        showToast('Não consegui salvar. Tenta de novo.');
      }
      return;
    }
  }

  if(type === 'propertyDetail'){
    const p = state.properties.find(x=>x.id===ui.modalData.id);
    const launderEl = $('#mLaunder');
    if(isMaster){
      const incomeEl = $('#mIncome');
      const maintEl = $('#mMaint');
      const empEl = $('#mEmployees');
      if(incomeEl) p.dailyIncome = parseFloat(incomeEl.value) || 0;
      if(maintEl) p.maintenance = parseFloat(maintEl.value) || 0;
      if(empEl) p.employees = parseInt(empEl.value) || 0;
      if(launderEl) p.launderPercent = parseFloat(launderEl.value) || 0;
      saveState(); closeModal(); showToast('Propriedade atualizada.'); return;
    } else {
      if(!launderEl){ closeModal(); return; }
      const percent = parseFloat(launderEl.value) || 0;
      try{
        const { error } = await sb.rpc('player_set_launder_percent', {
          entity_type: 'property', entity_id: p.id, percent
        });
        if(error) throw error;
        closeModal(); showToast('Hiperfaturamento ajustado.');
      } catch(e){
        showToast('Não consegui salvar. Tenta de novo.');
      }
      return;
    }
  }

  if(type === 'addEvent'){
    const title = $('#mTitle').value.trim() || 'Evento sem título';
    const description = $('#mDesc').value.trim();
    const day = parseInt($('#mDay').value) || state.day;

    if(!isMaster){
      try{
        const { error } = await sb.rpc('player_add_calendar_event', {
          event_day: day, title, description
        });
        if(error) throw error;
        closeModal(); showToast('Evento adicionado ao calendário.');
      } catch(e){
        showToast('Não consegui adicionar o evento. Tenta de novo.');
      }
      return;
    }

    const etypeEl = document.querySelector('.seg-opt[data-seg="etype"].active');
    const etype = etypeEl ? etypeEl.dataset.val : 'visual';
    let targetType = null, targetId = null, valueType='fixed', value=0, mode='limpo', recurring=false, recurEndDay=null;
    if(etype === 'efeito'){
      const tt = $('#mTargetType').value;
      targetType = tt==='none' ? null : tt;
      targetId = targetType ? $('#mTargetId').value : null;
      valueType = $('#mValueType').value;
      value = parseFloat($('#mValue').value) || 0;
      mode = document.querySelector('.seg-opt[data-seg="emode"].active').dataset.val;
      recurring = document.querySelector('.seg-opt[data-seg="erecur"].active').dataset.val === 'yes';
      recurEndDay = recurring ? (parseInt($('#mRecurEnd').value) || null) : null;
    }
    state.events.push({
      id: uid('evt'), day, title, description, type: etype,
      targetType, targetId, valueType, value, recurring, recurEndDay, mode, applied:false
    });
    saveState(); closeModal(); showToast('Evento adicionado ao calendário.'); return;
  }

  if(type === 'addResearch'){
    const name = $('#mName').value.trim() || 'Pesquisa sem nome';
    const legal = document.querySelector('.seg-opt[data-seg="rlegal"].active').dataset.val === 'legal';
    const durationValue = parseFloat($('#mDurationValue').value) || 1;
    const unit = $('#mDurationUnit').value;
    const unitDays = unit === 'semanas' ? 7 : unit === 'meses' ? 30 : 1;
    const durationDays = Math.max(1, Math.round(durationValue * unitDays));
    const businessId = $('#mResearchBusiness').value || null;
    const notes = $('#mNotes').value.trim();
    state.researches.push({ id: uid('res'), name, legal, durationDays, daysElapsed: 0, businessId, notes, completed: false });
    saveState(); closeModal(); showToast('Pesquisa criada.'); return;
  }

  if(type === 'researchDetail'){
    if(!isMaster){ closeModal(); return; }
    const r = state.researches.find(x=>x.id===ui.modalData.id);
    r.daysElapsed = parseFloat($('#mDaysElapsed').value) || 0;
    r.durationDays = Math.max(1, parseFloat($('#mDurationDays').value) || 1);
    r.notes = $('#mNotes').value.trim();
    r.completed = r.daysElapsed >= r.durationDays;
    saveState(); closeModal(); showToast('Pesquisa atualizada.'); return;
  }

  if(type === 'addCharacter' || type === 'characterDetail'){
    if(!isMaster){ closeModal(); return; }
    syncCharacterFormFromDom();
    const name = ui.modalData.name.trim() || 'Sem nome';
    const role = ui.modalData.role.trim();
    const description = ui.modalData.description.trim();
    const photo = ui.modalData.photo !== undefined ? ui.modalData.photo : null;
    const modifiers = (ui.modalData.modifiers||[]).filter(m=>m.percent);
    const assignRaw = ui.modalData.assignedTo;
    const assignedTo = assignRaw ? { type: assignRaw.split(':')[0], id: assignRaw.split(':')[1] } : null;

    if(type === 'addCharacter'){
      state.characters.push({ id: uid('char'), name, role, description, photo, modifiers, assignedTo });
      saveState(); closeModal(); showToast('Personagem criado.'); return;
    } else {
      const c = state.characters.find(x=>x.id===ui.modalData.id);
      c.name = name; c.role = role; c.description = description; c.modifiers = modifiers; c.assignedTo = assignedTo;
      if(ui.modalData.photo !== undefined) c.photo = ui.modalData.photo;
      saveState(); closeModal(); showToast('Personagem atualizado.'); return;
    }
  }
}

/* ============================================================
   DIÁRIO (CAT = mestre, DOG = jogador)
   Vive fora do #root (num overlay próprio) de propósito: o
   render() principal nunca toca essa div, então updates em
   tempo real do game_state não derrubam o editor Quill no meio
   de uma digitação.
   ============================================================ */
let diaryOpen = false;
let diaryHistoryOpen = false;
let diaryDate = todayISODate();
let diaryEntries = {};
let diaryChannel = null;
let activeQuill = null;
let mountedEditorAuthor = null;
let mountedEditorDate = null;
let diarySaveTimer = null;
let quillAssetsLoaded = false;

function todayISODate(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftISODate(iso, delta){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatRealDate(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function myDiaryAuthor(){ return isMaster ? 'cat' : 'dog'; }

function loadQuillAssets(){
  return new Promise((resolve, reject)=>{
    if(quillAssetsLoaded){ resolve(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js';
    script.onload = ()=>{ quillAssetsLoaded = true; resolve(); };
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function openDiary(){
  diaryOpen = true;
  diaryHistoryOpen = false;
  diaryDate = todayISODate(); // sempre abre no dia de hoje, nunca fica preso em onde a pessoa navegou da última vez
  document.getElementById('diaryTrigger').style.display = 'none';
  const overlay = document.getElementById('diaryOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando diário…</div>`;
  try{
    await loadQuillAssets();
    await loadDiaryEntries();
    overlay.innerHTML = renderDiaryShell();
    attachDiaryShellHandlers();
    renderDiaryPanels();
    subscribeDiaryRealtime();
  } catch(e){
    console.error('Falha ao abrir o diário', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o diário agora. Tenta de novo em instantes.</div>`;
  }
}

function closeDiary(){
  diaryOpen = false;
  activeQuill = null;
  mountedEditorAuthor = null;
  mountedEditorDate = null;
  const overlay = document.getElementById('diaryOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
  const trigger = document.getElementById('diaryTrigger');
  if(trigger && state !== null) trigger.style.display = 'block';
  if(diaryChannel){ sb.removeChannel(diaryChannel); diaryChannel = null; }
}

async function loadDiaryEntries(){
  const { data, error } = await sb.from('diary_entries').select('entry_date, author, content, updated_at');
  if(error) throw error;
  diaryEntries = {};
  (data||[]).forEach(row=>{ diaryEntries[row.entry_date+'|'+row.author] = row; });
}

function subscribeDiaryRealtime(){
  if(diaryChannel) return;
  diaryChannel = sb.channel('diary_entries_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'diary_entries' }, (payload)=>{
      const row = payload.new && payload.new.entry_date ? payload.new : payload.old;
      if(!row) return;
      const key = row.entry_date+'|'+row.author;
      if(payload.eventType === 'DELETE') delete diaryEntries[key];
      else diaryEntries[key] = payload.new;
      if(!diaryOpen) return;
      // não re-renderiza a coluna que EU estou editando agora (evita perder o cursor/conteúdo em digitação)
      if(row.author === myDiaryAuthor() && row.entry_date === diaryDate) return;
      renderDiaryPanels();
    })
    .subscribe();
}

function renderDiaryShell(){
  return `
    <div class="diary-head">
      <div class="diary-title">Diário</div>
      <div class="icon-btn" id="diaryClose">✕</div>
    </div>
    <div id="diaryDayView">
      <div class="diary-datenav">
        <button class="icon-btn" id="diaryPrevDay" title="Dia anterior">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg>
        </button>
        <div class="diary-date-label" id="diaryDateLabel"></div>
        <button class="icon-btn" id="diaryNextDay" title="Próximo dia">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg>
        </button>
      </div>
      <div class="diary-today-link" id="diaryToday" style="display:none;">↺ voltar para hoje</div>
      <div class="diary-history-link" id="diaryHistoryToggle">📜 ver dias anteriores</div>
      <div class="diary-cols" id="diaryCols">
        <div class="diary-col" id="dogCol">
          <div class="diary-col-head"><span class="diary-col-tag dog">DOG</span><span class="diary-col-sub">Jogador</span></div>
          <div class="diary-col-body" id="dogColBody"></div>
        </div>
        <div class="diary-col" id="catCol">
          <div class="diary-col-head"><span class="diary-col-tag cat">CAT</span><span class="diary-col-sub">Mestre</span></div>
          <div class="diary-col-body" id="catColBody"></div>
        </div>
      </div>
    </div>
    <div class="diary-history" id="diaryHistory" style="display:none;"></div>

function attachDiaryShellHandlers(){
  document.getElementById('diaryClose').onclick = closeDiary;
  document.getElementById('diaryPrevDay').onclick = ()=> goDiaryDay(-1);
  document.getElementById('diaryNextDay').onclick = ()=> goDiaryDay(1);
  document.getElementById('diaryToday').onclick = ()=>{ diaryDate = todayISODate(); renderDiaryPanels(); };
  document.getElementById('diaryHistoryToggle').onclick = toggleDiaryHistory;
}

function toggleDiaryHistory(){
  diaryHistoryOpen = !diaryHistoryOpen;
  document.getElementById('diaryDayView').style.display = diaryHistoryOpen ? 'none' : 'block';
  document.getElementById('diaryHistory').style.display = diaryHistoryOpen ? 'block' : 'none';
  document.getElementById('diaryHistoryToggle').textContent = diaryHistoryOpen ? '↺ voltar pro dia' : '📜 ver dias anteriores';
  if(diaryHistoryOpen){
    document.getElementById('diaryHistoryToggle').style.display = 'none'; // o link some junto (fica só o de dentro do dia)
    renderDiaryHistoryList();
  } else {
    document.getElementById('diaryHistoryToggle').style.display = 'block';
  }
}

function stripHtmlPreview(html){
  if(!html) return '';
  // regex em vez de jogar o HTML numa <div> pra ler o textContent: fazer isso
  // com <img> no meio cria elementos de imagem de verdade e faz o navegador
  // tentar baixar cada imagem de novo, só pra pegar um texto de prévia — fica
  // cada vez mais lento conforme o diário acumula dias com imagem.
  const text = html
    .replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/\s+/g, ' ')
    .trim();
  if(!text) return '';
  return text.length > 100 ? text.slice(0,100)+'…' : text;
}

function formatRealDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  const s = d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function renderDiaryHistoryList(){
  const el = document.getElementById('diaryHistory');
  const byDate = {};
  Object.values(diaryEntries).forEach(row=>{
    if(!byDate[row.entry_date]) byDate[row.entry_date] = {};
    byDate[row.entry_date][row.author] = row;
  });
  const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));
  if(!dates.length){
    el.innerHTML = `<div class="diary-history-link" id="diaryHistoryBack">↺ voltar pro dia</div><div class="diary-empty" style="margin-top:14px;">Nenhum dia escrito ainda.</div>`;
    document.getElementById('diaryHistoryBack').onclick = toggleDiaryHistory;
    return;
  }
  const rows = dates.map(d=>{
    const dogEntry = byDate[d].dog;
    const catEntry = byDate[d].cat;
    const dogPreview = dogEntry ? stripHtmlPreview(dogEntry.content && dogEntry.content.html) : '';
    const catPreview = catEntry ? stripHtmlPreview(catEntry.content && catEntry.content.html) : '';
    return `
      <div class="diary-history-row" data-goto-diary-date="${d}">
        <div class="diary-history-date">${formatRealDateShort(d)}</div>
        <div class="diary-history-previews">
          <div class="diary-history-preview"><span class="diary-col-tag dog">DOG</span>${dogPreview ? dogPreview : '<em>nada escrito</em>'}</div>
          <div class="diary-history-preview"><span class="diary-col-tag cat">CAT</span>${catPreview ? catPreview : '<em>nada escrito</em>'}</div>
        </div>
      </div>`;
  }).join('');
  el.innerHTML = `<div class="diary-history-link" id="diaryHistoryBack">↺ voltar pro dia</div><div class="card" style="margin-top:14px;padding:4px 14px;">${rows}</div>`;
  document.getElementById('diaryHistoryBack').onclick = toggleDiaryHistory;
  el.querySelectorAll('[data-goto-diary-date]').forEach(row=>{
    row.onclick = ()=>{
      diaryDate = row.dataset.gotoDiaryDate;
      toggleDiaryHistory();
      renderDiaryPanels();
    };
  });
}

function goDiaryDay(delta){
  diaryDate = shiftISODate(diaryDate, delta);
  renderDiaryPanels();
}

function renderDiaryPanels(){
  document.getElementById('diaryDateLabel').textContent = formatRealDate(diaryDate);
  document.getElementById('diaryToday').style.display = (diaryDate === todayISODate()) ? 'none' : 'block';
  renderDiaryColumn('dog');
  renderDiaryColumn('cat');
}

function renderDiaryColumn(author){
  const mine = author === myDiaryAuthor();
  const bodyEl = document.getElementById(author+'ColBody');
  const entry = diaryEntries[diaryDate+'|'+author];

  if(mine){
    if(mountedEditorDate === diaryDate) return; // editor já montado pra essa data, não mexe
    if(!activeQuill){
      // Quill não tem um destroy() de verdade — em vez de recriar o editor do
      // zero a cada troca de dia (o que ia acumulando listeners internos dele
      // e deixando a sessão cada vez mais lenta), cria uma vez só e reaproveita.
      bodyEl.innerHTML = `<div class="diary-editor" id="${author}Editor"></div><div class="diary-save-hint" id="diarySaveHint">Sincronizado</div>`;
      const editorEl = document.getElementById(author+'Editor');
      activeQuill = new Quill(editorEl, {
        theme: 'snow',
        modules: { toolbar: [['bold','italic','underline'],[{list:'ordered'},{list:'bullet'}],['image'],['clean']] },
        placeholder: 'Escreva o que aconteceu hoje…'
      });
      activeQuill.getModule('toolbar').addHandler('image', ()=> handleDiaryImageUpload(activeQuill));
      activeQuill.on('text-change', (delta, old, source)=>{
        if(source !== 'user') return;
        const hint = document.getElementById('diarySaveHint');
        const targetDate = diaryDate, targetAuthor = author;
        // imagem colada (ctrl+v) vem como base64 embutido no HTML — se salvar
        // assim, a entrada do dia fica gigante e o diário todo fica lento pra
        // carregar. Sobe pro Storage igual ao botão de inserir imagem antes
        // de salvar.
        if(activeQuill.root.innerHTML.includes('data:image')){
          if(hint) hint.textContent = 'Enviando imagem…';
          clearTimeout(diarySaveTimer);
          migratePastedImages(activeQuill).then(()=>{
            persistDiaryEntry(targetAuthor, targetDate, activeQuill.root.innerHTML);
          });
          return;
        }
        if(hint) hint.textContent = 'Salvando…';
        clearTimeout(diarySaveTimer);
        diarySaveTimer = setTimeout(()=> persistDiaryEntry(targetAuthor, targetDate, activeQuill.root.innerHTML), 700);
      });
      mountedEditorAuthor = author;
    }
    if(entry && entry.content && entry.content.html){
      activeQuill.clipboard.dangerouslyPasteHTML(entry.content.html);
    } else {
      activeQuill.setText('');
    }
    mountedEditorDate = diaryDate;
  } else {
    bodyEl.innerHTML = (entry && entry.content && entry.content.html)
      ? `<div class="ql-editor diary-readonly">${entry.content.html}</div>`
      : `<div class="diary-empty">Nada escrito ${author==='cat'?'pelo mestre':'pelo jogador'} neste dia.</div>`;
  }
}

async function persistDiaryEntry(author, entryDate, html, attempt = 1){
  try{
    if(author === 'cat'){
      const { error } = await sb.rpc('master_upsert_diary_entry', { p_token: masterToken, p_entry_date: entryDate, p_content: { html } });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('player_upsert_diary_entry', { p_entry_date: entryDate, p_content: { html } });
      if(error) throw error;
    }
    diaryEntries[entryDate+'|'+author] = { entry_date: entryDate, author, content: { html }, updated_at: new Date().toISOString() };
    if(diaryDate === entryDate && mountedEditorAuthor === author){
      const hint = document.getElementById('diarySaveHint');
      if(hint) hint.textContent = 'Sincronizado';
    }
  } catch(e){
    console.error('Falha ao salvar diário', e);
    if(author === 'cat' && isMasterSessionExpiredError(e?.message)){
      closeDiary();
      handleExpiredMasterSession('O que você tava escrevendo no diário não foi salvo.');
      return;
    }
    if(diaryDate === entryDate && mountedEditorAuthor === author){
      const hint = document.getElementById('diarySaveHint');
      if(hint) hint.textContent = attempt < 3 ? 'Falha ao salvar — tentando de novo…' : 'Não consegui salvar. O texto continua aqui — tenta digitar algo de novo pra reenviar.';
    }
    if(attempt < 3){
      setTimeout(()=> persistDiaryEntry(author, entryDate, html, attempt+1), 3000 * attempt);
    }
  }
}

function flushDiarySaveNow(){
  if(!diaryOpen || !activeQuill || !mountedEditorAuthor) return;
  clearTimeout(diarySaveTimer);
  persistDiaryEntry(mountedEditorAuthor, mountedEditorDate, activeQuill.root.innerHTML);
}
// troca de aba / app em segundo plano / navegador descartando a aba (comum no celular)
// não pode esperar o debounce normal — salva na hora que a aba perde o foco.
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushDiarySaveNow(); });
window.addEventListener('pagehide', flushDiarySaveNow);

async function handleDiaryImageUpload(quillInstance){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    try{
      const { error: upErr } = await sb.storage.from('diary-images').upload(path, file);
      if(upErr) throw upErr;
      const { data } = sb.storage.from('diary-images').getPublicUrl(path);
      const range = quillInstance.getSelection(true);
      quillInstance.insertEmbed(range ? range.index : 0, 'image', data.publicUrl, 'user');
    } catch(e){
      console.error('Falha ao enviar imagem', e);
      showToast('Não consegui enviar a imagem. Tenta de novo.');
    }
  };
  input.click();
}

async function migratePastedImages(quillInstance){
  const html = quillInstance.root.innerHTML;
  const matches = html.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g);
  if(!matches) return;
  for(const dataUrl of matches){
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const ext = (dataUrl.match(/data:image\/([a-zA-Z0-9.+-]+);/) || [,'png'])[1].replace('jpeg','jpg');
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from('diary-images').upload(path, blob, { contentType: blob.type || ('image/'+ext) });
      if(error) throw error;
      const { data } = sb.storage.from('diary-images').getPublicUrl(path);
      quillInstance.root.querySelectorAll('img[src^="data:image"]').forEach(img=>{
        if(img.getAttribute('src') === dataUrl) img.setAttribute('src', data.publicUrl);
      });
    } catch(e){
      console.error('Falha ao migrar imagem colada', e);
    }
  }
}

/* ============================================================
   ROLADOR DE DADOS — registro compartilhado, ao vivo pros dois lados
   ============================================================ */
let diceRolls = [];
let diceChannel = null;
let diceLoaded = false;
const DICE_TYPES = ['d2','d4','d6','d8','d10','d20','d100'];

function myRole(){ return isMaster ? 'cat' : 'dog'; }

async function loadDiceRolls(){
  try{
    const { data, error } = await sb.from('dice_rolls').select('id, roller, dice_type, custom_sides, result, created_at').order('created_at', { ascending: false }).limit(30);
    if(error) throw error;
    diceRolls = data || [];
  } catch(e){
    console.error('Falha ao carregar rolagens', e);
  }
}

function subscribeDiceRealtime(){
  if(diceChannel) return;
  diceChannel = sb.channel('dice_rolls_changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dice_rolls' }, (payload)=>{
      diceRolls.unshift(payload.new);
      if(diceRolls.length > 30) diceRolls.pop();
      if(ui.modal === 'diceRoller') render();
    })
    .subscribe();
}

    await loadDiceRolls();

}

  }
}

function diceLabel(roll){
  return roll.dice_type === 'custom' ? `d${roll.custom_sides}` : roll.dice_type;

function timeAgo(iso){
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'agora';
  if(mins < 60) return `${mins}min`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `${hours}h`;
  return `${Math.floor(hours/24)}d`;
}

/* ============================================================
   Helper compartilhado: aplica um evento de realtime (insert/
   update/delete) num array local em cache, in-place.
   ============================================================ */
function applyRealtimeUpsert(arr, payload){
  if(payload.eventType === 'DELETE'){
    const idx = arr.findIndex(x=>x.id===payload.old.id);
    if(idx>=0) arr.splice(idx,1);
  } else {
    const idx = arr.findIndex(x=>x.id===payload.new.id);
    if(idx>=0) arr[idx] = payload.new; else arr.push(payload.new);
  }
}

function fmtWeight(n){
  const v = Math.round(n*100)/100;
  return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(2)) + 'kg';
}

function setupInventoryDrag(){
  const root = document.querySelector('.inv-wrap');
  if(!root) return;
  enableDragDrop(root, {
    // itens e recipientes (o título do cartão do recipiente é a "alça")
    dragSelector: '[data-open-item], [data-edit-receptacle]',
    dropSelector: '[data-drop]',
    hint: (el)=> el.dataset.editReceptacle
      ? 'Solte em "Com você" ou sobre um depósito pra guardar o recipiente'
      : 'Solte sobre um lugar, recipiente ou "Com você"',
    // enquanto arrasta um recipiente, "dentro de outro recipiente" não é destino válido
    dragClass: (el)=> el.dataset.editReceptacle ? 'dnd-drag-receptacle' : null,
    onTap: (el)=>{
      if(el.dataset.editReceptacle){
        invView='receptacleForm'; invEditingId=el.dataset.editReceptacle; invRecFormPhoto=undefined; invRecFormDraft=null; renderInventoryOverlay();
        return;
      }
      invView='itemForm'; invEditingId=el.dataset.openItem; invFormPhoto=undefined; invFormDraft=null; renderInventoryOverlay();
    },
    onDrop: (dragEl, targetEl)=>{
      if(dragEl.dataset.editReceptacle){
        const rec = inventoryReceptacles.find(r=>r.id===dragEl.dataset.editReceptacle);
        if(!rec) return;
        const val = targetEl.dataset.drop;
        let containerId = null;
        if(val.startsWith('container:')) containerId = val.slice('container:'.length);
        else if(val.startsWith('receptacle:')){
          // soltou em cima de outro recipiente: vai pro mesmo lugar dele (um recipiente não guarda outro)
          const other = inventoryReceptacles.find(r=>r.id === val.slice('receptacle:'.length));
          containerId = other ? (other.container_id || null) : null;
        }
        moveInventoryReceptacle(rec, containerId);
        return;
      }
      const item = inventoryItems.find(i=>i.id===dragEl.dataset.openItem);
      if(!item) return;
      const dropVal = targetEl.dataset.drop;
      let containerId = null, receptacleId = null;
      if(dropVal.startsWith('receptacle:')) receptacleId = dropVal.slice('receptacle:'.length);
      else if(dropVal.startsWith('container:')) containerId = dropVal.slice('container:'.length);
      moveInventoryItem(item, containerId, receptacleId);
    }
  });
}

async function moveInventoryItem(item, containerId, receptacleId){
  if((item.container_id||null) === (containerId||null) && (item.receptacle_id||null) === (receptacleId||null)) return;
  try{
    const { error } = await sb.rpc('inventory_update_item', {
      p_id: item.id, p_name: item.name, p_description: item.description, p_image_url: item.image_url,
      p_weight: item.weight, p_quantity: item.quantity, p_container_id: containerId, p_receptacle_id: receptacleId
    });
    if(error) throw error;
    await loadInventoryData();
    renderInventoryOverlay();
  } catch(e){
    console.error('Falha ao mover item', e);
    showToast((e.message && e.message.includes('capacidade')) ? e.message : 'Não consegui mover. Tenta de novo.');
  }
}

// containerId: depósito onde guardar o recipiente, ou null pra voltar a carregar
async function moveInventoryReceptacle(rec, containerId){
  if((rec.container_id||null) === (containerId||null)) return;
  try{
    const { error } = await sb.rpc('inventory_move_receptacle', { p_id: rec.id, p_container_id: containerId });
    if(error) throw error;
    await loadInventoryData();
    renderInventoryOverlay();
    const dest = containerId ? inventoryContainers.find(c=>c.id===containerId) : null;
    showToast(dest ? `${rec.name} guardado em ${dest.name}.` : `${rec.name} voltou pra você.`);
  } catch(e){
    console.error('Falha ao mover recipiente', e);
    showToast((e.message && e.message.includes('capacidade')) ? e.message : 'Não consegui mover. Tenta de novo.');
  }
}

function handleReceptaclePhotoUpload(){

  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    try{
      const { error } = await sb.storage.from('game-images').upload(path, file);
      if(error) throw error;
      const { data } = sb.storage.from('game-images').getPublicUrl(path);
      syncReceptacleFormDraft();
      invRecFormPhoto = data.publicUrl;
      renderInventoryOverlay();
    } catch(e){
      console.error('Falha ao enviar foto', e);
      showToast('Não consegui enviar a foto. Tenta de novo.');

  };

async function openCodex(){
  if(codexOpen) return;
  lockBodyScroll();
  pushAppHistory();
  codexOpen = true;
  codexView = 'grid';
  codexCurrentFolder = null;
  codexEditingId = null;
  codexFolderColor = undefined;
  codexSearchQuery = '';
  codexJustOpened = true;
  const overlay = document.getElementById('codexOverlay');
  overlay.classList.remove('app-overlay-closing');
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Carregando codex…</div>`;
  render();
  try{
    await loadCodexData();
    renderCodexOverlay();
    subscribeCodexRealtime();
  } catch(e){
    console.error('Falha ao abrir o codex', e);
    overlay.innerHTML = `<div class="diary-empty" style="margin-top:60px;">Não consegui carregar o codex agora.</div>`;
  }
}

function closeCodex(){
  if(!codexOpen) return;
  unlockBodyScroll();
  popAppHistory();
  codexOpen = false;
  codexView = 'grid';
  codexEditingId = null;
  const overlay = document.getElementById('codexOverlay');
  const shell = overlay.querySelector('.app-shell');
  if(shell){
    animateExitToIcon(shell, 'codex');
    overlay.classList.add('app-overlay-closing');
    setTimeout(()=>{
      if(codexOpen) return; // reabriu antes de acabar a animação
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      overlay.classList.remove('app-overlay-closing');
    }, APP_EXIT_MS);
  } else {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
  }
  render();
}

async function loadCodexData(){
  const [{ data: folders, error: e1 }, { data: entries, error: e2 }] = await Promise.all([
    sb.from('codex_folders').select('*').order('created_at'),
    sb.from('codex_entries').select('*').order('sort_order')
  ]);
  if(e1) throw e1;
  if(e2) throw e2;
  codexFolders = folders || [];
  codexEntries = entries || [];
}

function subscribeCodexRealtime(){
  if(codexChannel) return;
  codexChannel = sb.channel('codex_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'codex_folders' }, (payload)=>{
      applyRealtimeUpsert(codexFolders, payload);
      requestListRefresh('codex');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'codex_entries' }, (payload)=>{
      applyRealtimeUpsert(codexEntries, payload);
      requestListRefresh('codex');
    })
    .subscribe();
}

function codexIsAtRoot(){
  return codexView === 'grid' && !codexCurrentFolder && !codexSearchQuery;
}

function codexGoBack(){
  if(codexView === 'entryDetail'){ codexView='grid'; codexEditingId=null; renderCodexOverlay(); return; }
  if(codexView === 'entryForm'){ codexView = codexEditingId ? 'entryDetail' : 'grid'; renderCodexOverlay(); return; }
  if(codexView === 'folderForm' || codexView === 'addChooser'){ codexView='grid'; renderCodexOverlay(); return; }
  if(codexView === 'grid' && codexSearchQuery){ codexSearchQuery = ''; renderCodexOverlay(); return; }
  if(codexCurrentFolder){
    const folder = codexFolders.find(f=>f.id===codexCurrentFolder);
    codexCurrentFolder = folder ? (folder.parent_folder_id || null) : null;
    renderCodexOverlay();
    return;
  }
  closeCodex();
}

function renderCodexOverlay(){
  const overlay = document.getElementById('codexOverlay');
  const atRoot = codexIsAtRoot();
  const enterClass = codexJustOpened ? ' app-shell-enter' : '';
  codexJustOpened = false;
  let backDrop = '';
  if(codexView === 'grid' && codexCurrentFolder){
    const folder = codexFolders.find(f=>f.id===codexCurrentFolder);
    const parentId = folder && folder.parent_folder_id ? folder.parent_folder_id : '__root__';
    backDrop = ` data-drop="folder:${parentId}"`;
  }
  overlay.innerHTML = `
    <div class="app-shell app-theme-codex${enterClass}">
      ${renderAppStatusBar()}
      <div class="app-chrome-head">
        <div class="app-chrome-title">Memórias</div>
        <div class="app-chrome-close" id="codexTopBtn"${backDrop} title="${atRoot?'Fechar':'Voltar'}">${atRoot?'✕':'←'}</div>
      </div>

function renderCodexBody(){
  if(codexView === 'folderForm') return renderFolderForm();
  if(codexView === 'entryForm') return renderEntryForm();

  return renderCodexGrid();

function renderCodexGrid(){
  const folder = codexCurrentFolder ? codexFolders.find(f=>f.id===codexCurrentFolder) : null;
  const query = codexSearchQuery.trim().toLowerCase();
  const searching = query.length > 0;

  let subfolders, entriesHere;
  if(searching){
    subfolders = codexFolders.filter(f=> f.name.toLowerCase().includes(query));
    entriesHere = codexEntries.filter(e=> e.title.toLowerCase().includes(query));
  } else {
    subfolders = codexFolders.filter(f=> (f.parent_folder_id||null) === (codexCurrentFolder||null));
    entriesHere = codexEntries.filter(e=> (e.folder_id||null) === (codexCurrentFolder||null));
  }
  subfolders = subfolders.slice().sort((a,b)=> (a.sort_order||0) - (b.sort_order||0));
  entriesHere = entriesHere.slice().sort((a,b)=> (a.sort_order||0) - (b.sort_order||0));

  const hereDrop = 'folder:' + (codexCurrentFolder || '__root__');
  return `
    <div class="inv-section-head">
      <div class="section-title" style="margin:0;">${searching ? 'Resultados da busca' : (folder ? folder.name : 'Início')} ${(!searching && folder) ? `<span class="edit-link" id="codexEditFolder" style="margin-left:8px;">✎ editar</span>` : ''}</div>
    </div>
    <div class="search-input-wrap"><input type="text" class="search-input" id="codexSearchInput" placeholder="Buscar pastas e lembranças..." value="${codexSearchQuery.replace(/"/g,'&quot;')}"></div>
    <div class="inv-add-wrap"><button class="btn btn-accent inv-add-btn" id="codexOpenAdd">+ Adicionar</button></div>
    ${(codexFolders.length || codexEntries.length) ? `<div class="dnd-hint-line">Toque pra abrir · segure e arraste pra mover pra uma pasta ou reordenar.</div>` : ''}
    <div class="codex-grid" ${searching ? '' : `data-drop="${hereDrop}"`}>
      ${subfolders.map((f,i)=>renderFolderTile(f,i)).join('')}
      ${entriesHere.map((e,i)=>renderEntryTile(e, subfolders.length+i)).join('')}
    </div>
    ${(!subfolders.length && !entriesHere.length) ? `<div class="empty-state">${searching ? 'Nada encontrado.' : 'Nada por aqui ainda.'}</div>` : ''}
  `;
}

function setupCodexDrag(){
  const root = document.querySelector('#codexOverlay .app-shell');
  if(!root) return;
  enableDragDrop(root, {
    dragSelector: '[data-open-entry], [data-open-folder]',
    dropSelector: '[data-drop]',
    hint: 'Solte sobre uma pasta (ou nas bordas de uma pasta pra reordenar)',
    onTap: (el)=>{
      if(el.dataset.openFolder){
        if(codexSearchQuery) codexSearchQuery = '';
        codexCurrentFolder = el.dataset.openFolder;
        renderCodexOverlay();
      } else {
        if(codexSearchQuery) codexSearchQuery = '';
        codexView='entryDetail'; codexEditingId=el.dataset.openEntry; renderCodexOverlay();
      }
    },
    onDrop: (dragEl, targetEl, ev)=>{
      const draggedIsFolder = !!dragEl.dataset.openFolder;
      const dropVal = targetEl.dataset.drop;

      if(draggedIsFolder){
        const folder = codexFolders.find(f=>f.id===dragEl.dataset.openFolder);
        if(!folder || !dropVal.startsWith('folder:')) return;
        const raw = dropVal.slice('folder:'.length);
        const targetFolderId = raw === '__root__' ? null : raw;
        if(targetFolderId === folder.id) return;
        const targetIsFolderTile = targetEl.classList.contains('codex-folder-card');
        if(targetIsFolderTile){
          const rect = targetEl.getBoundingClientRect();
          const relX = (ev.clientX - rect.left) / rect.width;
          if(relX < 0.25 || relX > 0.75){
            const targetFolder = codexFolders.find(f=>f.id===targetFolderId);
            if(targetFolder) moveCodexFolderRelative(folder, targetFolder, relX < 0.25);
            return;
          }
        }
        if(isCodexFolderDescendant(targetFolderId, folder.id)){
          showToast('Não dá pra mover uma pasta pra dentro dela mesma.');
          return;
        }
        moveCodexFolder(folder, targetFolderId, null);
        return;
      }

      const entry = codexEntries.find(e=>e.id===dragEl.dataset.openEntry);
      if(!entry) return;
      if(dropVal.startsWith('folder:')){
        const raw = dropVal.slice('folder:'.length);
        const folderId = raw === '__root__' ? null : raw;
        moveCodexEntry(entry, folderId, null);
      } else if(dropVal.startsWith('entry:')){
        const targetId = dropVal.slice('entry:'.length);
        const targetEntry = codexEntries.find(e=>e.id===targetId);
        if(!targetEntry || targetEntry.id === entry.id) return;
        const rect = targetEl.getBoundingClientRect();
        const before = ev.clientX < (rect.left + rect.width/2);
        moveCodexEntryRelative(entry, targetEntry, before);
      }
    }
  });
}

// verdadeiro se folderId é a própria ofAncestorId ou está dentro dela
// (direto ou aninhado) — usado pra impedir mover uma pasta pra dentro
// dela mesma ao arrastar
function isCodexFolderDescendant(folderId, ofAncestorId){
  if(!folderId) return false;
  if(folderId === ofAncestorId) return true;
  let current = codexFolders.find(f=>f.id===folderId);
  while(current && current.parent_folder_id){
    if(current.parent_folder_id === ofAncestorId) return true;
    current = codexFolders.find(f=>f.id===current.parent_folder_id);
  }
  return false;
}

async function moveCodexFolder(folder, parentFolderId, sortOrder){
  if(sortOrder == null){
    const siblings = codexFolders.filter(f => (f.parent_folder_id||null) === (parentFolderId||null) && f.id !== folder.id);
    const maxOrder = siblings.reduce((m,f)=> Math.max(m, f.sort_order||0), -1);
    sortOrder = maxOrder + 1;
  }
  if((folder.parent_folder_id||null) === (parentFolderId||null) && folder.sort_order === sortOrder) return;
  try{
    const { error } = await sb.rpc('codex_set_folder_order', { p_id: folder.id, p_parent_folder_id: parentFolderId, p_sort_order: sortOrder });
    if(error) throw error;
    await loadCodexData();
    renderCodexOverlay();
  } catch(e){
    console.error('Falha ao mover pasta', e);
    showToast('Não consegui mover. Tenta de novo.');
  }
}

function moveCodexFolderRelative(folder, targetFolder, before){
  const parentId = targetFolder.parent_folder_id || null;
  const siblings = codexFolders
    .filter(f => (f.parent_folder_id||null) === parentId && f.id !== folder.id)
    .sort((a,b)=> (a.sort_order||0) - (b.sort_order||0));
  const idx = siblings.findIndex(f=>f.id===targetFolder.id);
  let prevOrder, nextOrder;
  if(before){
    prevOrder = idx > 0 ? (siblings[idx-1].sort_order||0) : (targetFolder.sort_order||0) - 1;
    nextOrder = targetFolder.sort_order||0;
  } else {
    prevOrder = targetFolder.sort_order||0;
    nextOrder = idx < siblings.length-1 ? (siblings[idx+1].sort_order||0) : (targetFolder.sort_order||0) + 1;
  }
  moveCodexFolder(folder, parentId, (prevOrder + nextOrder) / 2);
}

async function moveCodexEntry(entry, folderId, sortOrder){
  if(sortOrder == null){
    const siblings = codexEntries.filter(e => (e.folder_id||null) === (folderId||null) && e.id !== entry.id);
    const maxOrder = siblings.reduce((m,e)=> Math.max(m, e.sort_order||0), -1);
    sortOrder = maxOrder + 1;
  }
  if((entry.folder_id||null) === (folderId||null) && entry.sort_order === sortOrder) return;
  try{
    const { error } = await sb.rpc('codex_set_entry_order', { p_id: entry.id, p_folder_id: folderId, p_sort_order: sortOrder });
    if(error) throw error;
    await loadCodexData();
    renderCodexOverlay();
  } catch(e){
    console.error('Falha ao mover lembrança', e);
    showToast('Não consegui mover. Tenta de novo.');
  }
}

function moveCodexEntryRelative(entry, targetEntry, before){
  const folderId = targetEntry.folder_id || null;
  const siblings = codexEntries
    .filter(e => (e.folder_id||null) === folderId && e.id !== entry.id)
    .sort((a,b)=> (a.sort_order||0) - (b.sort_order||0));
  const idx = siblings.findIndex(e=>e.id===targetEntry.id);
  let prevOrder, nextOrder;
  if(before){
    prevOrder = idx > 0 ? (siblings[idx-1].sort_order||0) : (targetEntry.sort_order||0) - 1;
    nextOrder = targetEntry.sort_order||0;
  } else {
    prevOrder = targetEntry.sort_order||0;
    nextOrder = idx < siblings.length-1 ? (siblings[idx+1].sort_order||0) : (targetEntry.sort_order||0) + 1;
  }
  moveCodexEntry(entry, folderId, (prevOrder + nextOrder) / 2);
}

async function saveFolder(){
  const name = document.getElementById('mFolderName').value.trim();
  if(!name){ showToast('Digita um nome pra pasta.'); return; }
  const existing = codexEditingId ? codexFolders.find(f=>f.id===codexEditingId) : null;
  const color = codexFolderColor !== undefined ? codexFolderColor : (existing ? (existing.color || CODEX_FOLDER_COLORS[0]) : CODEX_FOLDER_COLORS[0]);
  try{
    if(codexEditingId){
      const { error } = await sb.rpc('codex_rename_folder', { p_id: codexEditingId, p_name: name, p_color: color });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('codex_create_folder', { p_name: name, p_parent_folder_id: codexCurrentFolder, p_color: color });
      if(error) throw error;
    }
    await loadCodexData();
    codexView = 'grid';
    renderCodexOverlay();
    showToast('Pasta salva.');
  } catch(e){
    console.error('Falha ao salvar pasta', e);
    showToast('Não consegui salvar. Tenta de novo.');
  }
}

    await loadCodexData();

async function deleteEntry(id){

    if(error) throw error;
    await loadCodexData();
    codexView = 'grid';
    renderCodexOverlay();
    showToast('Removido do codex.');
  } catch(e){
    console.error('Falha ao remover', e);
    showToast('Não consegui remover. Tenta de novo.');
  }
}

function handleCodexPhotoUpload(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/gif,image/webp';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    try{
      const url = await uploadGameImage(file);
      syncEntryFormDraft();
      codexFormPhoto = url;
      renderCodexOverlay();
    } catch(e){
      console.error('Falha ao enviar foto', e);
      showToast('Não consegui enviar a foto. Tenta de novo.');
    }
  };
  input.click();
}

/* ============================================================
   ZOOM (Ctrl + scroll) — só ativo no app desktop
   ============================================================ */
if(window.electronAPI){
  let zoomLevel = 1;
  window.addEventListener('wheel', (e)=>{
    if(!e.ctrlKey) return;
    e.preventDefault();
    zoomLevel += (e.deltaY < 0 ? 0.07 : -0.07);
    zoomLevel = Math.min(2.2, Math.max(0.6, zoomLevel));
    document.body.style.zoom = zoomLevel;
  }, { passive:false });
}

document.getElementById('diaryTrigger').onclick = openDiary;

// permite colar (Ctrl+V) uma imagem direto no formulário de personagem
// ou de lembrança do codex, sem precisar abrir o seletor de arquivo.
// Só age quando um desses formulários está mesmo aberto — em qualquer
// outro contexto (ex: diário, que já tem o próprio tratamento de colar
// imagem no editor) o evento passa intocado.
document.addEventListener('paste', async (e)=>{
  const inCharacterForm = isMaster && (ui.modal === 'addCharacter' || ui.modal === 'characterDetail');
  const inCodexEntryForm = codexOpen && codexView === 'entryForm';
  if(!inCharacterForm && !inCodexEntryForm) return;

  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  let file = null;
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){ file = item.getAsFile(); break; }
  }
  if(!file) return;
  e.preventDefault();

  try{
    const url = await uploadGameImage(file);
    if(inCharacterForm){
      syncCharacterFormFromDom();
      ui.modalData.photo = url;
      render();
    } else {
      syncEntryFormDraft();
      codexFormPhoto = url;
      renderCodexOverlay();
    }
    showToast('Foto colada.');
  } catch(err){
    console.error('Falha ao colar foto', err);
    showToast('Não consegui colar a foto. Tenta de novo.');
  }
});

if(masterToken){
  // já tem um token salvo de uma sessão de mestre anterior — tenta usar direto
  isMaster = true;
  loadState();
} else {
  render(); // mostra a tela de escolha mestre/jogador
}

/* ---------- PWA: instalar como app (Android + iOS) ---------- */
let deferredInstallPrompt = null;
const INSTALL_DISMISS_KEY = 'subrosa_install_dismissed';

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.error('Falha ao registrar service worker', err);
    });
  });
}

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function isIosDevice(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Android/Chrome: intercepta o prompt automático pra mostrar nosso próprio banner
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBanner();
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  renderInstallBanner();
});

function dismissInstallBanner(){
  try{ localStorage.setItem(INSTALL_DISMISS_KEY, '1'); } catch(e){}
  renderInstallBanner();
}

function renderInstallBanner(){
  const el = document.getElementById('installBanner');
  if(!el) return;

  let dismissed = false;
  try{ dismissed = localStorage.getItem(INSTALL_DISMISS_KEY) === '1'; } catch(e){}

  if(isStandaloneMode() || dismissed){
    el.innerHTML = '';
    return;
  }

  const ios = isIosDevice();
  // no Android/Chrome só mostra depois que o navegador liberou o beforeinstallprompt;
  // no iOS não existe esse evento, então mostra direto a instrução manual
  if(!ios && !deferredInstallPrompt){
    el.innerHTML = '';
    return;
  }

  el.innerHTML = `
    <div class="install-banner">
      <div class="install-banner-icon">🐱</div>
      <div class="install-banner-body">
        <div class="install-banner-title">Instalar o SUBROSA</div>
        <div class="install-banner-sub">${ios
          ? 'Toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.'
          : 'Adicione à tela inicial pra abrir como um app, sem barra de navegador.'}</div>
      </div>
      ${ios ? '' : '<button class="install-banner-btn" id="installBannerAction">Instalar</button>'}
      <button class="install-banner-close" id="installBannerClose" aria-label="Fechar">✕</button>
    </div>
  `;

  const closeBtn = document.getElementById('installBannerClose');
  if(closeBtn) closeBtn.onclick = dismissInstallBanner;

  const actionBtn = document.getElementById('installBannerAction');
  if(actionBtn){
    actionBtn.onclick = async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if(outcome === 'accepted' || outcome === 'dismissed') deferredInstallPrompt = null;
      renderInstallBanner();
    };
  }
}

if(isIosDevice() && !isStandaloneMode()) renderInstallBanner();
</script>
